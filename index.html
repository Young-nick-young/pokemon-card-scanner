<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pokémon Inventory Scanner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  color:#222;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:21px;
  margin:5px 0 12px;
}

.box{
  background:white;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
}

#status{
  text-align:center;
  font-weight:bold;
}

#progress{
  margin-top:6px;
  font-size:12px;
  font-weight:normal;
  color:#666;
}

#sheetStatus{
  margin-top:7px;
  text-align:center;
  font-size:11px;
  color:#777;
}

button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{opacity:.5}

#startButton{
  background:#222;
  color:white;
}

#scanButton{
  display:none;
  background:#1976d2;
  color:white;
}

#cameraBox{
  display:none;
  position:relative;
  width:100%;
  overflow:hidden;
  background:#111;
  border-radius:14px;
  margin-bottom:10px;
}

#video{
  display:block;
  width:100%;
  height:auto;
}

/* LOCKED WHITE GUIDE — 73 mm × 98 mm */
#cardGuide {
  position:absolute;
  width:73%;
  aspect-ratio:73 / 98;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px solid white;
  border-radius:14px;
  pointer-events:none;
}

#guideText{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  color:white;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  white-space:nowrap;
}

#cropCanvas{display:none}
#candidateBox{display:none}
#selectedBox{display:none}

.sectionTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

.helpText{
  font-size:12px;
  color:#666;
  margin-bottom:9px;
}

.candidate{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px;
  margin-top:8px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fafafa;
  cursor:pointer;
}

.candidate:first-child{
  border-color:#8ab4f8;
  background:#eef5ff;
}

.candidate img{
  width:68px;
  border-radius:6px;
}

.candidateInfo{flex:1}

.candidateName{
  font-size:16px;
  font-weight:bold;
}

.candidateNumber{
  margin-top:3px;
  font-size:14px;
}

.candidateScore{
  margin-top:4px;
  font-size:11px;
  color:#888;
}

.choose{font-size:22px}

#manualArea{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #ddd;
}

.manualRow{
  display:flex;
  gap:7px;
}

#manualNumber{
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid #bbb;
  border-radius:9px;
  font-size:17px;
}

#manualButton{
  width:auto;
  margin:0;
  background:#444;
  color:white;
  padding:12px 16px;
}

#manualError{
  display:none;
  color:#b00020;
  font-size:12px;
  margin-top:7px;
}

.cardHeader{
  display:flex;
  gap:14px;
  align-items:flex-start;
}

#selectedImage{
  width:115px;
  border-radius:8px;
}

.cardDetails{flex:1}

#selectedName{
  font-size:20px;
  font-weight:bold;
}

#selectedNumber{
  margin-top:4px;
  font-size:16px;
  font-weight:bold;
}

#selectedRarity,
#selectedType{
  margin-top:4px;
  font-size:13px;
  color:#666;
}

#recognitionInfo{
  margin-top:8px;
  padding:7px;
  background:#f2f7ff;
  border-radius:7px;
  font-size:11px;
  color:#555;
}

.variantTitle{
  margin-top:14px;
  font-size:13px;
  font-weight:bold;
}

.variant{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
}

#normalButton{background:#1976d2}
#reverseButton{background:#7b1fa2}
#holoButton{background:#00897b}
#otherButton{background:#555}

.count{
  background:rgba(255,255,255,.22);
  padding:4px 9px;
  border-radius:20px;
}

#wrongButton{
  background:#eee;
  color:#333;
}

#saved{
  display:none;
  margin-top:10px;
  padding:11px;
  border-radius:9px;
  background:#e3f5e7;
  color:#176b2c;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Pokémon Inventory Scanner</h1>

<div class="box">
  <div id="status">
    Preparing scanner...
    <div id="progress">Connecting to recognizer.</div>
  </div>

  <button id="startButton" disabled>PLEASE WAIT...</button>
  <button id="scanButton">🔍 SCAN CARD</button>

  <div id="sheetStatus">
    Connecting to Google Sheet...
  </div>
</div>

<div id="cameraBox">
  <video id="video" autoplay muted playsinline></video>
  <div id="cardGuide"></div>
  <div id="guideText">Place card inside white frame</div>
</div>

<canvas id="cropCanvas"></canvas>

<div id="candidateBox" class="box">
  <div class="sectionTitle">Which card is this?</div>
  <div class="helpText">Tap the correct card.</div>

  <div id="candidateList"></div>

  <div id="manualArea">
    <div class="helpText">Not listed? Enter the card number.</div>

    <div class="manualRow">
      <input id="manualNumber"
             inputmode="numeric"
             pattern="[0-9]*"
             placeholder="e.g. 153">

      <button id="manualButton">FIND</button>
    </div>

    <div id="manualError">Card number not found.</div>
  </div>
</div>

<div id="selectedBox" class="box">

  <div class="cardHeader">
    <img id="selectedImage">

    <div class="cardDetails">
      <div id="selectedName"></div>
      <div id="selectedNumber"></div>
      <div id="selectedRarity"></div>
      <div id="selectedType"></div>
      <div id="recognitionInfo"></div>
    </div>
  </div>

  <div class="variantTitle">
    WHICH VERSION ARE YOU ADDING?
  </div>

  <button id="normalButton" class="variant">
    <span>+ NORMAL</span>
    <span id="normalCount" class="count">0</span>
  </button>

  <button id="reverseButton" class="variant">
    <span>+ REVERSE HOLO</span>
    <span id="reverseCount" class="count">0</span>
  </button>

  <button id="holoButton" class="variant">
    <span>+ HOLO</span>
    <span id="holoCount" class="count">0</span>
  </button>

  <button id="otherButton" class="variant">
    <span>+ OTHER</span>
    <span id="otherCount" class="count">0</span>
  </button>

  <div id="saved">✓ Added to Google Sheet</div>

  <button id="wrongButton">← WRONG CARD / OTHER MATCHES</button>

</div>

</div>

<iframe
  name="sheetUpdateFrame"
  id="sheetUpdateFrame"
  style="display:none">
</iframe>

<script>

/* =========================================
   SETTINGS
========================================= */

const SCRIPT_URL =
"https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbwDF5oxhER534DF16jG94SHwJ9jS2ySAWJXIKgUsOpXjsdy26JKiu1FOIAsQnOqk_6f/exec";

const RECOGNIZER_URL =
"https://pokemon-card-recognizer.onrender.com";

const MAX_CARD = 244;
const IMAGE_SET = "sv10";
const DENOMINATOR = 182;

/*
  Small upload size.

  This is deliberate.

  SIFT does NOT need a 1920px image from the
  phone to identify the card.

  Smaller image = much faster server processing.
*/
const UPLOAD_WIDTH = 360;
const UPLOAD_HEIGHT = 483;


/* =========================================
   STATE
========================================= */

let inventoryCards = [];
let inventoryByNumber = {};
let stream = null;
let rankedMatches = [];
let currentCard = null;
let currentRecognition = null;


/* =========================================
   ELEMENTS
========================================= */

const status = document.getElementById("status");
const progress = document.getElementById("progress");
const sheetStatus = document.getElementById("sheetStatus");

const startButton = document.getElementById("startButton");
const scanButton = document.getElementById("scanButton");

const cameraBox = document.getElementById("cameraBox");
const video = document.getElementById("video");
const cardGuide = document.getElementById("cardGuide");
const cropCanvas = document.getElementById("cropCanvas");

const candidateBox = document.getElementById("candidateBox");
const candidateList = document.getElementById("candidateList");

const manualNumber = document.getElementById("manualNumber");
const manualButton = document.getElementById("manualButton");
const manualError = document.getElementById("manualError");

const selectedBox = document.getElementById("selectedBox");
const selectedImage = document.getElementById("selectedImage");
const selectedName = document.getElementById("selectedName");
const selectedNumber = document.getElementById("selectedNumber");
const selectedRarity = document.getElementById("selectedRarity");
const selectedType = document.getElementById("selectedType");
const recognitionInfo = document.getElementById("recognitionInfo");

const normalButton = document.getElementById("normalButton");
const reverseButton = document.getElementById("reverseButton");
const holoButton = document.getElementById("holoButton");
const otherButton = document.getElementById("otherButton");

const normalCount = document.getElementById("normalCount");
const reverseCount = document.getElementById("reverseCount");
const holoCount = document.getElementById("holoCount");
const otherCount = document.getElementById("otherCount");

const saved = document.getElementById("saved");
const wrongButton = document.getElementById("wrongButton");


/* =========================================
   GOOGLE SHEET
========================================= */

window.receiveCards = function(cards){

  inventoryCards = cards || [];
  inventoryByNumber = {};

  inventoryCards.forEach(card => {
    inventoryByNumber[Number(card.number)] = card;
  });

  sheetStatus.innerText =
    `✓ Google Sheet connected • ${inventoryCards.length} cards`;
};


function loadInventory(){

  const script = document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?api=cards" +
    "&callback=receiveCards" +
    "&t=" +
    Date.now();

  script.onerror = function(){
    sheetStatus.innerText =
      "⚠ Google Sheet connection failed.";
  };

  document.body.appendChild(script);
}


/* =========================================
   INITIALIZE RECOGNIZER
========================================= */

async function initialize(){

  loadInventory();

  status.firstChild.textContent =
    "Connecting to recognizer...";

  progress.innerText =
    "Checking the Destined Rivals card library.";

  try{

    /*
      Render free tier may be asleep.
      Give it enough time to wake.
    */

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        70000
      );

    const response =
      await fetch(
        RECOGNIZER_URL + "/",
        {
          cache:"no-store",
          signal:controller.signal
        }
      );

    clearTimeout(timeout);

    if(!response.ok){
      throw new Error("Server unavailable.");
    }

    const data =
      await response.json();

    if(!data.library_ready){

      status.firstChild.textContent =
        "Recognizer warming up...";

      progress.innerText =
        "Preparing 244 Destined Rivals cards.";

      let ready = false;

      for(let i=0;i<40;i++){

        await sleep(2000);

        try{

          const check =
            await fetch(
              RECOGNIZER_URL + "/",
              {cache:"no-store"}
            );

          const result =
            await check.json();

          if(result.library_ready){
            ready = true;
            break;
          }

        }catch(error){}
      }

      if(!ready){
        throw new Error(
          "Recognizer is taking too long to prepare."
        );
      }
    }

    status.firstChild.textContent =
      "✓ Scanner ready";

    progress.innerText =
      "Press START CAMERA.";

    startButton.disabled = false;
    startButton.innerText =
      "📷 START CAMERA";

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Recognizer unavailable";

    progress.innerText =
      "Render may be waking up. Refresh in about one minute.";
  }
}


function sleep(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1920},
          height:{ideal:1080}
        },

        audio:false
      });

    video.srcObject = stream;

    await video.play();

    cameraBox.style.display =
      "block";

    startButton.style.display =
      "none";

    scanButton.style.display =
      "block";

    status.firstChild.textContent =
      "Camera ready";

    progress.innerText =
      "Place a card inside the white frame.";

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Camera could not start";

    progress.innerText =
      error.message;
  }
}


/* =========================================
   CAPTURE ENTIRE WHITE GUIDE
========================================= */

function captureGuide(){

  const videoRect =
    video.getBoundingClientRect();

  const guideRect =
    cardGuide.getBoundingClientRect();

  const scaleX =
    video.videoWidth /
    videoRect.width;

  const scaleY =
    video.videoHeight /
    videoRect.height;

  /*
    Capture the ENTIRE white guide.

    We intentionally keep the small margin
    around the physical card.

    SIFT can handle this and it prevents
    slightly rotated cards being chopped off.
  */

  let sourceX =
    (guideRect.left - videoRect.left) *
    scaleX;

  let sourceY =
    (guideRect.top - videoRect.top) *
    scaleY;

  let sourceWidth =
    guideRect.width * scaleX;

  let sourceHeight =
    guideRect.height * scaleY;

  /*
    Protect against rounding placing the crop
    outside the video.
  */

  sourceX =
    Math.max(0,sourceX);

  sourceY =
    Math.max(0,sourceY);

  sourceWidth =
    Math.min(
      sourceWidth,
      video.videoWidth-sourceX
    );

  sourceHeight =
    Math.min(
      sourceHeight,
      video.videoHeight-sourceY
    );

  cropCanvas.width =
    UPLOAD_WIDTH;

  cropCanvas.height =
    UPLOAD_HEIGHT;

  const ctx =
    cropCanvas.getContext(
      "2d",
      {alpha:false}
    );

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceWidth,
    sourceHeight,

    0,
    0,
    UPLOAD_WIDTH,
    UPLOAD_HEIGHT
  );

  return cropCanvas;
}


/* =========================================
   JPEG
========================================= */

function canvasToBlob(canvas){

  return new Promise(
    (resolve,reject) => {

      canvas.toBlob(
        function(blob){

          if(blob){
            resolve(blob);
          }else{
            reject(
              new Error(
                "Could not capture image."
              )
            );
          }

        },

        "image/jpeg",

        /*
          0.82 is plenty for SIFT while keeping
          the upload very small.
        */
        0.82
      );
    }
  );
}


/* =========================================
   RECOGNITION REQUEST
========================================= */

async function recognizeCard(blob){

  const formData =
    new FormData();

  formData.append(
    "file",
    blob,
    "card.jpg"
  );

  /*
    Allow up to 90 seconds.

    This protects against a sleeping Render
    instance without allowing the scanner to
    hang forever.
  */

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      90000
    );

  let response;

  try{

    response =
      await fetch(
        RECOGNIZER_URL + "/recognize",
        {
          method:"POST",
          body:formData,
          signal:controller.signal
        }
      );

  }catch(error){

    if(error.name === "AbortError"){
      throw new Error(
        "Recognition timed out. Please scan again."
      );
    }

    throw error;

  }finally{

    clearTimeout(timeout);
  }

  if(!response.ok){

    let message =
      "Recognition server error.";

    try{

      const errorData =
        await response.json();

      message =
        errorData.detail || message;

    }catch(error){}

    throw new Error(message);
  }

  return await response.json();
}


/* =========================================
   SCAN CARD
========================================= */

async function scanCard(){

  scanButton.disabled = true;
  scanButton.innerText =
    "ANALYZING...";

  candidateBox.style.display =
    "none";

  selectedBox.style.display =
    "none";

  manualError.style.display =
    "none";

  status.firstChild.textContent =
    "Recognizing card...";

  progress.innerText =
    "Comparing against 244 Destined Rivals cards.";

  /*
    If recognition takes longer than expected,
    explain why instead of appearing frozen.
  */

  const slowMessage =
    setTimeout(
      function(){

        progress.innerText =
          "Still working — the recognition server may be waking up.";

      },
      8000
    );

  const verySlowMessage =
    setTimeout(
      function(){

        progress.innerText =
          "Still recognizing. First scan after inactivity can take longer.";

      },
      25000
    );

  try{

    const canvas =
      captureGuide();

    const blob =
      await canvasToBlob(canvas);

    console.log(
      "Upload size:",
      Math.round(blob.size/1024),
      "KB"
    );

    const result =
      await recognizeCard(blob);

    clearTimeout(slowMessage);
    clearTimeout(verySlowMessage);

    if(
      result.status !== "matched" ||
      !result.best_match
    ){

      throw new Error(
        "No reliable match was found."
      );
    }

    currentRecognition =
      result;

    rankedMatches =
      (result.top_matches || [])
      .map(match => ({

        number:
          Number(match.number),

        score:
          Number(match.score || 0),

        good_matches:
          Number(match.good_matches || 0),

        inliers:
          Number(match.inliers || 0),

        inlier_ratio:
          Number(match.inlier_ratio || 0)

      }));

    /*
      Ensure best match is first.
    */

    const bestNumber =
      Number(
        result.best_match.number
      );

    if(
      !rankedMatches.some(
        match =>
          match.number === bestNumber
      )
    ){

      rankedMatches.unshift({

        number:bestNumber,

        score:
          Number(
            result.best_match.score || 0
          ),

        good_matches:
          Number(
            result.best_match.good_matches || 0
          ),

        inliers:
          Number(
            result.best_match.inliers || 0
          ),

        inlier_ratio:
          Number(
            result.best_match.inlier_ratio || 0
          )
      });
    }

    /*
      Put actual best match first even if
      backend order ever changes.
    */

    rankedMatches.sort(
      (a,b) => {

        if(a.number === bestNumber){
          return -1;
        }

        if(b.number === bestNumber){
          return 1;
        }

        return b.score-a.score;
      }
    );

    if(
      result.confident === true &&
      inventoryByNumber[bestNumber]
    ){

      chooseCard(
        bestNumber,
        result.best_match
      );

      status.firstChild.textContent =
        "✓ Card recognized";

      progress.innerText =
        "Choose the version you are adding.";

    }else{

      showCandidates();

      status.firstChild.textContent =
        "Check the match";

      progress.innerText =
        "The scanner is not fully confident. Tap the correct card.";
    }

  }catch(error){

    clearTimeout(slowMessage);
    clearTimeout(verySlowMessage);

    console.error(error);

    status.firstChild.textContent =
      "Scan failed";

    progress.innerText =
      error.message;

  }finally{

    scanButton.disabled = false;

    scanButton.innerText =
      "🔍 SCAN AGAIN";
  }
}


/* =========================================
   CANDIDATES
========================================= */

function showCandidates(){

  candidateList.innerHTML = "";

  rankedMatches
  .slice(0,5)
  .forEach(match => {

    const card =
      inventoryByNumber[
        match.number
      ];

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "candidate";

    const image =
      document.createElement(
        "img"
      );

    image.src =
      `https://images.pokemontcg.io/${IMAGE_SET}/${match.number}.png`;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "candidateInfo";

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "candidateName";

    name.innerText =
      card
      ? card.name
      : "Destined Rivals Card";

    const number =
      document.createElement(
        "div"
      );

    number.className =
      "candidateNumber";

    number.innerText =
      "#" +
      String(match.number)
      .padStart(3,"0") +
      "/" +
      DENOMINATOR;

    const score =
      document.createElement(
        "div"
      );

    score.className =
      "candidateScore";

    const ratio =
      Math.round(
        match.inlier_ratio * 100
      );

    score.innerText =
      `${match.inliers} geometric matches` +
      (ratio
        ? ` • ${ratio}% agreement`
        : "");

    const choose =
      document.createElement(
        "div"
      );

    choose.className =
      "choose";

    choose.innerText =
      "›";

    info.appendChild(name);
    info.appendChild(number);
    info.appendChild(score);

    row.appendChild(image);
    row.appendChild(info);
    row.appendChild(choose);

    row.addEventListener(
      "click",
      function(){

        chooseCard(
          match.number,
          match
        );
      }
    );

    candidateList.appendChild(
      row
    );
  });

  candidateBox.style.display =
    "block";

  candidateBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* =========================================
   MANUAL CARD NUMBER
========================================= */

function findManualCard(){

  manualError.style.display =
    "none";

  const number =
    Number(
      manualNumber.value
    );

  if(
    !number ||
    number < 1 ||
    number > MAX_CARD
  ){

    manualError.innerText =
      "Enter a card number from 1 to 244.";

    manualError.style.display =
      "block";

    return;
  }

  if(!inventoryByNumber[number]){

    manualError.innerText =
      "That card was not found in the Google Sheet.";

    manualError.style.display =
      "block";

    return;
  }

  chooseCard(
    number,
    null
  );
}


/* =========================================
   SELECT CARD
========================================= */

function chooseCard(
  number,
  recognitionMatch=null
){

  const card =
    inventoryByNumber[
      Number(number)
    ];

  if(!card){

    manualError.innerText =
      "Google Sheet data is not available for this card.";

    manualError.style.display =
      "block";

    return;
  }

  currentCard = card;

  selectedImage.src =
    `https://images.pokemontcg.io/${IMAGE_SET}/${Number(card.number)}.png`;

  selectedName.innerText =
    card.name;

  selectedNumber.innerText =
    "#" +
    String(card.number)
    .padStart(3,"0") +
    "/" +
    DENOMINATOR;

  selectedRarity.innerText =
    card.rarity || "";

  selectedType.innerText =
    card.type || "";

  if(recognitionMatch){

    const inliers =
      Number(
        recognitionMatch.inliers || 0
      );

    const ratio =
      Math.round(
        Number(
          recognitionMatch.inlier_ratio || 0
        ) * 100
      );

    recognitionInfo.style.display =
      "block";

    recognitionInfo.innerText =
      `Recognition: ${inliers} verified matches` +
      (ratio
        ? ` • ${ratio}% geometric agreement`
        : "");

  }else{

    recognitionInfo.style.display =
      "none";
  }

  updateCounts();

  /*
    Reverse Holo only appears when this card
    supports it in the inventory data.
  */

  if(card.reverse === null){

    reverseButton.style.display =
      "none";

  }else{

    reverseButton.style.display =
      "flex";
  }

  saved.style.display =
    "none";

  candidateBox.style.display =
    "none";

  selectedBox.style.display =
    "block";

  status.firstChild.textContent =
    "Card selected";

  progress.innerText =
    "Choose the version you are adding.";

  selectedBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* =========================================
   COUNTS
========================================= */

function updateCounts(){

  if(!currentCard){
    return;
  }

  normalCount.innerText =
    Number(
      currentCard.normal
    ) || 0;

  reverseCount.innerText =
    currentCard.reverse === null
    ? "-"
    : Number(
        currentCard.reverse
      ) || 0;

  holoCount.innerText =
    Number(
      currentCard.holo
    ) || 0;

  otherCount.innerText =
    Number(
      currentCard.other
    ) || 0;
}


/* =========================================
   ADD TO GOOGLE SHEET
========================================= */

function addCard(variant){

  if(!currentCard){
    return;
  }

  if(
    variant === "reverse" &&
    currentCard.reverse === null
  ){
    return;
  }

  currentCard[variant] =
    (
      Number(
        currentCard[variant]
      ) || 0
    ) + 1;

  updateCounts();

  const form =
    document.createElement(
      "form"
    );

  form.method =
    "POST";

  form.action =
    SCRIPT_URL;

  form.target =
    "sheetUpdateFrame";

  form.style.display =
    "none";

  const fields = {
    action:"changeQuantity",
    row:currentCard.row,
    variant:variant,
    change:1
  };

  Object.entries(fields)
  .forEach(
    ([name,value]) => {

      const input =
        document.createElement(
          "input"
        );

      input.type =
        "hidden";

      input.name =
        name;

      input.value =
        value;

      form.appendChild(
        input
      );
    }
  );

  document.body.appendChild(
    form
  );

  form.submit();

  setTimeout(
    () => form.remove(),
    1000
  );

  saved.innerText =
    "✓ Added to Google Sheet";

  saved.style.display =
    "block";

  setTimeout(
    resetForNextCard,
    850
  );
}


/* =========================================
   RESET
========================================= */

function resetForNextCard(){

  currentCard = null;
  currentRecognition = null;
  rankedMatches = [];

  manualNumber.value = "";

  manualError.style.display =
    "none";

  saved.style.display =
    "none";

  selectedBox.style.display =
    "none";

  candidateBox.style.display =
    "none";

  status.firstChild.textContent =
    "Ready for next card";

  progress.innerText =
    "Place the next card inside the white frame.";

  scanButton.innerText =
    "🔍 SCAN CARD";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================
   EVENTS
========================================= */

startButton.addEventListener(
  "click",
  startCamera
);

scanButton.addEventListener(
  "click",
  scanCard
);

manualButton.addEventListener(
  "click",
  findManualCard
);

manualNumber.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      findManualCard();
    }
  }
);

normalButton.addEventListener(
  "click",
  () => addCard("normal")
);

reverseButton.addEventListener(
  "click",
  () => addCard("reverse")
);

holoButton.addEventListener(
  "click",
  () => addCard("holo")
);

otherButton.addEventListener(
  "click",
  () => addCard("other")
);

wrongButton.addEventListener(
  "click",
  function(){

    selectedBox.style.display =
      "none";

    if(rankedMatches.length){

      showCandidates();

      status.firstChild.textContent =
        "Choose the correct card";

      progress.innerText =
        "Select a candidate or enter the card number.";

    }else{

      candidateBox.style.display =
        "block";

      status.firstChild.textContent =
        "Enter card number";

      progress.innerText =
        "Use the manual card number box.";
    }
  }
);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
  "pagehide",
  function(){

    if(stream){

      stream
      .getTracks()
      .forEach(
        track => track.stop()
      );
    }
  }
);


/* =========================================
   START
========================================= */

initialize();

</script>

</body>
</html>
