<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pokémon Inventory Scanner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  color:#222;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:21px;
  margin:5px 0 12px;
}

.box{
  background:white;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
}

#status{
  text-align:center;
  font-weight:bold;
}

#progress{
  margin-top:6px;
  font-size:12px;
  font-weight:normal;
  color:#666;
}

#sheetStatus{
  margin-top:7px;
  text-align:center;
  font-size:11px;
  color:#777;
}

button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

#startButton{
  background:#222;
  color:white;
}

#scanButton{
  display:none;
  background:#1976d2;
  color:white;
}

#cameraBox{
  display:none;
  position:relative;
  width:100%;
  overflow:hidden;
  background:#111;
  border-radius:14px;
  margin-bottom:10px;
}

#video{
  display:block;
  width:100%;
  height:auto;
}

/* LOCKED 73 × 98 GUIDE — DO NOT CHANGE */
#cardGuide{
  position:absolute;
  width:73%;
  aspect-ratio:73 / 98;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px solid white;
  border-radius:14px;
  pointer-events:none;
}

#guideText{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  color:white;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  white-space:nowrap;
}

#cropCanvas{
  display:none;
}

#candidateBox{
  display:none;
}

.sectionTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

.helpText{
  font-size:12px;
  color:#666;
  margin-bottom:9px;
}

.candidate{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px;
  margin-top:8px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fafafa;
  cursor:pointer;
}

.candidate:first-child{
  border-color:#8ab4f8;
  background:#eef5ff;
}

.candidate img{
  width:68px;
  border-radius:6px;
}

.candidateInfo{
  flex:1;
}

.candidateName{
  font-size:16px;
  font-weight:bold;
}

.candidateNumber{
  margin-top:3px;
  font-size:14px;
}

.candidateScore{
  margin-top:4px;
  font-size:11px;
  color:#888;
}

.choose{
  font-size:22px;
}

#manualArea{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #ddd;
}

.manualRow{
  display:flex;
  gap:7px;
}

#manualNumber{
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid #bbb;
  border-radius:9px;
  font-size:17px;
}

#manualButton{
  width:auto;
  margin:0;
  background:#444;
  color:white;
  padding:12px 16px;
}

#manualError{
  display:none;
  color:#b00020;
  font-size:12px;
  margin-top:7px;
}

#selectedBox{
  display:none;
}

.cardHeader{
  display:flex;
  gap:14px;
  align-items:flex-start;
}

#selectedImage{
  width:115px;
  border-radius:8px;
}

.cardDetails{
  flex:1;
}

#selectedName{
  font-size:20px;
  font-weight:bold;
}

#selectedNumber{
  margin-top:4px;
  font-size:16px;
  font-weight:bold;
}

#selectedRarity,
#selectedType{
  margin-top:4px;
  font-size:13px;
  color:#666;
}

.variantTitle{
  margin-top:14px;
  font-size:13px;
  font-weight:bold;
}

.variant{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
}

#normalButton{background:#1976d2}
#reverseButton{background:#7b1fa2}
#holoButton{background:#00897b}
#otherButton{background:#555}

.count{
  background:rgba(255,255,255,.22);
  padding:4px 9px;
  border-radius:20px;
}

#wrongButton{
  background:#eee;
  color:#333;
}

#saved{
  display:none;
  margin-top:10px;
  padding:11px;
  border-radius:9px;
  background:#e3f5e7;
  color:#176b2c;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Pokémon Inventory Scanner</h1>

<div class="box">

  <div id="status">
    Preparing scanner...
    <div id="progress">Connecting to recognizer.</div>
  </div>

  <button id="startButton" disabled>
    PLEASE WAIT...
  </button>

  <button id="scanButton">
    🔍 SCAN CARD
  </button>

  <div id="sheetStatus">
    Connecting to Google Sheet...
  </div>

</div>

<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="cardGuide"></div>

  <div id="guideText">
    Place card inside white frame
  </div>

</div>

<canvas id="cropCanvas"></canvas>

<div id="candidateBox" class="box">

  <div class="sectionTitle">
    Which card is this?
  </div>

  <div class="helpText">
    Tap the correct card.
  </div>

  <div id="candidateList"></div>

  <div id="manualArea">

    <div class="helpText">
      Not listed? Enter the card number.
    </div>

    <div class="manualRow">

      <input
        id="manualNumber"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="e.g. 153">

      <button id="manualButton">
        FIND
      </button>

    </div>

    <div id="manualError">
      Card number not found.
    </div>

  </div>

</div>

<div id="selectedBox" class="box">

  <div class="cardHeader">

    <img id="selectedImage">

    <div class="cardDetails">

      <div id="selectedName"></div>
      <div id="selectedNumber"></div>
      <div id="selectedRarity"></div>
      <div id="selectedType"></div>

    </div>

  </div>

  <div class="variantTitle">
    WHICH VERSION ARE YOU ADDING?
  </div>

  <button id="normalButton" class="variant">
    <span>+ NORMAL</span>
    <span id="normalCount" class="count">0</span>
  </button>

  <button id="reverseButton" class="variant">
    <span>+ REVERSE HOLO</span>
    <span id="reverseCount" class="count">0</span>
  </button>

  <button id="holoButton" class="variant">
    <span>+ HOLO</span>
    <span id="holoCount" class="count">0</span>
  </button>

  <button id="otherButton" class="variant">
    <span>+ OTHER</span>
    <span id="otherCount" class="count">0</span>
  </button>

  <div id="saved">
    ✓ Added to Google Sheet
  </div>

  <button id="wrongButton">
    ← WRONG CARD
  </button>

</div>

</div>

<iframe
  name="sheetUpdateFrame"
  id="sheetUpdateFrame"
  style="display:none">
</iframe>

<script>

/* ===============================
   SETTINGS
================================ */

const SCRIPT_URL =
"https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbwDF5oxhER534DF16jG94SHwJ9jS2ySAWJXIKgUsOpXjsdy26JKiu1FOIAsQnOqk_6f/exec";

const RECOGNIZER_URL =
"https://pokemon-card-recognizer.onrender.com";

const MAX_CARD = 244;
const IMAGE_SET = "sv10";
const DENOMINATOR = 182;


/* ===============================
   STATE
================================ */

let inventoryCards = [];
let inventoryByNumber = {};
let stream = null;
let rankedMatches = [];
let currentCard = null;


/* ===============================
   ELEMENTS
================================ */

const status = document.getElementById("status");
const progress = document.getElementById("progress");
const sheetStatus = document.getElementById("sheetStatus");

const startButton = document.getElementById("startButton");
const scanButton = document.getElementById("scanButton");

const cameraBox = document.getElementById("cameraBox");
const video = document.getElementById("video");
const cardGuide = document.getElementById("cardGuide");
const cropCanvas = document.getElementById("cropCanvas");

const candidateBox = document.getElementById("candidateBox");
const candidateList = document.getElementById("candidateList");

const manualNumber = document.getElementById("manualNumber");
const manualButton = document.getElementById("manualButton");
const manualError = document.getElementById("manualError");

const selectedBox = document.getElementById("selectedBox");
const selectedImage = document.getElementById("selectedImage");
const selectedName = document.getElementById("selectedName");
const selectedNumber = document.getElementById("selectedNumber");
const selectedRarity = document.getElementById("selectedRarity");
const selectedType = document.getElementById("selectedType");

const normalButton = document.getElementById("normalButton");
const reverseButton = document.getElementById("reverseButton");
const holoButton = document.getElementById("holoButton");
const otherButton = document.getElementById("otherButton");

const normalCount = document.getElementById("normalCount");
const reverseCount = document.getElementById("reverseCount");
const holoCount = document.getElementById("holoCount");
const otherCount = document.getElementById("otherCount");

const saved = document.getElementById("saved");
const wrongButton = document.getElementById("wrongButton");


/* ===============================
   GOOGLE SHEET
================================ */

window.receiveCards = function(cards){

  inventoryCards = cards || [];
  inventoryByNumber = {};

  inventoryCards.forEach(card => {
    inventoryByNumber[Number(card.number)] = card;
  });

  sheetStatus.innerText =
    `✓ Google Sheet connected • ${inventoryCards.length} cards`;
};


function loadInventory(){

  const script = document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?api=cards" +
    "&callback=receiveCards" +
    "&t=" +
    Date.now();

  script.onerror = () => {
    sheetStatus.innerText =
      "⚠ Google Sheet connection failed.";
  };

  document.body.appendChild(script);
}


/* ===============================
   CHECK RENDER BACKEND
================================ */

async function checkRecognizer(){

  const response = await fetch(
    RECOGNIZER_URL + "/health",
    {cache:"no-store"}
  );

  if(!response.ok){
    throw new Error(
      "Recognition server unavailable."
    );
  }

  const data = await response.json();

  if(
    data.library_ready === false
  ){
    throw new Error(
      "Card library is still loading."
    );
  }

  return data;
}


/* ===============================
   INITIALIZE
================================ */

async function initialize(){

  loadInventory();

  status.firstChild.textContent =
    "Connecting to recognizer...";

  progress.innerText =
    "Checking the Destined Rivals card library.";

  try{

    const response = await fetch(
      RECOGNIZER_URL + "/",
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Server unavailable.");
    }

    const data = await response.json();

    if(!data.library_ready){

      status.firstChild.textContent =
        "Recognizer warming up...";

      progress.innerText =
        "Please wait while the card library loads.";

      let ready = false;

      for(let i=0; i<30; i++){

        await new Promise(
          resolve => setTimeout(resolve,2000)
        );

        try{

          const check = await fetch(
            RECOGNIZER_URL + "/",
            {cache:"no-store"}
          );

          const result = await check.json();

          if(result.library_ready){
            ready = true;
            break;
          }

        }catch(error){}

      }

      if(!ready){
        throw new Error(
          "Recognizer is taking too long to start."
        );
      }
    }

    status.firstChild.textContent =
      "✓ Scanner ready";

    progress.innerText =
      "Press START CAMERA.";

    startButton.disabled = false;
    startButton.innerText =
      "📷 START CAMERA";

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Recognizer unavailable";

    progress.innerText =
      "Render may be waking up. Refresh this page in about one minute.";

  }
}


/* ===============================
   CAMERA
================================ */

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },
          width:{
            ideal:1920
          },
          height:{
            ideal:1080
          }
        },

        audio:false

      });

    video.srcObject = stream;

    await video.play();

    cameraBox.style.display =
      "block";

    startButton.style.display =
      "none";

    scanButton.style.display =
      "block";

    status.firstChild.textContent =
      "Camera ready";

    progress.innerText =
      "Place a card inside the white frame.";

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Camera could not start.";

    progress.innerText =
      error.message;
  }
}


/* ===============================
   CAPTURE CARD
================================ */

function captureCard(){

  const videoRect =
    video.getBoundingClientRect();

  const guideRect =
    cardGuide.getBoundingClientRect();

  const scaleX =
    video.videoWidth /
    videoRect.width;

  const scaleY =
    video.videoHeight /
    videoRect.height;

  const guideX =
    (guideRect.left - videoRect.left) *
    scaleX;

  const guideY =
    (guideRect.top - videoRect.top) *
    scaleY;

  const guideWidth =
    guideRect.width * scaleX;

  const guideHeight =
    guideRect.height * scaleY;

  /*
    Actual Pokémon card = 63 × 88 mm.
    White guide = 73 × 98 mm.

    Therefore we crop the centered card-sized
    region inside the guide.
  */

  const cardWidth =
    guideWidth * (63/73);

  const cardHeight =
    guideHeight * (88/98);

  const sourceX =
    guideX +
    (guideWidth-cardWidth)/2;

  const sourceY =
    guideY +
    (guideHeight-cardHeight)/2;

  cropCanvas.width = 630;
  cropCanvas.height = 880;

  const ctx =
    cropCanvas.getContext("2d");

  ctx.drawImage(
    video,

    sourceX,
    sourceY,
    cardWidth,
    cardHeight,

    0,
    0,
    630,
    880
  );

  return cropCanvas;
}


/* ===============================
   CANVAS → JPEG
================================ */

function canvasToBlob(canvas){

  return new Promise(
    (resolve,reject) => {

      canvas.toBlob(
        blob => {

          if(blob){
            resolve(blob);
          }else{
            reject(
              new Error(
                "Could not capture card image."
              )
            );
          }

        },
        "image/jpeg",
        0.94
      );

    }
  );
}


/* ===============================
   SEND TO SIFT SERVER
================================ */

async function recognizeCard(blob){

  const formData =
    new FormData();

  formData.append(
    "file",
    blob,
    "card.jpg"
  );

  const response =
    await fetch(
      RECOGNIZER_URL + "/recognize",
      {
        method:"POST",
        body:formData
      }
    );

  if(!response.ok){

    let message =
      "Recognition server error.";

    try{
      const error =
        await response.json();

      message =
        error.detail || message;

    }catch(error){}

    throw new Error(message);
  }

  return await response.json();
}


/* ===============================
   SCAN
================================ */

async function scanCard(){

  scanButton.disabled = true;
  scanButton.innerText =
    "ANALYZING...";

  candidateBox.style.display =
    "none";

  selectedBox.style.display =
    "none";

  manualError.style.display =
    "none";

  status.firstChild.textContent =
    "Analyzing card...";

  progress.innerText =
    "Sending image to the SIFT recognizer.";

  try{

    const canvas =
      captureCard();

    const blob =
      await canvasToBlob(canvas);

    const result =
      await recognizeCard(blob);

    if(
      result.status !== "matched" ||
      !result.best_match
    ){
      throw new Error(
        "No reliable card match found."
      );
    }

    rankedMatches =
      (result.top_matches || [])
      .map(match => ({
        number:Number(match.number),
        score:Number(match.score || 0),
        inliers:Number(match.inliers || 0),
        inlier_ratio:
          Number(match.inlier_ratio || 0)
      }));

    /*
      If backend did not include the best match
      in top_matches, add it.
    */

    if(
      !rankedMatches.some(
        match =>
          match.number ===
          Number(result.best_match.number)
      )
    ){

      rankedMatches.unshift({
        number:
          Number(result.best_match.number),
        score:
          Number(result.best_match.score || 0),
        inliers:
          Number(result.best_match.inliers || 0),
        inlier_ratio:
          Number(
            result.best_match.inlier_ratio || 0
          )
      });
    }

    /*
      Confident result:
      go directly to inventory card.

      Otherwise show candidate choices.
    */

    if(
      result.confident === true &&
      inventoryByNumber[
        Number(result.best_match.number)
      ]
    ){

      chooseCard(
        Number(result.best_match.number)
      );

      status.firstChild.textContent =
        "✓ Card recognized";

      progress.innerText =
        "Strong visual match. Choose the version you are adding.";

    }else{

      showCandidates();

      status.firstChild.textContent =
        "Check the match";

      progress.innerText =
        "The scanner was not fully confident. Tap the correct card.";
    }

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Scan failed";

    progress.innerText =
      error.message;

  }

  scanButton.disabled = false;

  scanButton.innerText =
    "🔍 SCAN AGAIN";
}


/* ===============================
   SHOW CANDIDATES
================================ */

function showCandidates(){

  candidateList.innerHTML = "";

  rankedMatches
  .slice(0,5)
  .forEach(match => {

    const card =
      inventoryByNumber[
        Number(match.number)
      ];

    const row =
      document.createElement("div");

    row.className =
      "candidate";

    const image =
      document.createElement("img");

    image.src =
      `https://images.pokemontcg.io/${IMAGE_SET}/${match.number}.png`;

    const info =
      document.createElement("div");

    info.className =
      "candidateInfo";

    const name =
      document.createElement("div");

    name.className =
      "candidateName";

    name.innerText =
      card
      ? card.name
      : "Destined Rivals Card";

    const number =
      document.createElement("div");

    number.className =
      "candidateNumber";

    number.innerText =
      "#" +
      String(match.number)
      .padStart(3,"0") +
      "/" +
      DENOMINATOR;

    const score =
      document.createElement("div");

    score.className =
      "candidateScore";

    score.innerText =
      match.inliers
      ? `${match.inliers} verified feature matches`
      : "Possible match";

    const choose =
      document.createElement("div");

    choose.className =
      "choose";

    choose.innerText = "›";

    info.appendChild(name);
    info.appendChild(number);
    info.appendChild(score);

    row.appendChild(image);
    row.appendChild(info);
    row.appendChild(choose);

    row.addEventListener(
      "click",
      () => chooseCard(match.number)
    );

    candidateList.appendChild(row);
  });

  candidateBox.style.display =
    "block";

  candidateBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* ===============================
   MANUAL NUMBER
================================ */

function findManualCard(){

  manualError.style.display =
    "none";

  const number =
    Number(manualNumber.value);

  if(
    !number ||
    number < 1 ||
    number > MAX_CARD
  ){

    manualError.innerText =
      "Enter a card number from 1 to 244.";

    manualError.style.display =
      "block";

    return;
  }

  const card =
    inventoryByNumber[number];

  if(!card){

    manualError.innerText =
      "That card was not found in the Google Sheet.";

    manualError.style.display =
      "block";

    return;
  }

  chooseCard(number);
}


/* ===============================
   SELECT CARD
================================ */

function chooseCard(number){

  const card =
    inventoryByNumber[
      Number(number)
    ];

  if(!card){

    manualError.innerText =
      "Google Sheet data is not available for this card.";

    manualError.style.display =
      "block";

    return;
  }

  currentCard = card;

  selectedImage.src =
    `https://images.pokemontcg.io/${IMAGE_SET}/${Number(card.number)}.png`;

  selectedName.innerText =
    card.name;

  selectedNumber.innerText =
    "#" +
    String(card.number)
    .padStart(3,"0") +
    "/" +
    DENOMINATOR;

  selectedRarity.innerText =
    card.rarity || "";

  selectedType.innerText =
    card.type || "";

  updateCounts();

  if(card.reverse === null){

    reverseButton.style.display =
      "none";

  }else{

    reverseButton.style.display =
      "flex";
  }

  saved.style.display =
    "none";

  candidateBox.style.display =
    "none";

  selectedBox.style.display =
    "block";

  status.firstChild.textContent =
    "Card selected";

  progress.innerText =
    "Choose the version you are adding.";

  selectedBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* ===============================
   COUNTS
================================ */

function updateCounts(){

  if(!currentCard){
    return;
  }

  normalCount.innerText =
    Number(currentCard.normal) || 0;

  reverseCount.innerText =
    currentCard.reverse === null
    ? "-"
    : Number(currentCard.reverse) || 0;

  holoCount.innerText =
    Number(currentCard.holo) || 0;

  otherCount.innerText =
    Number(currentCard.other) || 0;
}


/* ===============================
   ADD TO GOOGLE SHEET
================================ */

function addCard(variant){

  if(!currentCard){
    return;
  }

  if(
    variant === "reverse" &&
    currentCard.reverse === null
  ){
    return;
  }

  currentCard[variant] =
    (Number(currentCard[variant]) || 0) + 1;

  updateCounts();

  const form =
    document.createElement("form");

  form.method = "POST";
  form.action = SCRIPT_URL;
  form.target = "sheetUpdateFrame";
  form.style.display = "none";

  const fields = {
    action:"changeQuantity",
    row:currentCard.row,
    variant:variant,
    change:1
  };

  Object.entries(fields)
  .forEach(([name,value]) => {

    const input =
      document.createElement("input");

    input.type = "hidden";
    input.name = name;
    input.value = value;

    form.appendChild(input);
  });

  document.body.appendChild(form);

  form.submit();

  setTimeout(
    () => form.remove(),
    1000
  );

  saved.innerText =
    "✓ Added to Google Sheet";

  saved.style.display =
    "block";

  setTimeout(
    resetForNextCard,
    850
  );
}


/* ===============================
   NEXT CARD
================================ */

function resetForNextCard(){

  currentCard = null;
  rankedMatches = [];

  manualNumber.value = "";

  manualError.style.display =
    "none";

  saved.style.display =
    "none";

  selectedBox.style.display =
    "none";

  candidateBox.style.display =
    "none";

  status.firstChild.textContent =
    "Ready for next card";

  progress.innerText =
    "Place the next card inside the white frame.";

  scanButton.innerText =
    "🔍 SCAN CARD";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ===============================
   BUTTON EVENTS
================================ */

startButton.addEventListener(
  "click",
  startCamera
);

scanButton.addEventListener(
  "click",
  scanCard
);

manualButton.addEventListener(
  "click",
  findManualCard
);

manualNumber.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      findManualCard();
    }
  }
);

normalButton.addEventListener(
  "click",
  () => addCard("normal")
);

reverseButton.addEventListener(
  "click",
  () => addCard("reverse")
);

holoButton.addEventListener(
  "click",
  () => addCard("holo")
);

otherButton.addEventListener(
  "click",
  () => addCard("other")
);

wrongButton.addEventListener(
  "click",
  () => {

    selectedBox.style.display =
      "none";

    if(rankedMatches.length){

      showCandidates();

      status.firstChild.textContent =
        "Choose the correct card";

      progress.innerText =
        "Select a candidate or enter the card number.";

    }else{

      candidateBox.style.display =
        "block";

      status.firstChild.textContent =
        "Enter card number";

      progress.innerText =
        "Use the manual card number box.";
    }
  }
);


/* ===============================
   CLEANUP
================================ */

window.addEventListener(
  "pagehide",
  () => {

    if(stream){

      stream
      .getTracks()
      .forEach(
        track => track.stop()
      );
    }
  }
);


/* ===============================
   START
================================ */

initialize();

</script>

</body>
</html>
