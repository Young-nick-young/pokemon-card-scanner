<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Pokémon Card Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;

  font-family: Arial, sans-serif;

  background: #f4f4f4;
  color: #222;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 21px;
  margin: 6px 0 14px;
}

.section {
  background: white;

  padding: 13px;
  margin-bottom: 10px;

  border-radius: 14px;
}

label {
  display: block;

  margin-bottom: 6px;

  font-size: 14px;
  font-weight: bold;
}

select {
  width: 100%;

  padding: 12px;

  font-size: 16px;

  border: 1px solid #ccc;
  border-radius: 9px;

  background: white;
}

button {
  width: 100%;

  padding: 14px;

  border: 0;
  border-radius: 10px;

  font-size: 16px;
  font-weight: bold;
}

#startButton {
  margin-top: 10px;

  background: #222;
  color: white;
}

#stopButton {
  display: none;

  margin-top: 8px;

  background: #777;
  color: white;
}


/* ================================================
   CAMERA
================================================ */

#cameraBox {
  display: none;

  position: relative;

  width: 100%;

  overflow: hidden;

  background: #111;

  border-radius: 14px;

  margin-bottom: 10px;
}

#video {
  display: block;

  width: 100%;
  height: auto;
}


/* ================================================
   WHITE FRAME

   LOCKED:
   73 mm × 98 mm proportions

   DO NOT CHANGE DURING OCR TESTING
================================================ */

#cardGuide {

  position: absolute;

  width: 73%;

  aspect-ratio: 73 / 98;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border: 3px solid white;

  border-radius: 14px;

  pointer-events: none;
}


/* ================================================
   COLLECTOR NUMBER TARGET

   This is INSIDE the card guide.

   It is deliberately much smaller than before.
================================================ */

#numberGuide {

  position: absolute;

  left: 15%;

  bottom: 5.5%;

  width: 31%;

  height: 7%;

  border: 3px dashed #ffd600;

  border-radius: 6px;

  pointer-events: none;
}


#cameraMessage {

  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  padding: 6px 10px;

  background: rgba(0,0,0,.72);

  color: white;

  border-radius: 20px;

  font-size: 11px;

  white-space: nowrap;

  pointer-events: none;
}


/* ================================================
   STATUS
================================================ */

#status {

  display: none;

  padding: 11px;

  margin-bottom: 10px;

  border-radius: 9px;

  text-align: center;

  font-size: 14px;
}

.working {
  display: block !important;

  background: #fff3cd;
}

.success {
  display: block !important;

  background: #d4edda;
}

.error {
  display: block !important;

  background: #f8d7da;
}


/* ================================================
   OCR DEBUG
================================================ */

#ocrSection {

  display: none;

  padding: 10px;

  margin-bottom: 10px;

  background: white;

  border-radius: 14px;
}

#ocrTitle {

  margin-bottom: 6px;

  text-align: center;

  font-size: 12px;

  color: #666;
}

#ocrCanvas {

  display: block;

  width: 100%;

  max-height: 150px;

  object-fit: contain;

  background: white;

  border: 2px solid #333;

  border-radius: 8px;
}

#modeLabel {

  margin-top: 7px;

  text-align: center;

  font-size: 12px;

  font-weight: bold;
}

#ocrText {

  margin-top: 7px;

  padding: 8px;

  min-height: 32px;

  background: #eee;

  border-radius: 7px;

  font-size: 12px;

  word-break: break-word;
}


/* ================================================
   DETECTED CARD
================================================ */

#detectedCard {

  display: none;

  padding: 15px;

  margin-bottom: 10px;

  background: white;

  border-radius: 14px;

  text-align: center;
}

#detectedImage {

  width: 190px;

  max-width: 70%;

  border-radius: 7px;
}

#detectedNumber {

  margin-top: 8px;

  font-size: 25px;

  font-weight: bold;
}

#detectedSet {

  margin-top: 3px;

  color: #666;

  font-size: 14px;
}

#correctButton {

  margin-top: 13px;

  background: #4caf50;

  color: white;
}

#wrongButton {

  margin-top: 7px;

  background: #ddd;

  color: #222;
}

.smallText {

  margin-top: 7px;

  text-align: center;

  color: #777;

  font-size: 12px;

  line-height: 1.4;
}

</style>
</head>


<body>

<div class="container">

<h1>Pokémon Card Scanner</h1>


<div class="section">

<label for="setSelector">
Set being scanned
</label>

<select id="setSelector">

<option value="destined-rivals">
Destined Rivals
</option>

</select>


<button
  id="startButton"
  onclick="startScanner()"
>
📷 START SCANNER
</button>


<button
  id="stopButton"
  onclick="stopScanner()"
>
STOP CAMERA
</button>


<div class="smallText">

Hold the card naturally inside the white frame.

<br>

The yellow box should sit around the collector number.

</div>

</div>


<div id="status"></div>


<div id="cameraBox">

<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<div id="cardGuide">

  <div id="numberGuide"></div>

</div>


<div id="cameraMessage">

Hold card steady

</div>

</div>


<div id="ocrSection">

<div id="ocrTitle">

OCR number area

</div>


<canvas id="ocrCanvas"></canvas>


<div id="modeLabel">

Waiting...

</div>


<div id="ocrText">

OCR: waiting...

</div>

</div>


<div id="detectedCard">

<div
  style="
    font-size:13px;
    color:#777;
    margin-bottom:8px;
  "
>

CARD DETECTED

</div>


<img id="detectedImage">


<div id="detectedNumber"></div>


<div id="detectedSet"></div>


<button
  id="correctButton"
  onclick="confirmCard()"
>

✓ CORRECT

</button>


<button
  id="wrongButton"
  onclick="rejectCard()"
>

✕ WRONG — TRY AGAIN

</button>

</div>

</div>



<script>


/* ================================================
   SET CONFIGURATION
================================================ */

const SETS = {

  "destined-rivals": {

    name: "Destined Rivals",

    code: "DRI",

    denominator: 182,

    maxNumber: 244,

    imageSet: "sv10"

  }

};



/* ================================================
   VARIABLES
================================================ */

let cameraStream = null;

let scannerRunning = false;

let scannerPaused = false;

let scanBusy = false;

let scanTimer = null;

let ocrWorker = null;

let scanPass = 0;

let detectedNumber = null;



/* ================================================
   START CAMERA
================================================ */

async function startScanner() {

  if (scannerRunning) {

    scannerPaused = false;

    scheduleScan(300);

    return;
  }


  try {

    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    document.getElementById(
      "ocrSection"
    ).style.display =
      "block";


    document.getElementById(
      "startButton"
    ).style.display =
      "none";


    document.getElementById(
      "stopButton"
    ).style.display =
      "block";


    scannerRunning = true;

    scannerPaused = false;


    setStatus(
      "Loading OCR...",
      "working"
    );


    await createOcrWorker();


    setStatus(
      "Ready — hold a card in the frame.",
      "working"
    );


    scheduleScan(500);

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Camera error: " + error.message,
      "error"
    );

  }

}



/* ================================================
   CREATE OCR WORKER
================================================ */

async function createOcrWorker() {

  if (ocrWorker) {
    return;
  }


  ocrWorker =
    await Tesseract.createWorker("eng");


  await ocrWorker.setParameters({

    tessedit_char_whitelist:
      "0123456789/| ",

    tessedit_pageseg_mode:
      "7",

    preserve_interword_spaces:
      "1"

  });

}



/* ================================================
   SCHEDULE SCAN
================================================ */

function scheduleScan(delay) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {

    return;

  }


  if (scanTimer) {

    clearTimeout(scanTimer);

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}



/* ================================================
   FIND THE YELLOW BOX IN THE ACTUAL VIDEO

   The crop follows the yellow guide automatically.
================================================ */

function getNumberCrop(video) {

  const videoRect =
    video.getBoundingClientRect();


  const guideRect =
    document
      .getElementById("numberGuide")
      .getBoundingClientRect();


  /*
     SMALL hidden tolerance.

     The visible yellow box stays tight,
     but OCR gets a little extra room.
  */

  const extraX =
    guideRect.width * 0.12;


  const extraY =
    guideRect.height * 0.25;


  const screenX =
    guideRect.left -
    videoRect.left -
    extraX;


  const screenY =
    guideRect.top -
    videoRect.top -
    extraY;


  const screenWidth =
    guideRect.width +
    extraX * 2;


  const screenHeight =
    guideRect.height +
    extraY * 2;


  /*
     Convert screen coordinates to
     actual camera pixels.
  */

  const scaleX =
    video.videoWidth /
    videoRect.width;


  const scaleY =
    video.videoHeight /
    videoRect.height;


  let x =
    screenX * scaleX;


  let y =
    screenY * scaleY;


  let width =
    screenWidth * scaleX;


  let height =
    screenHeight * scaleY;


  x =
    Math.max(
      0,
      x
    );


  y =
    Math.max(
      0,
      y
    );


  width =
    Math.min(
      video.videoWidth - x,
      width
    );


  height =
    Math.min(
      video.videoHeight - y,
      height
    );


  return {

    x:
      Math.round(x),

    y:
      Math.round(y),

    width:
      Math.round(width),

    height:
      Math.round(height)

  };

}



/* ================================================
   SCAN FRAME
================================================ */

async function scanFrame() {

  if (
    !scannerRunning ||
    scannerPaused ||
    scanBusy
  ) {

    return;

  }


  const video =
    document.getElementById("video");


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    scheduleScan(300);

    return;

  }


  scanBusy = true;


  try {

    const crop =
      getNumberCrop(video);


    const canvas =
      document.getElementById(
        "ocrCanvas"
      );


    const ctx =
      canvas.getContext(

        "2d",

        {
          willReadFrequently: true
        }

      );


    /*
    ================================================
    PROCESSING MODES

    Each scan automatically tries the next one.
    ================================================
    */

    const modes = [

      {
        name: "High contrast",
        type: "contrast"
      },

      {
        name: "Grayscale",
        type: "gray"
      },

      {
        name: "Original colour",
        type: "colour"
      },

      {
        name: "Black & white",
        type: "threshold"
      }

    ];


    const mode =

      modes[
        scanPass %
        modes.length
      ];


    scanPass++;


    document.getElementById(
      "modeLabel"
    ).innerText =

      mode.name;



    /*
    ================================================
    ENLARGE THE COLLECTOR NUMBER

    The source text is tiny, so we make the OCR
    version very large.
    ================================================
    */

    const targetWidth =
      2200;


    const scale =
      targetWidth /
      crop.width;


    const targetHeight =

      Math.max(

        1,

        Math.round(

          crop.height *
          scale

        )

      );


    canvas.width =
      targetWidth;


    canvas.height =
      targetHeight;


    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    ctx.drawImage(

      video,

      crop.x,
      crop.y,

      crop.width,
      crop.height,

      0,
      0,

      targetWidth,
      targetHeight

    );



    /*
    ================================================
    IMAGE PROCESSING
    ================================================
    */

    if (
      mode.type !== "colour"
    ) {

      const imageData =
        ctx.getImageData(

          0,
          0,

          canvas.width,
          canvas.height

        );


      const data =
        imageData.data;


      for (

        let i = 0;

        i < data.length;

        i += 4

      ) {

        const gray =

          data[i] * 0.299 +

          data[i + 1] * 0.587 +

          data[i + 2] * 0.114;


        let value =
          gray;



        if (
          mode.type === "contrast"
        ) {

          value =

            (
              gray - 128
            )

            * 2.1

            + 128;


          value =

            Math.max(

              0,

              Math.min(
                255,
                value
              )

            );

        }



        if (
          mode.type === "threshold"
        ) {

          value =
            gray > 150
            ? 255
            : 0;

        }



        data[i] =
          value;


        data[i + 1] =
          value;


        data[i + 2] =
          value;

      }


      ctx.putImageData(

        imageData,

        0,
        0

      );

    }



    /*
    ================================================
    OCR
    ================================================
    */

    const result =
      await ocrWorker.recognize(
        canvas
      );


    let rawText =

      result.data.text ||
      "";


    let text =

      rawText

      .replace(
        /\n/g,
        " "
      )

      .replace(
        /[Oo]/g,
        "0"
      )

      .replace(
        /[Il]/g,
        "1"
      )

      .replace(
        /\s+/g,
        " "
      )

      .trim();



    document.getElementById(
      "ocrText"
    ).innerText =

      "OCR: " +

      (
        text ||
        "(nothing detected)"
      );



    console.log(

      mode.name,

      text

    );



    const number =
      extractCollectorNumber(
        text
      );



    if (
      number !== null
    ) {

      showDetectedCard(
        number
      );

      return;

    }

  }

  catch (error) {

    console.error(
      "OCR error:",
      error
    );

  }

  finally {

    scanBusy = false;

  }


  scheduleScan(250);

}



/* ================================================
   COLLECTOR NUMBER RECOGNITION
================================================ */

function extractCollectorNumber(text) {

  const setKey =
    document.getElementById(
      "setSelector"
    ).value;


  const set =
    SETS[setKey];


  const denominator =
    String(
      set.denominator
    );


  /*
     Remove spaces first.

     Examples:

     034 / 182
     becomes
     034/182
  */

  let cleaned =

    text

    .replace(
      /\s+/g,
      ""
    )

    .replace(
      /\\/g,
      "/"
    );



  /*
  ================================================
  TEST 1

  Ideal:
  034/182
  ================================================
  */

  let match =

    cleaned.match(

      new RegExp(

        "(\\d{1,3})[\\/|]" +
        denominator

      )

    );


  if (match) {

    return validateNumber(
      match[1],
      set
    );

  }



  /*
  ================================================
  TEST 2

  Slash missing:
  034182
  ================================================
  */

  match =

    cleaned.match(

      new RegExp(

        "(\\d{1,3})" +
        denominator

      )

    );


  if (match) {

    return validateNumber(
      match[1],
      set
    );

  }



  /*
  ================================================
  TEST 3

  Denominator slightly damaged.

  Examples:

  034/18
  034/82

  Because we already know the selected set is /182,
  these are useful clues.
  ================================================
  */

  match =

    cleaned.match(
      /(\d{1,3})[\/|](?:18|82)/
    );


  if (match) {

    return validateNumber(
      match[1],
      set
    );

  }



  /*
  ================================================
  TEST 4

  Tesseract may produce something such as:

  034 / 1 82

  Spaces were already removed above.
  ================================================
  */

  match =

    cleaned.match(
      /(\d{1,3})[\/|]1?8?2/
    );


  if (match) {

    return validateNumber(
      match[1],
      set
    );

  }



  return null;

}



/* ================================================
   VALIDATE NUMBER
================================================ */

function validateNumber(
  value,
  set
) {

  const number =
    parseInt(
      value,
      10
    );


  if (
    Number.isNaN(number)
  ) {

    return null;

  }


  if (
    number < 1 ||
    number > set.maxNumber
  ) {

    return null;

  }


  return number;

}



/* ================================================
   CARD DETECTED
================================================ */

function showDetectedCard(number) {

  scannerPaused = true;


  detectedNumber =
    number;


  const setKey =
    document.getElementById(
      "setSelector"
    ).value;


  const set =
    SETS[setKey];


  const padded =
    String(number)
      .padStart(
        3,
        "0"
      );


  document.getElementById(
    "detectedNumber"
  ).innerText =

    "#" +
    padded +
    "/" +
    set.denominator;


  document.getElementById(
    "detectedSet"
  ).innerText =

    set.name;


  document.getElementById(
    "detectedImage"
  ).src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    number +

    ".png";


  document.getElementById(
    "detectedCard"
  ).style.display =

    "block";


  setStatus(

    "✓ Card detected!",

    "success"

  );


  document.getElementById(
    "detectedCard"
  ).scrollIntoView({

    behavior: "smooth",

    block: "center"

  });

}



/* ================================================
   CORRECT
================================================ */

function confirmCard() {

  setStatus(

    "✓ Correct — hold up the next card.",

    "success"

  );


  prepareNextCard();

}



/* ================================================
   WRONG
================================================ */

function rejectCard() {

  setStatus(

    "Trying again...",

    "working"

  );


  prepareNextCard();

}



/* ================================================
   NEXT CARD
================================================ */

function prepareNextCard() {

  detectedNumber = null;


  document.getElementById(
    "detectedCard"
  ).style.display =

    "none";


  scannerPaused = false;


  scanPass = 0;


  document.getElementById(
    "ocrText"
  ).innerText =

    "OCR: waiting...";


  scheduleScan(400);

}



/* ================================================
   STOP
================================================ */

function stopScanner() {

  scannerRunning = false;

  scannerPaused = false;

  scanBusy = false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );


    scanTimer = null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );

  }


  cameraStream = null;


  document.getElementById(
    "video"
  ).srcObject = null;


  document.getElementById(
    "cameraBox"
  ).style.display =

    "none";


  document.getElementById(
    "ocrSection"
  ).style.display =

    "none";


  document.getElementById(
    "detectedCard"
  ).style.display =

    "none";


  document.getElementById(
    "startButton"
  ).style.display =

    "block";


  document.getElementById(
    "stopButton"
  ).style.display =

    "none";


  setStatus(

    "Camera stopped.",

    "working"

  );

}



/* ================================================
   STATUS
================================================ */

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    type;

}



/* ================================================
   CAMERA CLEANUP
================================================ */

window.addEventListener(

  "pagehide",

  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );

    }

  }

);

</script>

</body>
</html>
