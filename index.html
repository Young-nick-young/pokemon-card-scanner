<script type="module">

import {
  pipeline,
  RawImage
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* =========================================
SETTINGS
========================================= */

const SCRIPT_URL =
"https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbwDF5oxhER534DF16jG94SHwJ9jS2ySAWJXIKgUsOpXjsdy26JKiu1FOIAsQnOqk_6f/exec";

const MODEL =
"onnx-community/dinov2-small";

const MAX_CARD = 244;

const IMAGE_SET = "sv10";

const DENOMINATOR = 182;


/* =========================================
STATE
========================================= */

let extractor = null;

let references = [];

let inventoryCards = [];

let inventoryByNumber = {};

let stream = null;

let rankedMatches = [];

let currentCard = null;


/* =========================================
ELEMENTS
========================================= */

const status =
document.getElementById("status");

const progress =
document.getElementById("progress");

const sheetStatus =
document.getElementById("sheetStatus");

const startButton =
document.getElementById("startButton");

const scanButton =
document.getElementById("scanButton");

const cameraBox =
document.getElementById("cameraBox");

const video =
document.getElementById("video");

const cardGuide =
document.getElementById("cardGuide");

const cropCanvas =
document.getElementById("cropCanvas");

const candidateBox =
document.getElementById("candidateBox");

const candidateList =
document.getElementById("candidateList");

const manualNumber =
document.getElementById("manualNumber");

const manualButton =
document.getElementById("manualButton");

const manualError =
document.getElementById("manualError");

const selectedBox =
document.getElementById("selectedBox");

const selectedImage =
document.getElementById("selectedImage");

const selectedName =
document.getElementById("selectedName");

const selectedNumber =
document.getElementById("selectedNumber");

const selectedRarity =
document.getElementById("selectedRarity");

const selectedType =
document.getElementById("selectedType");

const normalButton =
document.getElementById("normalButton");

const reverseButton =
document.getElementById("reverseButton");

const holoButton =
document.getElementById("holoButton");

const otherButton =
document.getElementById("otherButton");

const normalCount =
document.getElementById("normalCount");

const reverseCount =
document.getElementById("reverseCount");

const holoCount =
document.getElementById("holoCount");

const otherCount =
document.getElementById("otherCount");

const saved =
document.getElementById("saved");

const wrongButton =
document.getElementById("wrongButton");


/* =========================================
GOOGLE SHEET DATABASE
========================================= */

window.receiveCards = function(cards){

  inventoryCards =
    cards || [];

  inventoryByNumber = {};

  inventoryCards.forEach(card => {

    inventoryByNumber[
      Number(card.number)
    ] = card;

  });

  sheetStatus.innerText =
    `✓ Google Sheet connected • ${inventoryCards.length} cards`;

};


function loadInventory(){

  const script =
    document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?api=cards" +
    "&callback=receiveCards" +
    "&t=" +
    Date.now();

  script.onerror = () => {

    sheetStatus.innerText =
      "⚠ Google Sheet connection failed.";

  };

  document.body.appendChild(script);

}


/* =========================================
INDEXED DB
========================================= */

function openDatabase(){

  return new Promise(
    (resolve,reject) => {

      const request =
        indexedDB.open(
          "pokemonScannerDB",
          1
        );

      request.onupgradeneeded =
        event => {

          const db =
            event.target.result;

          if(
            !db.objectStoreNames.contains(
              "data"
            )
          ){
            db.createObjectStore("data");
          }

        };

      request.onsuccess =
        () => resolve(request.result);

      request.onerror =
        () => reject(request.error);

    }
  );

}


async function loadCachedReferences(){

  try{

    const db =
      await openDatabase();

    return await new Promise(
      resolve => {

        const transaction =
          db.transaction(
            "data",
            "readonly"
          );

        const request =
          transaction
          .objectStore("data")
          .get(
            "destined-rivals-dinov2-v1"
          );

        request.onsuccess =
          () => resolve(
            request.result || null
          );

        request.onerror =
          () => resolve(null);

      }
    );

  }catch{

    return null;

  }

}


async function saveCachedReferences(data){

  try{

    const db =
      await openDatabase();

    await new Promise(
      (resolve,reject) => {

        const transaction =
          db.transaction(
            "data",
            "readwrite"
          );

        transaction
          .objectStore("data")
          .put(
            data,
            "destined-rivals-dinov2-v1"
          );

        transaction.oncomplete =
          resolve;

        transaction.onerror =
          () => reject(
            transaction.error
          );

      }
    );

  }catch(error){

    console.warn(error);

  }

}


/* =========================================
VECTOR FUNCTIONS
========================================= */

function normalizeVector(array){

  let magnitude = 0;

  for(
    let i=0;
    i<array.length;
    i++
  ){

    magnitude +=
      array[i] * array[i];

  }

  magnitude =
    Math.sqrt(magnitude) || 1;

  const result =
    new Float32Array(
      array.length
    );

  for(
    let i=0;
    i<array.length;
    i++
  ){

    result[i] =
      array[i] / magnitude;

  }

  return result;

}


function cosineSimilarity(a,b){

  let score = 0;

  const length =
    Math.min(
      a.length,
      b.length
    );

  for(
    let i=0;
    i<length;
    i++
  ){

    score +=
      a[i] * b[i];

  }

  return score;

}


/* =========================================
EMBEDDING
========================================= */

async function getEmbedding(image){

  const output =
    await extractor(
      image,
      {
        pooling:"mean",
        normalize:true
      }
    );

  const data =
    output.data;

  if(
    !data ||
    !data.length
  ){

    throw new Error(
      "No image features returned."
    );

  }

  if(
    output.dims &&
    output.dims.length === 3
  ){

    const tokenCount =
      output.dims[1];

    const dimension =
      output.dims[2];

    const pooled =
      new Float32Array(
        dimension
      );

    for(
      let token=0;
      token<tokenCount;
      token++
    ){

      const offset =
        token * dimension;

      for(
        let d=0;
        d<dimension;
        d++
      ){

        pooled[d] +=
          data[offset+d];

      }

    }

    for(
      let d=0;
      d<dimension;
      d++
    ){

      pooled[d] /=
        tokenCount;

    }

    return normalizeVector(
      pooled
    );

  }

  return normalizeVector(data);

}


/* =========================================
REFERENCE CARDS
========================================= */

async function getReferenceImage(number){

  return await RawImage.fromURL(
    `https://images.pokemontcg.io/${IMAGE_SET}/${number}.png`
  );

}


async function prepareReferences(){

  const cached =
    await loadCachedReferences();

  if(
    cached &&
    cached.length === MAX_CARD
  ){

    references =
      cached.map(
        item => ({
          number:item.number,
          vector:
            new Float32Array(
              item.vector
            )
        })
      );

    progress.innerText =
      "244 reference cards loaded.";

    return;

  }

  references = [];

  for(
    let number=1;
    number<=MAX_CARD;
    number++
  ){

    progress.innerText =
      `Preparing cards: ${number} / ${MAX_CARD}`;

    try{

      const image =
        await getReferenceImage(
          number
        );

      const vector =
        await getEmbedding(
          image
        );

      references.push({
        number,
        vector
      });

    }catch(error){

      console.error(
        number,
        error
      );

    }

  }

  if(
    references.length < 230
  ){

    throw new Error(
      "Reference library failed."
    );

  }

  await saveCachedReferences(

    references.map(
      item => ({
        number:item.number,
        vector:
          Array.from(
            item.vector
          )
      })
    )

  );

}


/* =========================================
START
========================================= */

async function initialize(){

  try{

    loadInventory();

    status.firstChild.textContent =
      "Loading recognition model...";

    extractor =
      await pipeline(
        "image-feature-extraction",
        MODEL,
        {
          device:"wasm",
          dtype:"q8"
        }
      );

    status.firstChild.textContent =
      "Preparing card library...";

    await prepareReferences();

    status.firstChild.textContent =
      "✓ Scanner ready";

    progress.innerText =
      "Press START CAMERA.";

    startButton.disabled =
      false;

    startButton.innerText =
      "📷 START CAMERA";

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Scanner failed.";

    progress.innerText =
      error.message;

  }

}


/* =========================================
CAMERA
========================================= */

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },
          width:{
            ideal:1920
          },
          height:{
            ideal:1080
          }
        },

        audio:false

      });

    video.srcObject =
      stream;

    await video.play();

    cameraBox.style.display =
      "block";

    startButton.style.display =
      "none";

    scanButton.style.display =
      "block";

    status.firstChild.textContent =
      "Camera ready";

    progress.innerText =
      "Place a card inside the white frame.";

  }catch(error){

    status.firstChild.textContent =
      "Camera could not start.";

    progress.innerText =
      error.message;

  }

}


/* =========================================
CAPTURE
========================================= */

function captureCard(){

  const videoRect =
    video.getBoundingClientRect();

  const guideRect =
    cardGuide.getBoundingClientRect();

  const scaleX =
    video.videoWidth /
    videoRect.width;

  const scaleY =
    video.videoHeight /
    videoRect.height;

  const guideX =
    (
      guideRect.left -
      videoRect.left
    ) * scaleX;

  const guideY =
    (
      guideRect.top -
      videoRect.top
    ) * scaleY;

  const guideWidth =
    guideRect.width *
    scaleX;

  const guideHeight =
    guideRect.height *
    scaleY;

  const cardWidth =
    guideWidth *
    (63/73);

  const cardHeight =
    guideHeight *
    (88/98);

  const sourceX =
    guideX +
    (
      guideWidth -
      cardWidth
    ) / 2;

  const sourceY =
    guideY +
    (
      guideHeight -
      cardHeight
    ) / 2;

  cropCanvas.width =
    448;

  cropCanvas.height =
    624;

  const ctx =
    cropCanvas.getContext("2d");

  ctx.drawImage(
    video,

    sourceX,
    sourceY,
    cardWidth,
    cardHeight,

    0,
    0,
    448,
    624
  );

  return cropCanvas;

}


async function canvasToImage(canvas){

  const blob =
    await new Promise(
      resolve =>
        canvas.toBlob(
          resolve,
          "image/jpeg",
          .92
        )
    );

  if(!blob){

    throw new Error(
      "Could not capture card."
    );

  }

  const url =
    URL.createObjectURL(blob);

  try{

    return await RawImage.fromURL(
      url
    );

  }finally{

    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      1000
    );

  }

}


/* =========================================
SCAN
========================================= */

async function scanCard(){

  scanButton.disabled =
    true;

  scanButton.innerText =
    "ANALYZING...";

  candidateBox.style.display =
    "none";

  selectedBox.style.display =
    "none";

  manualError.style.display =
    "none";

  status.firstChild.textContent =
    "Analyzing card...";

  progress.innerText =
    "Finding the closest matches.";

  try{

    const canvas =
      captureCard();

    const image =
      await canvasToImage(
        canvas
      );

    const liveVector =
      await getEmbedding(
        image
      );

    rankedMatches =
      references
      .map(
        reference => ({
          number:
            reference.number,

          score:
            cosineSimilarity(
              liveVector,
              reference.vector
            )
        })
      )
      .sort(
        (a,b) =>
          b.score -
          a.score
      )
      .slice(0,5);

    showCandidates();

    status.firstChild.textContent =
      "Choose the correct card";

    progress.innerText =
      "The scanner found these five possibilities.";

  }catch(error){

    console.error(error);

    status.firstChild.textContent =
      "Scan failed";

    progress.innerText =
      error.message;

  }

  scanButton.disabled =
    false;

  scanButton.innerText =
    "🔍 SCAN AGAIN";

}


/* =========================================
SHOW FIVE CANDIDATES
========================================= */

function showCandidates(){

  candidateList.innerHTML = "";

  rankedMatches.forEach(
    match => {

      const card =
        inventoryByNumber[
          Number(match.number)
        ];

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "candidate";

      const image =
        document.createElement(
          "img"
        );

      image.src =
        `https://images.pokemontcg.io/${IMAGE_SET}/${match.number}.png`;

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "candidateInfo";

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "candidateName";

      name.innerText =
        card
          ? card.name
          : "Destined Rivals Card";

      const number =
        document.createElement(
          "div"
        );

      number.className =
        "candidateNumber";

      number.innerText =
        "#" +
        String(
          match.number
        ).padStart(3,"0") +
        "/" +
        DENOMINATOR;

      const score =
        document.createElement(
          "div"
        );

      score.className =
        "candidateScore";

      score.innerText =
        "Similarity " +
        (
          match.score * 100
        ).toFixed(1) +
        "%";

      const choose =
        document.createElement(
          "div"
        );

      choose.className =
        "choose";

      choose.innerText =
        "›";

      info.appendChild(name);
      info.appendChild(number);
      info.appendChild(score);

      row.appendChild(image);
      row.appendChild(info);
      row.appendChild(choose);

      row.addEventListener(
        "click",
        () =>
          chooseCard(
            match.number
          )
      );

      candidateList.appendChild(
        row
      );

    }
  );

  candidateBox.style.display =
    "block";

  candidateBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =========================================
MANUAL NUMBER
========================================= */

function findManualCard(){

  manualError.style.display =
    "none";

  const number =
    Number(
      manualNumber.value
    );

  if(
    !number ||
    number < 1 ||
    number > MAX_CARD
  ){

    manualError.innerText =
      "Enter a card number from 1 to 244.";

    manualError.style.display =
      "block";

    return;

  }

  const card =
    inventoryByNumber[number];

  if(!card){

    manualError.innerText =
      "That card was not found in the Google Sheet.";

    manualError.style.display =
      "block";

    return;

  }

  chooseCard(number);

}


/* =========================================
SELECT CARD
========================================= */

function chooseCard(number){

  const card =
    inventoryByNumber[
      Number(number)
    ];

  if(!card){

    manualError.innerText =
      "Google Sheet data is not available for this card.";

    manualError.style.display =
      "block";

    return;

  }

  currentCard =
    card;

  selectedImage.src =
    `https://images.pokemontcg.io/${IMAGE_SET}/${Number(card.number)}.png`;

  selectedName.innerText =
    card.name;

  selectedNumber.innerText =
    "#" +
    String(
      card.number
    ).padStart(3,"0") +
    "/" +
    DENOMINATOR;

  selectedRarity.innerText =
    card.rarity || "";

  selectedType.innerText =
    card.type || "";

  updateCounts();

  if(
    card.reverse === null
  ){

    reverseButton.style.display =
      "none";

  }else{

    reverseButton.style.display =
      "flex";

  }

  saved.style.display =
    "none";

  candidateBox.style.display =
    "none";

  selectedBox.style.display =
    "block";

  status.firstChild.textContent =
    "Card selected";

  progress.innerText =
    "Choose the version you are adding.";

  selectedBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =========================================
COUNTS
========================================= */

function updateCounts(){

  normalCount.innerText =
    Number(
      currentCard.normal
    ) || 0;

  reverseCount.innerText =
    currentCard.reverse === null
      ? "-"
      : Number(
          currentCard.reverse
        ) || 0;

  holoCount.innerText =
    Number(
      currentCard.holo
    ) || 0;

  otherCount.innerText =
    Number(
      currentCard.other
    ) || 0;

}


/* =========================================
ADD TO GOOGLE SHEET
========================================= */

function addCard(variant){

  if(!currentCard){
    return;
  }

  if(
    variant === "reverse" &&
    currentCard.reverse === null
  ){
    return;
  }

  currentCard[variant] =
    (
      Number(
        currentCard[variant]
      ) || 0
    ) + 1;

  updateCounts();

  const form =
    document.createElement(
      "form"
    );

  form.method =
    "POST";

  form.action =
    SCRIPT_URL;

  form.target =
    "sheetUpdateFrame";

  form.style.display =
    "none";

  const fields = {

    action:
      "changeQuantity",

    row:
      currentCard.row,

    variant:
      variant,

    change:
      1

  };

  Object.entries(fields)
  .forEach(
    ([name,value]) => {

      const input =
        document.createElement(
          "input"
        );

      input.type =
        "hidden";

      input.name =
        name;

      input.value =
        value;

      form.appendChild(
        input
      );

    }
  );

  document.body.appendChild(
    form
  );

  form.submit();

  setTimeout(
    () => form.remove(),
    1000
  );

  saved.innerText =
    "✓ Added to Google Sheet";

  saved.style.display =
    "block";

  /*
  Automatically return to camera
  so bulk scanning stays fast.
  */

  setTimeout(
    resetForNextCard,
    850
  );

}


/* =========================================
NEXT CARD
========================================= */

function resetForNextCard(){

  currentCard =
    null;

  rankedMatches =
    [];

  manualNumber.value =
    "";

  manualError.style.display =
    "none";

  saved.style.display =
    "none";

  selectedBox.style.display =
    "none";

  candidateBox.style.display =
    "none";

  status.firstChild.textContent =
    "Ready for next card";

  progress.innerText =
    "Place the next card inside the white frame.";

  scanButton.innerText =
    "🔍 SCAN CARD";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
BUTTONS
========================================= */

startButton.addEventListener(
  "click",
  startCamera
);

scanButton.addEventListener(
  "click",
  scanCard
);

manualButton.addEventListener(
  "click",
  findManualCard
);

manualNumber.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      findManualCard();

    }

  }
);

normalButton.addEventListener(
  "click",
  () => addCard("normal")
);

reverseButton.addEventListener(
  "click",
  () => addCard("reverse")
);

holoButton.addEventListener(
  "click",
  () => addCard("holo")
);

otherButton.addEventListener(
  "click",
  () => addCard("other")
);

wrongButton.addEventListener(
  "click",
  () => {

    selectedBox.style.display =
      "none";

    candidateBox.style.display =
      "block";

    status.firstChild.textContent =
      "Choose the correct card";

    progress.innerText =
      "Select a candidate or enter the card number.";

  }
);


/* =========================================
CLEANUP
========================================= */

window.addEventListener(
  "pagehide",
  () => {

    if(stream){

      stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    }

  }
);


/* =========================================
INITIALIZE
========================================= */

initialize();

</script>

</body>
</html>
