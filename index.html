<style>

}

  aspect-ratio: 73 / 98;

<script>

/* =====================================================
   SET DATA
===================================================== */

const SETS = {

  "destined-rivals": {

    name:
      "Destined Rivals",

    denominator:
      182,

    maxNumber:
      244,

    imageSet:
      "sv10"

  }

};


/* =====================================================
   VISUAL MATCH SETTINGS
===================================================== */

/*
  Higher than the original 24×34 matcher.

  Still small enough to compare against
  244 cards quickly on a phone.
*/

const DESC_WIDTH =
  48;

const DESC_HEIGHT =
  67;


/*
  The reference image itself contains the
  complete card.

  For the LIVE camera image, the white
  guide is 73 × 98 while the real card is
  63 × 88.

  This converts the guide into the expected
  real-card region.
*/

const CARD_WIDTH_RATIO =
  63 / 73;

const CARD_HEIGHT_RATIO =
  88 / 98;


/*
  Small translation tests.

  These are fractions of the detected
  card crop.

  This means the matcher does not require
  pixel-perfect centering.
*/

const SHIFTS = [

  [ 0.00,  0.00],

  [-0.025,  0.00],
  [ 0.025,  0.00],

  [ 0.00, -0.025],
  [ 0.00,  0.025],

  [-0.020, -0.020],
  [ 0.020, -0.020],

  [-0.020,  0.020],
  [ 0.020,  0.020]

];


/*
  Slight zoom differences.

  1.00 = normal.

  Smaller scale means a slightly larger
  camera crop is considered.
*/

const SCALES = [

  0.965,
  1.000,
  1.035

];


/* =====================================================
   VARIABLES
===================================================== */

let cameraStream =
  null;

let scannerRunning =
  false;

let scannerPaused =
  false;

let scanBusy =
  false;

let scanTimer =
  null;


let referenceLibrary =
  [];

let libraryReady =
  false;


let winnerHistory =
  [];

let scoreHistory =
  [];


let detectedNumber =
  null;


/* =====================================================
   START
===================================================== */

async function startScanner() {

  try {

    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    document.getElementById(
      "previewSection"
    ).style.display =
      "block";


    document.getElementById(
      "scanInfo"
    ).style.display =
      "block";


    document.getElementById(
      "startButton"
    ).style.display =
      "none";


    document.getElementById(
      "stopButton"
    ).style.display =
      "block";


    scannerRunning =
      true;


    scannerPaused =
      false;


    if (!libraryReady) {

      await buildReferenceLibrary();

    }


    if (!libraryReady) {

      setStatus(
        "Reference library could not be prepared.",
        "error"
      );

      return;

    }


    setStatus(
      "Ready — hold a card inside the frame.",
      "working"
    );


    scheduleScan(
      600
    );

  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      "Camera error: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   BUILD REFERENCE LIBRARY
===================================================== */

async function buildReferenceLibrary() {

  const set =
    getSelectedSet();


  referenceLibrary =
    [];


  document.getElementById(
    "libraryBox"
  ).style.display =
    "block";


  document.getElementById(
    "progressInner"
  ).style.width =
    "0%";


  const batchSize =
    8;


  for (
    let start = 1;
    start <= set.maxNumber;
    start += batchSize
  ) {

    const promises =
      [];


    for (
      let number = start;
      number < start + batchSize;
      number++
    ) {

      if (
        number >
        set.maxNumber
      ) {

        break;

      }


      promises.push(

        loadReferenceCard(
          set,
          number
        )

      );

    }


    const results =
      await Promise.all(
        promises
      );


    for (
      const result of results
    ) {

      if (result) {

        referenceLibrary.push(
          result
        );

      }

    }


    const completed =
      Math.min(
        start +
        batchSize -
        1,
        set.maxNumber
      );


    const percentage =
      Math.round(
        completed /
        set.maxNumber *
        100
      );


    document.getElementById(
      "progressInner"
    ).style.width =
      percentage + "%";


    document.getElementById(
      "libraryText"
    ).innerText =

      "Preparing Destined Rivals: " +

      completed +

      " / " +

      set.maxNumber;

  }


  libraryReady =
    referenceLibrary.length >
    200;


  if (libraryReady) {

    document.getElementById(
      "libraryText"
    ).innerText =

      "✓ " +

      referenceLibrary.length +

      " cards ready";


    setTimeout(

      function() {

        document.getElementById(
          "libraryBox"
        ).style.display =
          "none";

      },

      1000

    );

  }

}


/* =====================================================
   LOAD ONE REFERENCE
===================================================== */

function loadReferenceCard(
  set,
  number
) {

  return new Promise(

    function(resolve) {

      const image =
        new Image();


      image.crossOrigin =
        "anonymous";


      image.onload =
        function() {

          try {

            const descriptor =
              createReferenceDescriptor(
                image
              );


            resolve({

              number:
                number,

              descriptor:
                descriptor

            });

          }

          catch (error) {

            console.error(
              "Reference descriptor failed:",
              number,
              error
            );


            resolve(
              null
            );

          }

        };


      image.onerror =
        function() {

          console.error(
            "Reference image failed:",
            number
          );


          resolve(
            null
          );

        };


      image.src =

        "https://images.pokemontcg.io/" +

        set.imageSet +

        "/" +

        number +

        ".png";

    }

  );

}


/* =====================================================
   REFERENCE DESCRIPTOR
===================================================== */

function createReferenceDescriptor(
  image
) {

  const canvas =
    document.getElementById(
      "referenceCanvas"
    );


  canvas.width =
    DESC_WIDTH;


  canvas.height =
    DESC_HEIGHT;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(

    image,

    0,
    0,

    DESC_WIDTH,
    DESC_HEIGHT

  );


  return createDescriptor(
    canvas
  );

}


/* =====================================================
   DESCRIPTOR

   Each descriptor stores:

   • normalized luminance
   • red
   • green
   • blue
   • horizontal edge
   • vertical edge

   The last two are important because they
   represent artwork and text structure,
   not just overall colour.
===================================================== */

function createDescriptor(
  canvas
) {

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  const width =
    canvas.width;


  const height =
    canvas.height;


  const pixels =
    ctx.getImageData(
      0,
      0,
      width,
      height
    ).data;


  const count =
    width *
    height;


  const luminance =
    new Float32Array(
      count
    );


  let totalLuminance =
    0;


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const p =
      i * 4;


    const r =
      pixels[p] /
      255;


    const g =
      pixels[p + 1] /
      255;


    const b =
      pixels[p + 2] /
      255;


    const lum =

      r * 0.299 +

      g * 0.587 +

      b * 0.114;


    luminance[i] =
      lum;


    totalLuminance +=
      lum;

  }


  const mean =
    totalLuminance /
    count;


  const descriptor =
    new Float32Array(
      count * 6
    );


  let output =
    0;


  for (
    let y = 0;
    y < height;
    y++
  ) {

    for (
      let x = 0;
      x < width;
      x++
    ) {

      const index =
        y *
        width +
        x;


      const pixelIndex =
        index * 4;


      const r =
        pixels[pixelIndex] /
        255;


      const g =
        pixels[pixelIndex + 1] /
        255;


      const b =
        pixels[pixelIndex + 2] /
        255;


      const lum =
        luminance[index];


      const left =

        x > 0
        ?
        luminance[
          index - 1
        ]
        :
        lum;


      const right =

        x <
        width - 1
        ?
        luminance[
          index + 1
        ]
        :
        lum;


      const up =

        y > 0
        ?
        luminance[
          index -
          width
        ]
        :
        lum;


      const down =

        y <
        height - 1
        ?
        luminance[
          index +
          width
        ]
        :
        lum;


      const horizontalEdge =
        right -
        left;


      const verticalEdge =
        down -
        up;


      descriptor[output++] =
        lum -
        mean;


      descriptor[output++] =
        r;


      descriptor[output++] =
        g;


      descriptor[output++] =
        b;


      descriptor[output++] =
        horizontalEdge;


      descriptor[output++] =
        verticalEdge;

    }

  }


  return descriptor;

}


/* =====================================================
   GUIDE POSITION
===================================================== */

function getCardBaseCrop() {

  const video =
    document.getElementById(
      "video"
    );


  const videoRect =
    video.getBoundingClientRect();


  const guideRect =
    document.getElementById(
      "cardGuide"
    ).getBoundingClientRect();


  const scaleX =
    video.videoWidth /
    videoRect.width;


  const scaleY =
    video.videoHeight /
    videoRect.height;


  const guideX =

    (
      guideRect.left -
      videoRect.left
    ) *
    scaleX;


  const guideY =

    (
      guideRect.top -
      videoRect.top
    ) *
    scaleY;


  const guideWidth =

    guideRect.width *
    scaleX;


  const guideHeight =

    guideRect.height *
    scaleY;


  /*
    Actual Pokémon card expected inside the
    larger 73 × 98 guide.
  */

  const cardWidth =

    guideWidth *
    CARD_WIDTH_RATIO;


  const cardHeight =

    guideHeight *
    CARD_HEIGHT_RATIO;


  const centerX =

    guideX +
    guideWidth / 2;


  const centerY =

    guideY +
    guideHeight / 2;


  return {

    centerX:
      centerX,

    centerY:
      centerY,

    width:
      cardWidth,

    height:
      cardHeight

  };

}


/* =====================================================
   CREATE ONE LIVE VARIANT
===================================================== */

function createLiveVariant(
  shiftX,
  shiftY,
  scale
) {

  const video =
    document.getElementById(
      "video"
    );


  const base =
    getCardBaseCrop();


  const cropWidth =

    base.width /
    scale;


  const cropHeight =

    base.height /
    scale;


  const centerX =

    base.centerX +

    base.width *
    shiftX;


  const centerY =

    base.centerY +

    base.height *
    shiftY;


  let sourceX =

    centerX -
    cropWidth / 2;


  let sourceY =

    centerY -
    cropHeight / 2;


  sourceX =
    Math.max(
      0,
      Math.min(
        video.videoWidth -
        cropWidth,
        sourceX
      )
    );


  sourceY =
    Math.max(
      0,
      Math.min(
        video.videoHeight -
        cropHeight,
        sourceY
      )
    );


  const canvas =
    document.getElementById(
      "workCanvas"
    );


  canvas.width =
    DESC_WIDTH;


  canvas.height =
    DESC_HEIGHT;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(

    video,

    sourceX,
    sourceY,

    cropWidth,
    cropHeight,

    0,
    0,

    DESC_WIDTH,
    DESC_HEIGHT

  );


  return createDescriptor(
    canvas
  );

}


/* =====================================================
   LIVE PREVIEW
===================================================== */

function updateLivePreview() {

  const video =
    document.getElementById(
      "video"
    );


  const base =
    getCardBaseCrop();


  const canvas =
    document.getElementById(
      "liveCardCanvas"
    );


  canvas.width =
    252;


  canvas.height =
    352;


  const ctx =
    canvas.getContext(
      "2d"
    );


  let x =

    base.centerX -
    base.width / 2;


  let y =

    base.centerY -
    base.height / 2;


  x =
    Math.max(
      0,
      x
    );


  y =
    Math.max(
      0,
      y
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(

    video,

    x,
    y,

    base.width,
    base.height,

    0,
    0,

    canvas.width,
    canvas.height

  );

}


/* =====================================================
   SCAN LOOP
===================================================== */

function scheduleScan(
  delay
) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {

    return;

  }


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}


/* =====================================================
   SCAN ONE FRAME
===================================================== */

async function scanFrame() {

  if (
    !scannerRunning ||
    scannerPaused ||
    scanBusy ||
    !libraryReady
  ) {

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    scheduleScan(
      400
    );

    return;

  }


  scanBusy =
    true;


  try {

    updateLivePreview();


    /*
      Start with central crop.
    */

    const centralDescriptor =
      createLiveVariant(
        0,
        0,
        1
      );


    /*
      Fast first pass against all cards.

      We keep only the strongest 15 candidates.
    */

    const firstPass =

      referenceLibrary
      .map(
        reference => ({

          number:
            reference.number,

          reference:
            reference,

          score:
            descriptorDistance(
              centralDescriptor,
              reference.descriptor
            )

        })
      )
      .sort(
        (a, b) =>
          a.score -
          b.score
      )
      .slice(
        0,
        15
      );


    /*
      Second pass:

      only those 15 candidates are tested against
      multiple small camera shifts and zooms.

      This keeps the phone responsive.
    */

    const refined =
      [];


    for (
      const candidate of firstPass
    ) {

      let bestScore =
        candidate.score;


      let bestVariant =
        "centre";


      for (
        const scale of SCALES
      ) {

        for (
          const shift of SHIFTS
        ) {

          /*
            Central 1.0 test was already performed.
          */

          if (
            scale === 1 &&
            shift[0] === 0 &&
            shift[1] === 0
          ) {

            continue;

          }


          const liveVariant =
            createLiveVariant(

              shift[0],

              shift[1],

              scale

            );


          const score =
            descriptorDistance(

              liveVariant,

              candidate.reference.descriptor

            );


          if (
            score <
            bestScore
          ) {

            bestScore =
              score;


            bestVariant =

              "shift " +

              shift[0].toFixed(3) +

              "," +

              shift[1].toFixed(3) +

              " scale " +

              scale.toFixed(3);

          }

        }

      }


      refined.push({

        number:
          candidate.number,

        score:
          bestScore,

        variant:
          bestVariant

      });

    }


    refined.sort(
      (a, b) =>
        a.score -
        b.score
    );


    const top =
      refined.slice(
        0,
        5
      );


    displayMatches(
      top
    );


    updateStability(
      top
    );

  }

  catch (error) {

    console.error(
      "Scan error:",
      error
    );

  }

  finally {

    scanBusy =
      false;


    if (
      scannerRunning &&
      !scannerPaused
    ) {

      scheduleScan(
        650
      );

    }

  }

}


/* =====================================================
   VISUAL DISTANCE
===================================================== */

function descriptorDistance(
  a,
  b
) {

  let total =
    0;


  let pixels =
    0;


  for (
    let i = 0;
    i < a.length;
    i += 6
  ) {

    const luminance =
      Math.abs(
        a[i] -
        b[i]
      );


    const red =
      Math.abs(
        a[i + 1] -
        b[i + 1]
      );


    const green =
      Math.abs(
        a[i + 2] -
        b[i + 2]
      );


    const blue =
      Math.abs(
        a[i + 3] -
        b[i + 3]
      );


    const edgeX =
      Math.abs(
        a[i + 4] -
        b[i + 4]
      );


    const edgeY =
      Math.abs(
        a[i + 5] -
        b[i + 5]
      );


    /*
      Structure receives the strongest weighting.
    */

    total +=

      luminance *
      1.1 +

      red *
      0.28 +

      green *
      0.28 +

      blue *
      0.28 +

      edgeX *
      2.6 +

      edgeY *
      2.6;


    pixels++;

  }


  return total /
    pixels;

}


/* =====================================================
   DISPLAY MATCHES
===================================================== */

function displayMatches(
  matches
) {

  const set =
    getSelectedSet();


  const best =
    matches[0];


  document.getElementById(
    "liveBest"
  ).innerText =

    "Best: #" +

    String(
      best.number
    ).padStart(
      3,
      "0"
    );


  document.getElementById(
    "liveScore"
  ).innerText =

    "Visual distance: " +

    best.score.toFixed(
      4
    );


  const lines =
    matches.map(

      function(match, index) {

        return (

          (
            index +
            1
          ) +

          ". #" +

          String(
            match.number
          ).padStart(
            3,
            "0"
          ) +

          "/" +

          set.denominator +

          " — " +

          match.score.toFixed(
            4
          )

        );

      }

    );


  document.getElementById(
    "topMatches"
  ).innerText =

    "Closest matches:\n" +

    lines.join(
      "\n"
    );

}


/* =====================================================
   STABILITY / AUTOMATIC ACCEPTANCE
===================================================== */

function updateStability(
  matches
) {

  if (
    matches.length <
    2
  ) {

    return;

  }


  const best =
    matches[0];


  const second =
    matches[1];


  winnerHistory.push(
    best.number
  );


  scoreHistory.push(
    best.score
  );


  if (
    winnerHistory.length >
    6
  ) {

    winnerHistory.shift();

    scoreHistory.shift();

  }


  const sameCount =

    winnerHistory.filter(
      number =>
        number ===
        best.number
    ).length;


  const separation =

    second.score -
    best.score;


  document.getElementById(
    "stability"
  ).innerText =

    "Stable frames: " +

    sameCount +

    "/6" +

    " • lead: " +

    separation.toFixed(
      4
    );


  /*
    We deliberately don't stop after just a
    couple of guesses.

    Need the same winner in at least five of
    the last six scans.
  */

  if (
    winnerHistory.length >= 5 &&
    sameCount >= 5
  ) {

    showDetectedCard(
      best
    );

  }

}


/* =====================================================
   FINAL DETECTED CARD
===================================================== */

function showDetectedCard(
  match
) {

  scannerPaused =
    true;


  detectedNumber =
    match.number;


  const set =
    getSelectedSet();


  document.getElementById(
    "detectedNumber"
  ).innerText =

    "#" +

    String(
      match.number
    ).padStart(
      3,
      "0"
    ) +

    "/" +

    set.denominator;


  document.getElementById(
    "detectedSet"
  ).innerText =
    set.name;


  document.getElementById(
    "detectedConfidence"
  ).innerText =

    "Visual distance: " +

    match.score.toFixed(
      4
    );


  document.getElementById(
    "detectedImage"
  ).src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    match.number +

    ".png";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "block";


  setStatus(
    "Possible card match found.",
    "success"
  );


  document.getElementById(
    "detectedCard"
  ).scrollIntoView({

    behavior:
      "smooth",

    block:
      "center"

  });

}


/* =====================================================
   CORRECT / WRONG
===================================================== */

function confirmCard() {

  setStatus(
    "✓ Match confirmed — hold up the next card.",
    "success"
  );


  prepareNextCard();

}


function rejectCard() {

  setStatus(
    "Match rejected — scanning again.",
    "working"
  );


  prepareNextCard();

}


function prepareNextCard() {

  detectedNumber =
    null;


  winnerHistory =
    [];


  scoreHistory =
    [];


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  document.getElementById(
    "liveBest"
  ).innerText =
    "Waiting for card...";


  document.getElementById(
    "stability"
  ).innerText =
    "";


  scannerPaused =
    false;


  scheduleScan(
    600
  );

}


/* =====================================================
   STOP
===================================================== */

function stopScanner() {

  scannerRunning =
    false;


  scannerPaused =
    false;


  scanBusy =
    false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );


    scanTimer =
      null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );

  }


  cameraStream =
    null;


  document.getElementById(
    "video"
  ).srcObject =
    null;


  document.getElementById(
    "cameraBox"
  ).style.display =
    "none";


  document.getElementById(
    "previewSection"
  ).style.display =
    "none";


  document.getElementById(
    "scanInfo"
  ).style.display =
    "none";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "stopButton"
  ).style.display =
    "none";


  winnerHistory =
    [];


  setStatus(
    "Camera stopped.",
    "working"
  );

}


/* =====================================================
   HELPERS
===================================================== */

function getSelectedSet() {

  return SETS[
    document.getElementById(
      "setSelector"
    ).value
  ];

}


function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    type;

}


/* =====================================================
   CAMERA CLEANUP
===================================================== */

window.addEventListener(

  "pagehide",

  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(

          function(track) {

            track.stop();

          }

        );

    }

  }

);

</script>
