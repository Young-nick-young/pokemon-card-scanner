<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Pokémon Inventory Scanner</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#f3f3f3;
      color:#222;
    }

    .app{
      max-width:560px;
      margin:0 auto;
      padding:12px;
    }

    h1{
      text-align:center;
      font-size:24px;
      margin:4px 0 12px;
    }

    .panel{
      background:white;
      border-radius:18px;
      padding:14px;
      margin-bottom:12px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.05);
    }

    #status{
      text-align:center;
      font-size:15px;
      font-weight:700;
      margin-bottom:10px;
    }

    #sheetStatus{
      text-align:center;
      font-size:14px;
      color:#666;
      margin-top:8px;
    }

    #cameraWrap{
      position:relative;
      width:100%;
      overflow:hidden;
      border-radius:16px;
      background:#111;
      aspect-ratio:3 / 4;
    }

    #video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /*
      LOCKED GUIDE
      Pokémon card = 63 x 88 mm
      Guide = 73 x 98 mm
    */
    #cardGuide{
      position:absolute;
      width:73%;
      aspect-ratio:73 / 98;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      border:3px solid white;
      border-radius:14px;
      pointer-events:none;
    }

    #scanButton{
      width:100%;
      border:none;
      border-radius:14px;
      padding:16px;
      margin-top:10px;
      font-size:21px;
      font-weight:800;
      background:#222;
      color:white;
      cursor:pointer;
    }

    #scanButton:disabled{
      background:#aaa;
      cursor:not-allowed;
    }

    #resultPanel{
      display:none;
      margin-top:12px;
      padding:12px;
      border-radius:14px;
      background:#f8f8f8;
    }

    #identifiedRow{
      display:flex;
      align-items:center;
      gap:12px;
    }

    #cardImage{
      width:76px;
      border-radius:7px;
      display:block;
    }

    #cardInfo{
      flex:1;
      min-width:0;
    }

    #cardName{
      font-size:20px;
      font-weight:800;
      margin-bottom:4px;
    }

    #cardNumber{
      font-size:15px;
      color:#555;
      margin-bottom:3px;
    }

    #cardDetails{
      font-size:13px;
      color:#777;
    }

    #variantTitle{
      text-align:center;
      font-weight:800;
      font-size:15px;
      margin:13px 0 8px;
    }

    .variantGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .variantButton{
      border:none;
      border-radius:12px;
      padding:15px 8px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      background:#e9e9e9;
      color:#222;
    }

    .variantButton:active{
      transform:scale(0.98);
    }

    #wrongButton{
      width:100%;
      border:none;
      background:transparent;
      padding:11px 4px 3px;
      color:#666;
      text-decoration:underline;
      font-size:14px;
      cursor:pointer;
    }

    #candidatePanel{
      display:none;
      margin-top:10px;
    }

    .candidate{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:none;
      background:white;
      border-radius:10px;
      padding:8px;
      margin-bottom:7px;
      text-align:left;
      cursor:pointer;
    }

    .candidate img{
      width:48px;
      border-radius:4px;
    }

    .candidateText{
      flex:1;
    }

    .candidateName{
      font-weight:800;
      font-size:14px;
    }

    .candidateStats{
      color:#777;
      font-size:12px;
      margin-top:2px;
    }

    #manualArea{
      display:none;
      margin-top:10px;
    }

    #manualRow{
      display:flex;
      gap:7px;
    }

    #manualNumber{
      flex:1;
      min-width:0;
      border:1px solid #ccc;
      border-radius:10px;
      padding:11px;
      font-size:16px;
    }

    #manualButton{
      border:none;
      border-radius:10px;
      padding:10px 14px;
      font-size:15px;
      font-weight:700;
      background:#333;
      color:white;
    }

    #addMessage{
      display:none;
      text-align:center;
      font-size:18px;
      font-weight:800;
      padding:12px;
      margin-top:10px;
      border-radius:12px;
      background:#e8f5e9;
    }

    .sessionPanel{
      text-align:center;
      padding:12px;
    }

    .sessionLabel{
      font-size:14px;
      color:#666;
    }

    #sessionCount{
      font-size:30px;
      font-weight:800;
      margin-top:1px;
    }

    canvas{
      display:none;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Pokémon Inventory Scanner</h1>

  <div class="panel">

    <div id="status">
      Starting scanner...
    </div>

    <div id="cameraWrap">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="cardGuide"></div>

    </div>

    <button
      id="scanButton"
      disabled
    >
      PLEASE WAIT...
    </button>

    <div id="resultPanel">

      <div id="identifiedRow">

        <img
          id="cardImage"
          alt=""
        >

        <div id="cardInfo">

          <div id="cardName">
            Card
          </div>

          <div id="cardNumber">
          </div>

          <div id="cardDetails">
          </div>

        </div>

      </div>

      <div id="variantTitle">
        TAP VARIANT
      </div>

      <div class="variantGrid">

        <button
          class="variantButton"
          data-variant="Normal"
        >
          Normal
        </button>

        <button
          class="variantButton"
          data-variant="Reverse Holo"
        >
          Reverse Holo
        </button>

        <button
          class="variantButton"
          data-variant="Holo"
        >
          Holo
        </button>

        <button
          class="variantButton"
          data-variant="Other"
        >
          Other
        </button>

      </div>

      <button id="wrongButton">
        Wrong card / other matches
      </button>

      <div id="candidatePanel"></div>

      <div id="manualArea">

        <div id="manualRow">

          <input
            id="manualNumber"
            type="number"
            min="1"
            max="244"
            inputmode="numeric"
            placeholder="Card number"
          >

          <button id="manualButton">
            Find
          </button>

        </div>

      </div>

      <div id="addMessage">
        ✓ Added
      </div>

    </div>

    <div id="sheetStatus">
      Connecting to Google Sheet...
    </div>

  </div>

  <div class="panel sessionPanel">

    <div class="sessionLabel">
      Cards added this session
    </div>

    <div id="sessionCount">
      0
    </div>

  </div>

</div>

<canvas id="captureCanvas"></canvas>


<script>

const SCRIPT_URL =
  "https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbwDF5oxhER534DF16jG94SHwJ9jS2ySAWJXIKgUsOpXjsdy26JKiu1FOIAsQnOqk_6f/exec";

const RECOGNIZER_URL =
  "https://pokemon-card-recognizer.onrender.com";

const IMAGE_SET = "sv10";
const DENOMINATOR = 182;
const MAX_CARD = 244;

const UPLOAD_WIDTH = 360;
const UPLOAD_HEIGHT = 483;


let cards = [];
let cardMap = {};

let currentCard = null;
let currentMatches = [];

let sessionCount = 0;

let cameraReady = false;
let recognizerReady = false;
let sheetReady = false;
let scanning = false;


const video =
  document.getElementById("video");

const cameraWrap =
  document.getElementById("cameraWrap");

const guide =
  document.getElementById("cardGuide");

const scanButton =
  document.getElementById("scanButton");

const status =
  document.getElementById("status");

const sheetStatus =
  document.getElementById("sheetStatus");

const resultPanel =
  document.getElementById("resultPanel");

const cardImage =
  document.getElementById("cardImage");

const cardName =
  document.getElementById("cardName");

const cardNumber =
  document.getElementById("cardNumber");

const cardDetails =
  document.getElementById("cardDetails");

const wrongButton =
  document.getElementById("wrongButton");

const candidatePanel =
  document.getElementById("candidatePanel");

const manualArea =
  document.getElementById("manualArea");

const manualNumber =
  document.getElementById("manualNumber");

const manualButton =
  document.getElementById("manualButton");

const addMessage =
  document.getElementById("addMessage");

const sessionCountElement =
  document.getElementById("sessionCount");

const captureCanvas =
  document.getElementById("captureCanvas");


function updateScanButton(){

  if(
    cameraReady &&
    recognizerReady &&
    sheetReady &&
    !scanning
  ){

    scanButton.disabled = false;
    scanButton.textContent = "SCAN CARD";

  }else{

    scanButton.disabled = true;

    if(scanning){

      scanButton.textContent =
        "ANALYZING...";

    }else{

      scanButton.textContent =
        "PLEASE WAIT...";

    }

  }

}


async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }
        },

        audio:false

      });

    video.srcObject = stream;

    await video.play();

    cameraReady = true;

    updateScanButton();

  }catch(error){

    status.textContent =
      "Camera unavailable";

    console.error(error);

  }

}


async function checkRecognizer(){

  try{

    const response =
      await fetch(
        RECOGNIZER_URL + "/health",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Recognizer not ready"
      );

    }

    const data =
      await response.json();

    if(data.library_ready){

      recognizerReady = true;

      status.textContent =
        "Ready to scan";

    }else{

      recognizerReady = false;

      status.textContent =
        "Recognizer waking up...";

    }

  }catch(error){

    recognizerReady = false;

    status.textContent =
      "Recognizer unavailable";

  }

  updateScanButton();

}


function receiveCards(data){

  try{

    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "Invalid card data"
      );

    }

    cards = data;

    cardMap = {};

    cards.forEach(card=>{

      const number =
        Number(
          card.number ??
          card.cardNumber ??
          card["Card #"]
        );

      if(number){

        cardMap[number] = card;

      }

    });

    sheetReady = true;

    sheetStatus.textContent =
      "✓ Google Sheet connected • " +
      cards.length +
      " cards";

  }catch(error){

    sheetReady = false;

    sheetStatus.textContent =
      "Google Sheet connection failed";

    console.error(error);

  }

  updateScanButton();

}


function loadSheetData(){

  const oldScript =
    document.getElementById(
      "sheetJsonp"
    );

  if(oldScript){

    oldScript.remove();

  }

  const script =
    document.createElement(
      "script"
    );

  script.id = "sheetJsonp";

  script.src =
    SCRIPT_URL +
    "?api=cards" +
    "&callback=receiveCards" +
    "&_=" +
    Date.now();

  script.onerror = ()=>{

    sheetReady = false;

    sheetStatus.textContent =
      "Google Sheet connection failed";

    updateScanButton();

  };

  document.body.appendChild(
    script
  );

}


function captureGuide(){

  const videoRect =
    video.getBoundingClientRect();

  const guideRect =
    guide.getBoundingClientRect();

  const sourceWidth =
    video.videoWidth;

  const sourceHeight =
    video.videoHeight;

  const displayWidth =
    videoRect.width;

  const displayHeight =
    videoRect.height;

  const videoRatio =
    sourceWidth /
    sourceHeight;

  const displayRatio =
    displayWidth /
    displayHeight;


  let visibleWidth;
  let visibleHeight;
  let offsetX;
  let offsetY;


  if(videoRatio > displayRatio){

    visibleHeight =
      sourceHeight;

    visibleWidth =
      sourceHeight *
      displayRatio;

    offsetX =
      (
        sourceWidth -
        visibleWidth
      ) / 2;

    offsetY = 0;

  }else{

    visibleWidth =
      sourceWidth;

    visibleHeight =
      sourceWidth /
      displayRatio;

    offsetX = 0;

    offsetY =
      (
        sourceHeight -
        visibleHeight
      ) / 2;

  }


  const relativeLeft =
    (
      guideRect.left -
      videoRect.left
    ) /
    displayWidth;

  const relativeTop =
    (
      guideRect.top -
      videoRect.top
    ) /
    displayHeight;

  const relativeWidth =
    guideRect.width /
    displayWidth;

  const relativeHeight =
    guideRect.height /
    displayHeight;


  const sx =
    offsetX +
    relativeLeft *
    visibleWidth;

  const sy =
    offsetY +
    relativeTop *
    visibleHeight;

  const sw =
    relativeWidth *
    visibleWidth;

  const sh =
    relativeHeight *
    visibleHeight;


  captureCanvas.width =
    UPLOAD_WIDTH;

  captureCanvas.height =
    UPLOAD_HEIGHT;


  const context =
    captureCanvas.getContext(
      "2d"
    );

  context.drawImage(
    video,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    UPLOAD_WIDTH,
    UPLOAD_HEIGHT
  );


  return new Promise(
    resolve=>{

      captureCanvas.toBlob(
        resolve,
        "image/jpeg",
        0.82
      );

    }
  );

}


async function scanCard(){

  if(
    scanning ||
    !cameraReady ||
    !recognizerReady
  ){

    return;

  }

  scanning = true;

  hideResult();

  status.textContent =
    "Analyzing card...";

  updateScanButton();


  try{

    const blob =
      await captureGuide();

    const formData =
      new FormData();

    formData.append(
      "file",
      blob,
      "card.jpg"
    );


    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        ()=>{
          controller.abort();
        },
        90000
      );


    const response =
      await fetch(
        RECOGNIZER_URL +
        "/recognize",
        {
          method:"POST",
          body:formData,
          signal:
            controller.signal
        }
      );

    clearTimeout(timeout);


    if(!response.ok){

      throw new Error(
        "Recognition request failed"
      );

    }


    const result =
      await response.json();

    currentMatches =
      result.top_matches || [];


    if(
      result.status === "matched" &&
      result.best_match
    ){

      const number =
        Number(
          result.best_match.number
        );

      if(
        result.confident &&
        cardMap[number]
      ){

        showCard(
          cardMap[number]
        );

        status.textContent =
          "Card identified";

      }else{

        status.textContent =
          "Choose the correct card";

        showCandidates();

      }

    }else{

      status.textContent =
        "Card not identified";

      showCandidates();

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "Scan failed — try again";

  }


  scanning = false;

  updateScanButton();

}


function getCardNumber(card){

  return Number(
    card.number ??
    card.cardNumber ??
    card["Card #"]
  );

}


function getCardName(card){

  return (
    card.name ??
    card.cardName ??
    card["Card Name"] ??
    "Unknown Card"
  );

}


function getCardRarity(card){

  return (
    card.rarity ??
    card.Rarity ??
    ""
  );

}


function getCardType(card){

  return (
    card.type ??
    card.cardType ??
    card["Card Type"] ??
    ""
  );

}


function getCardRow(card){

  return (
    card.row ??
    card.sheetRow ??
    card.Row ??
    null
  );

}


function showCard(card){

  currentCard = card;

  const number =
    getCardNumber(card);

  const name =
    getCardName(card);

  const rarity =
    getCardRarity(card);

  const type =
    getCardType(card);


  cardImage.src =
    "https://images.pokemontcg.io/" +
    IMAGE_SET +
    "/" +
    number +
    ".png";


  cardName.textContent =
    name;

  cardNumber.textContent =
    "#" +
    String(number)
      .padStart(3,"0") +
    "/" +
    DENOMINATOR;


  const details = [];

  if(rarity){
    details.push(rarity);
  }

  if(type){
    details.push(type);
  }

  cardDetails.textContent =
    details.join(" • ");


  resultPanel.style.display =
    "block";

  candidatePanel.style.display =
    "none";

  manualArea.style.display =
    "none";

  addMessage.style.display =
    "none";


  setTimeout(()=>{

    resultPanel.scrollIntoView({
      behavior:"smooth",
      block:"nearest"
    });

  },50);

}


function showCandidates(){

  resultPanel.style.display =
    "block";

  candidatePanel.innerHTML = "";

  candidatePanel.style.display =
    "block";

  manualArea.style.display =
    "block";


  if(
    !currentMatches ||
    currentMatches.length === 0
  ){

    const message =
      document.createElement(
        "div"
      );

    message.textContent =
      "No reliable matches. Enter the card number below.";

    message.style.textAlign =
      "center";

    message.style.color =
      "#666";

    message.style.padding =
      "8px";

    candidatePanel.appendChild(
      message
    );

    return;

  }


  currentMatches
    .slice(0,5)
    .forEach(match=>{

      const number =
        Number(match.number);

      const card =
        cardMap[number];

      if(!card){
        return;
      }


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "candidate";


      const image =
        document.createElement(
          "img"
        );

      image.src =
        "https://images.pokemontcg.io/" +
        IMAGE_SET +
        "/" +
        number +
        ".png";


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "candidateText";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "candidateName";

      name.textContent =
        getCardName(card) +
        " #" +
        String(number)
          .padStart(3,"0");


      const stats =
        document.createElement(
          "div"
        );

      stats.className =
        "candidateStats";


      const verified =
        match.inliers ??
        match.good_matches ??
        0;

      const agreement =
        match.inlier_ratio
        ? Math.round(
            match.inlier_ratio *
            100
          )
        : 0;


      stats.textContent =
        verified +
        " verified matches • " +
        agreement +
        "% agreement";


      text.appendChild(name);
      text.appendChild(stats);

      button.appendChild(image);
      button.appendChild(text);


      button.addEventListener(
        "click",
        ()=>{

          showCard(card);

          status.textContent =
            "Card selected";

        }
      );


      candidatePanel.appendChild(
        button
      );

    });

}


function hideResult(){

  currentCard = null;

  resultPanel.style.display =
    "none";

  candidatePanel.style.display =
    "none";

  manualArea.style.display =
    "none";

  addMessage.style.display =
    "none";

}


function resetForNextCard(){

  currentCard = null;

  currentMatches = [];

  resultPanel.style.display =
    "none";

  candidatePanel.innerHTML = "";

  candidatePanel.style.display =
    "none";

  manualArea.style.display =
    "none";

  manualNumber.value = "";

  addMessage.style.display =
    "none";

  status.textContent =
    "Ready for next card";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function addQuantity(
  row,
  variant
){

  return new Promise(
    resolve=>{

      const iframe =
        document.createElement(
          "iframe"
        );

      iframe.name =
        "sheetFrame_" +
        Date.now();

      iframe.style.display =
        "none";

      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );

      form.method =
        "POST";

      form.action =
        SCRIPT_URL;

      form.target =
        iframe.name;

      form.style.display =
        "none";


      const fields = {

        action:
          "changeQuantity",

        row:
          row,

        variant:
          variant,

        change:
          1

      };


      Object.entries(
        fields
      ).forEach(
        ([name,value])=>{

          const input =
            document.createElement(
              "input"
            );

          input.type =
            "hidden";

          input.name =
            name;

          input.value =
            value;

          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );

      form.submit();


      setTimeout(()=>{

        form.remove();

        iframe.remove();

        resolve();

      },500);

    }
  );

}


async function chooseVariant(
  variant
){

  if(!currentCard){
    return;
  }


  const row =
    getCardRow(
      currentCard
    );


  if(!row){

    status.textContent =
      "Sheet row not found";

    return;
  }


  document
    .querySelectorAll(
      ".variantButton"
    )
    .forEach(button=>{

      button.disabled = true;

    });


  status.textContent =
    "Adding to inventory...";


  addMessage.textContent =
    "✓ " +
    variant +
    " added";

  addMessage.style.display =
    "block";


  sessionCount++;

  sessionCountElement.textContent =
    sessionCount;


  await addQuantity(
    row,
    variant
  );


  setTimeout(()=>{

    document
      .querySelectorAll(
        ".variantButton"
      )
      .forEach(button=>{

        button.disabled = false;

      });

    resetForNextCard();

  },350);

}


function manualFind(){

  const number =
    Number(
      manualNumber.value
    );

  if(
    !number ||
    number < 1 ||
    number > MAX_CARD
  ){

    return;

  }


  const card =
    cardMap[number];


  if(!card){

    status.textContent =
      "Card number not found";

    return;

  }


  showCard(card);

  status.textContent =
    "Card selected manually";

}


scanButton.addEventListener(
  "click",
  scanCard
);


wrongButton.addEventListener(
  "click",
  ()=>{

    currentCard = null;

    showCandidates();

    status.textContent =
      "Choose the correct card";

  }
);


manualButton.addEventListener(
  "click",
  manualFind
);


manualNumber.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Enter"){

      event.preventDefault();

      manualFind();

    }

  }
);


document
  .querySelectorAll(
    ".variantButton"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        chooseVariant(
          button.dataset.variant
        );

      }
    );

  });


async function initialize(){

  status.textContent =
    "Starting camera...";

  loadSheetData();

  await startCamera();

  await checkRecognizer();


  if(!recognizerReady){

    setTimeout(
      checkRecognizer,
      5000
    );

  }

}


initialize();

</script>
