<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>TCG Inventory Scanner</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#222222">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TCG Scanner">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css">

</head>

<body>

<div class="app">

  <h1>Pokémon Inventory Scanner</h1>

  <div class="panel">

    <div id="status">
      Starting scanner...
    </div>

    <div id="cameraWrap">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="cardGuide"></div>

    </div>

    <button
      id="scanButton"
      disabled
    >
      PLEASE WAIT...
    </button>

    <div id="resultPanel">

      <div id="identifiedRow">

        <img
          id="cardImage"
          alt=""
        >

        <div id="cardInfo">

          <div id="cardName">
            Card
          </div>

          <div id="cardNumber"></div>

          <div id="cardDetails"></div>

        </div>

      </div>

      <div id="variantTitle">
        TAP VARIANT
      </div>

      <div class="variantGrid">

        <button
          class="variantButton"
          data-variant="Normal"
        >
          Normal
        </button>

        <button
          class="variantButton"
          data-variant="Reverse Holo"
        >
          Reverse Holo
        </button>

        <button
          class="variantButton"
          data-variant="Holo"
        >
          Holo
        </button>

        <button
          class="variantButton"
          data-variant="Other"
        >
          Other
        </button>

      </div>

      <button id="wrongButton">
        Wrong card / other matches
      </button>

      <div id="candidatePanel"></div>

      <div id="manualArea">

        <div id="manualRow">

          <input
            id="manualNumber"
            type="number"
            min="1"
            max="244"
            inputmode="numeric"
            placeholder="Card number"
          >

          <button id="manualButton">
            Find
          </button>

        </div>

      </div>

      <div id="addMessage">
        ✓ Added
      </div>

    </div>

    <div id="sheetStatus">
      Connecting to Google Sheet...
    </div>

  </div>

  <div class="panel sessionPanel">

    <div class="sessionLabel">
      Cards added this session
    </div>

    <div id="sessionCount">
      0
    </div>

    <button
      id="undoButton"
      disabled
    >
      ↶ UNDO LAST ADD
    </button>

  </div>

</div>

<canvas id="captureCanvas"></canvas>


<!-- Scanner JavaScript -->
<script src="./js/config.js"></script>
<script src="./js/camera.js"></script>
<script src="./js/recognizer.js"></script>
<script src="./js/inventory.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
