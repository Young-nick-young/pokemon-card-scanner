<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Pokémon Card Inventory Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 21px;
  margin: 6px 0 14px;
}

.section {
  background: white;
  padding: 13px;
  border-radius: 14px;
  margin-bottom: 10px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 6px;
}

select {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

#startButton {
  margin-top: 10px;
  background: #222;
  color: white;
}

#stopButton {
  display: none;
  margin-top: 8px;
  background: #777;
  color: white;
}

/* CAMERA */

#cameraBox {
  display: none;
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #111;
  border-radius: 14px;
  margin-bottom: 10px;
}

#video {
  display: block;
  width: 100%;
  height: auto;
}

/*
=====================================================
WHITE CARD GUIDE

Standard Pokémon card:
63 mm × 88 mm

Our requested guide:
73 mm × 98 mm

Therefore:
aspect-ratio: 73 / 98

The width controls its physical size on screen.
The height is ALWAYS calculated automatically.
=====================================================
*/

#cardGuide {
  position: absolute;

  width: 73%;

  aspect-ratio: 73 / 98;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border: 3px solid white;
  border-radius: 14px;

  pointer-events: none;
}

/*
=====================================================
COLLECTOR NUMBER GUIDE

This is positioned INSIDE the white frame.

So if the white frame moves/scales, this moves
with it.
=====================================================
*/

#numberGuide {
  position: absolute;

  left: 10%;
  bottom: 5%;

  width: 43%;
  height: 10%;

  border: 3px dashed #ffd600;
  border-radius: 7px;

  pointer-events: none;
}

#cameraMessage {
  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  background: rgba(0,0,0,.7);
  color: white;

  padding: 6px 10px;

  border-radius: 20px;

  font-size: 11px;
  white-space: nowrap;

  pointer-events: none;
}

/* STATUS */

#status {
  display: none;

  padding: 11px;
  margin-bottom: 10px;

  border-radius: 9px;

  text-align: center;
  font-size: 14px;
}

.working {
  display: block !important;
  background: #fff3cd;
}

.success {
  display: block !important;
  background: #d4edda;
}

.error {
  display: block !important;
  background: #f8d7da;
}

/* OCR PREVIEW */

#ocrPreviewSection {
  display: none;

  padding: 10px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;
}

#ocrPreviewLabel {
  margin-bottom: 6px;

  text-align: center;

  color: #666;

  font-size: 12px;
}

#ocrCanvas {
  display: block;

  width: 100%;
  max-height: 130px;

  object-fit: contain;

  background: white;

  border: 2px solid #333;
  border-radius: 8px;
}

#modeLabel {
  margin-top: 5px;

  text-align: center;

  color: #777;

  font-size: 11px;
}

#ocrText {
  margin-top: 7px;

  padding: 7px;

  background: #eee;

  border-radius: 7px;

  font-size: 11px;

  word-break: break-word;
}

/* DETECTED CARD */

#detectedCard {
  display: none;

  padding: 15px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;

  text-align: center;
}

#detectedImage {
  width: 190px;
  max-width: 70%;

  border-radius: 7px;
}

#detectedNumber {
  margin-top: 8px;

  font-size: 25px;
  font-weight: bold;
}

#detectedSet {
  margin-top: 3px;

  color: #666;

  font-size: 14px;
}

#correctButton {
  margin-top: 13px;

  background: #4caf50;
  color: white;
}

#wrongButton {
  margin-top: 7px;

  background: #ddd;
  color: #222;
}

.smallText {
  margin-top: 7px;

  text-align: center;

  color: #777;

  font-size: 12px;
  line-height: 1.4;
}

</style>
</head>


<body>

<div class="container">

<h1>Pokémon Card Inventory</h1>


<div class="section">

<label for="setSelector">
Set being scanned
</label>

<select id="setSelector">

<option value="destined-rivals">
Destined Rivals
</option>

</select>


<button
id="startButton"
onclick="startScanner()"
>
📷 START SCANNER
</button>


<button
id="stopButton"
onclick="stopScanner()"
>
STOP CAMERA
</button>


<div class="smallText">

White frame = 73 × 98 mm proportions.

<br>

A standard card is 63 × 88 mm.

</div>

</div>


<div id="status"></div>


<div id="cameraBox">

<video
id="video"
autoplay
playsinline
muted
></video>


<!--
IMPORTANT:

numberGuide is INSIDE cardGuide.
-->

<div id="cardGuide">

  <div id="numberGuide"></div>

</div>


<div id="cameraMessage">
Place card roughly in white frame
</div>

</div>


<div id="ocrPreviewSection">

<div id="ocrPreviewLabel">
Scanner is reading:
</div>

<canvas id="ocrCanvas"></canvas>

<div id="modeLabel"></div>

<div id="ocrText">
OCR: waiting...
</div>

</div>


<div id="detectedCard">

<div style="
font-size:13px;
color:#777;
margin-bottom:8px;
">
CARD DETECTED
</div>


<img id="detectedImage">


<div id="detectedNumber"></div>

<div id="detectedSet"></div>


<button
id="correctButton"
onclick="confirmCard()"
>
✓ CORRECT
</button>


<button
id="wrongButton"
onclick="rejectCard()"
>
✕ WRONG — TRY AGAIN
</button>

</div>

</div>



<script>

/*
=====================================================
SETS
=====================================================
*/

const SETS = {

  "destined-rivals": {

    name: "Destined Rivals",

    code: "DRI",

    denominator: 182,

    maxNumber: 244,

    imageSet: "sv10"

  }

};



/*
=====================================================
VARIABLES
=====================================================
*/

let cameraStream = null;

let scannerRunning = false;

let scannerPaused = false;

let scanBusy = false;

let scanTimer = null;

let ocrWorker = null;

let scanPass = 0;

let detectedNumber = null;



/*
=====================================================
START
=====================================================
*/

async function startScanner() {

  try {

    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    document.getElementById(
      "ocrPreviewSection"
    ).style.display =
      "block";


    document.getElementById(
      "startButton"
    ).style.display =
      "none";


    document.getElementById(
      "stopButton"
    ).style.display =
      "block";


    scannerRunning =
      true;


    scannerPaused =
      false;


    await createOcrWorker();


    setStatus(
      "Ready — hold a card in the white frame.",
      "working"
    );


    scheduleScan(500);

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Camera error: " +
      error.message,
      "error"
    );

  }

}



/*
=====================================================
TESSERACT
=====================================================
*/

async function createOcrWorker() {

  if (ocrWorker) {
    return;
  }


  setStatus(
    "Loading OCR...",
    "working"
  );


  ocrWorker =
    await Tesseract.createWorker(
      "eng"
    );


  await ocrWorker.setParameters({

    tessedit_char_whitelist:
      "0123456789/| ",

    tessedit_pageseg_mode:
      "7",

    preserve_interword_spaces:
      "1"

  });

}



/*
=====================================================
SCHEDULE
=====================================================
*/

function scheduleScan(delay) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {
    return;
  }


  if (scanTimer) {

    clearTimeout(scanTimer);

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}



/*
=====================================================
GET OCR AREA FROM THE ACTUAL WHITE FRAME

This is the important change.

We read the real position of the yellow box on
the phone screen and convert that into video pixels.

We are no longer guessing x/y percentages.
=====================================================
*/

function getNumberCrop(video) {

  const videoRect =
    video.getBoundingClientRect();


  const guideRect =
    document
      .getElementById("numberGuide")
      .getBoundingClientRect();


  /*
  Add hidden tolerance around yellow box.

  Approximately 15% horizontally and
  30% vertically.
  */

  const extraX =
    guideRect.width * 0.15;


  const extraY =
    guideRect.height * 0.30;


  let screenX =
    guideRect.left -
    videoRect.left -
    extraX;


  let screenY =
    guideRect.top -
    videoRect.top -
    extraY;


  let screenWidth =
    guideRect.width +
    extraX * 2;


  let screenHeight =
    guideRect.height +
    extraY * 2;


  /*
  Convert displayed video coordinates
  to actual camera resolution.
  */

  const scaleX =
    video.videoWidth /
    videoRect.width;


  const scaleY =
    video.videoHeight /
    videoRect.height;


  let x =
    screenX * scaleX;


  let y =
    screenY * scaleY;


  let width =
    screenWidth * scaleX;


  let height =
    screenHeight * scaleY;


  /*
  Keep crop inside camera image.
  */

  x =
    Math.max(
      0,
      x
    );


  y =
    Math.max(
      0,
      y
    );


  width =
    Math.min(
      video.videoWidth - x,
      width
    );


  height =
    Math.min(
      video.videoHeight - y,
      height
    );


  return {

    x:
      Math.round(x),

    y:
      Math.round(y),

    width:
      Math.round(width),

    height:
      Math.round(height)

  };

}



/*
=====================================================
SCAN
=====================================================
*/

async function scanFrame() {

  if (
    !scannerRunning ||
    scannerPaused ||
    scanBusy
  ) {
    return;
  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    scheduleScan(400);

    return;

  }


  scanBusy =
    true;


  try {

    const crop =
      getNumberCrop(video);


    const canvas =
      document.getElementById(
        "ocrCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );



    /*
    =================================================
    PROCESSING MODES
    =================================================
    */

    const modes = [

      {
        name:
          "Enhanced contrast",

        type:
          "contrast"
      },

      {
        name:
          "Grayscale",

        type:
          "gray"
      },

      {
        name:
          "Original colour",

        type:
          "colour"
      }

    ];


    const mode =

      modes[
        scanPass %
        modes.length
      ];


    scanPass++;


    document.getElementById(
      "modeLabel"
    ).innerText =
      mode.name;



    /*
    =================================================
    ENLARGE OCR AREA
    =================================================
    */

    const targetWidth =
      1800;


    const scale =
      targetWidth /
      crop.width;


    const targetHeight =

      Math.max(

        1,

        Math.round(

          crop.height *
          scale

        )

      );


    canvas.width =
      targetWidth;


    canvas.height =
      targetHeight;



    ctx.drawImage(

      video,

      crop.x,
      crop.y,

      crop.width,
      crop.height,

      0,
      0,

      targetWidth,
      targetHeight

    );



    /*
    =================================================
    IMAGE PROCESSING
    =================================================
    */

    if (
      mode.type !==
      "colour"
    ) {

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const data =
        imageData.data;


      for (
        let i = 0;
        i < data.length;
        i += 4
      ) {

        const gray =

          data[i] * 0.299 +

          data[i + 1] * 0.587 +

          data[i + 2] * 0.114;


        let value =
          gray;


        if (
          mode.type ===
          "contrast"
        ) {

          value =

            (
              gray - 128
            )

            * 1.8

            + 128;


          value =

            Math.max(
              0,
              Math.min(
                255,
                value
              )
            );

        }


        data[i] =
          value;


        data[i + 1] =
          value;


        data[i + 2] =
          value;

      }


      ctx.putImageData(
        imageData,
        0,
        0
      );

    }



    /*
    =================================================
    OCR
    =================================================
    */

    const result =
      await ocrWorker.recognize(
        canvas
      );


    let text =

      (
        result.data.text ||
        ""
      )

      .replace(
        /\n/g,
        " "
      )

      .replace(
        /[Oo]/g,
        "0"
      )

      .replace(
        /[Il]/g,
        "1"
      )

      .replace(
        /\s+/g,
        " "
      )

      .trim();



    document.getElementById(
      "ocrText"
    ).innerText =

      "OCR: " +
      (
        text ||
        "(nothing)"
      );



    const number =
      extractCollectorNumber(
        text
      );



    if (
      number !== null
    ) {

      showDetectedCard(
        number
      );

      return;

    }

  }

  catch (error) {

    console.error(
      "OCR error:",
      error
    );

  }

  finally {

    scanBusy =
      false;

  }


  scheduleScan(
    300
  );

}



/*
=====================================================
NUMBER RECOGNITION
=====================================================
*/

function extractCollectorNumber(text) {

  const setKey =
    document.getElementById(
      "setSelector"
    ).value;


  const set =
    SETS[setKey];


  const denominator =
    set.denominator;



  let cleaned =

    text

    .replace(
      /\s+/g,
      ""
    );



  /*
  034/182
  034|182
  */

  let match =

    cleaned.match(

      new RegExp(

        "(\\d{1,3})[\\/|]" +
        denominator

      )

    );



  /*
  034182
  */

  if (!match) {

    match =

      cleaned.match(

        new RegExp(

          "(\\d{1,3})" +
          denominator

        )

      );

  }



  if (!match) {

    return null;

  }



  const number =
    parseInt(
      match[1],
      10
    );


  if (
    number < 1 ||
    number > set.maxNumber
  ) {

    return null;

  }


  return number;

}



/*
=====================================================
DETECTED
=====================================================
*/

function showDetectedCard(number) {

  scannerPaused =
    true;


  detectedNumber =
    number;


  const setKey =
    document.getElementById(
      "setSelector"
    ).value;


  const set =
    SETS[setKey];


  const padded =
    String(number)
    .padStart(
      3,
      "0"
    );


  document.getElementById(
    "detectedNumber"
  ).innerText =

    "#" +
    padded +
    "/" +
    set.denominator;


  document.getElementById(
    "detectedSet"
  ).innerText =
    set.name;


  document.getElementById(
    "detectedImage"
  ).src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    number +

    ".png";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "block";


  setStatus(
    "✓ Card detected!",
    "success"
  );

}



/*
=====================================================
CORRECT / WRONG
=====================================================
*/

function confirmCard() {

  setStatus(
    "✓ Correct — hold up the next card.",
    "success"
  );


  prepareNextCard();

}


function rejectCard() {

  setStatus(
    "Trying again...",
    "working"
  );


  prepareNextCard();

}


function prepareNextCard() {

  detectedNumber =
    null;


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  scannerPaused =
    false;


  scanPass =
    0;


  scheduleScan(
    450
  );

}



/*
=====================================================
STOP
=====================================================
*/

function stopScanner() {

  scannerRunning =
    false;


  scannerPaused =
    false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  cameraStream =
    null;


  document.getElementById(
    "video"
  ).srcObject =
    null;


  document.getElementById(
    "cameraBox"
  ).style.display =
    "none";


  document.getElementById(
    "ocrPreviewSection"
  ).style.display =
    "none";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "stopButton"
  ).style.display =
    "none";


  setStatus(
    "Camera stopped.",
    "working"
  );

}



/*
=====================================================
STATUS
=====================================================
*/

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    type;

}

</script>

</body>
</html>
