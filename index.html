/*

GOOGLE SHEET CARD DATABASE

Apps Script returns data using JSONP.
This avoids cross-origin fetch problems.
=================================================
*/


window.receiveCards =
  function(cards) {

    inventoryCards =
      cards || [];


    inventoryByNumber =
      {};


    inventoryCards.forEach(
      card => {

        inventoryByNumber[
          Number(card.number)
        ] =
          card;

      }
    );


    sheetStatus.innerText =
      `✓ Google Sheet connected • ${inventoryCards.length} cards`;

  };


function loadInventoryFromSheet() {

  const oldScript =
    document.getElementById(
      "sheetDataScript"
    );


  if (oldScript) {
    oldScript.remove();
  }


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "sheetDataScript";


  script.src =
    SCRIPT_URL +
    "?api=cards" +
    "&callback=receiveCards" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      sheetStatus.innerText =
        "⚠ Could not load Google Sheet inventory.";

    };


  document.body.appendChild(
    script
  );

}


/*
=================================================
INDEXED DB
=================================================
*/


function openDatabase() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          "pokemonScannerDB",
          1
        );


      request.onupgradeneeded =
        event => {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              "data"
            )
          ) {

            db.createObjectStore(
              "data"
            );

          }

        };


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


async function loadCachedReferences() {

  try {

    const db =
      await openDatabase();


    return await new Promise(
      resolve => {

        const transaction =
          db.transaction(
            "data",
            "readonly"
          );


        const store =
          transaction.objectStore(
            "data"
          );


        const request =
          store.get(
            "destined-rivals-dinov2-v1"
          );


        request.onsuccess =
          () =>
            resolve(
              request.result ||
              null
            );


        request.onerror =
          () =>
            resolve(
              null
            );

      }
    );

  }

  catch {

    return null;

  }

}


async function saveCachedReferences(
  data
) {

  try {

    const db =
      await openDatabase();


    await new Promise(
      (resolve, reject) => {

        const transaction =
          db.transaction(
            "data",
            "readwrite"
          );


        transaction
          .objectStore(
            "data"
          )
          .put(
            data,
            "destined-rivals-dinov2-v1"
          );


        transaction.oncomplete =
          resolve;


        transaction.onerror =
          () =>
            reject(
              transaction.error
            );

      }
    );

  }

  catch (error) {

    console.warn(
      "Reference cache error:",
      error
    );

  }

}


/*
=================================================
VECTOR HELPERS
=================================================
*/


function normalizeVector(
  array
) {

  let magnitude =
    0;


  for (
    let i = 0;
    i < array.length;
    i++
  ) {

    magnitude +=
      array[i] *
      array[i];

  }


  magnitude =
    Math.sqrt(
      magnitude
    ) || 1;


  const result =
    new Float32Array(
      array.length
    );


  for (
    let i = 0;
    i < array.length;
    i++
  ) {

    result[i] =
      array[i] /
      magnitude;

  }


  return result;

}


function cosineSimilarity(
  a,
  b
) {

  let score =
    0;


  const length =
    Math.min(
      a.length,
      b.length
    );


  for (
    let i = 0;
    i < length;
    i++
  ) {

    score +=
      a[i] *
      b[i];

  }


  return score;

}


/*
=================================================
IMAGE EMBEDDING
=================================================
*/


async function getEmbedding(
  image
) {

  const output =
    await extractor(
      image,
      {
        pooling:
          "mean",

        normalize:
          true
      }
    );


  const data =
    output.data;


  if (
    !data ||
    !data.length
  ) {

    throw new Error(
      "Recognition model returned no image features."
    );

  }


  if (
    output.dims &&
    output.dims.length === 3
  ) {

    const tokenCount =
      output.dims[1];


    const dimension =
      output.dims[2];


    const pooled =
      new Float32Array(
        dimension
      );


    for (
      let token = 0;
      token < tokenCount;
      token++
    ) {

      const offset =
        token *
        dimension;


      for (
        let d = 0;
        d < dimension;
        d++
      ) {

        pooled[d] +=
          data[
            offset + d
          ];

      }

    }


    for (
      let d = 0;
      d < dimension;
      d++
    ) {

      pooled[d] /=
        tokenCount;

    }


    return normalizeVector(
      pooled
    );

  }


  return normalizeVector(
    data
  );

}


/*
=================================================
REFERENCE LIBRARY
=================================================
*/


async function getReferenceImage(
  number
) {

  const url =
    `https://images.pokemontcg.io/${IMAGE_SET}/${number}.png`;


  return await RawImage.fromURL(
    url
  );

}


async function prepareReferences() {

  const cached =
    await loadCachedReferences();


  if (
    cached &&
    cached.length === MAX_CARD
  ) {

    references =
      cached.map(
        item => ({
          number:
            item.number,

          vector:
            new Float32Array(
              item.vector
            )
        })
      );


    progress.innerText =
      "244 reference cards loaded from phone cache.";


    return;

  }


  references =
    [];


  for (
    let number = 1;
    number <= MAX_CARD;
    number++
  ) {

    progress.innerText =
      `Preparing Destined Rivals cards: ${number} / ${MAX_CARD}`;


    try {

      const image =
        await getReferenceImage(
          number
        );


      const vector =
        await getEmbedding(
          image
        );


      references.push({
        number,
        vector
      });

    }

    catch (error) {

      console.error(
        "Reference failed:",
        number,
        error
      );

    }

  }


  if (
    references.length < 230
  ) {

    throw new Error(
      `Only ${references.length} of 244 reference cards were prepared.`
    );

  }


  const cacheData =
    references.map(
      item => ({
        number:
          item.number,

        vector:
          Array.from(
            item.vector
          )
      })
    );


  await saveCachedReferences(
    cacheData
  );


  progress.innerText =
    `${references.length} reference cards ready.`;

}

}


/*
=================================================
CAPTURE CARD
=================================================
*/


function captureCard() {

  const videoRect =
    video.getBoundingClientRect();


  const guideRect =
    cardGuide.getBoundingClientRect();


  const scaleX =
    video.videoWidth /
    videoRect.width;


  const scaleY =
    video.videoHeight /
    videoRect.height;


  const guideX =
    (
      guideRect.left -
      videoRect.left
    ) *
    scaleX;


  const guideY =
    (
      guideRect.top -
      videoRect.top
    ) *
    scaleY;


  const guideWidth =
    guideRect.width *
    scaleX;


  const guideHeight =
    guideRect.height *
    scaleY;


  /*
  Actual Pokémon card is 63 × 88 mm.

  White guide is 73 × 98 mm.
  */


  const cardWidth =
    guideWidth *
    (63 / 73);


  const cardHeight =
    guideHeight *
    (88 / 98);


  const sourceX =
    guideX +
    (
      guideWidth -
      cardWidth
    ) / 2;


  const sourceY =
    guideY +
    (
      guideHeight -
      cardHeight
    ) / 2;


  cropCanvas.width =
    448;


  cropCanvas.height =
    624;


  const ctx =
    cropCanvas.getContext(
      "2d"
    );


  ctx.drawImage(

    video,

    sourceX,
    sourceY,

    cardWidth,
    cardHeight,

    0,
    0,

    cropCanvas.width,
    cropCanvas.height

  );


  return cropCanvas;

}


async function canvasToRawImage(
  canvas
) {

  const blob =
    await new Promise(
      resolve =>
        canvas.toBlob(
          resolve,
          "image/jpeg",
          .92
        )
    );


  if (!blob) {

    throw new Error(
      "Could not capture card image."
    );

  }


  const url =
    URL.createObjectURL(
      blob
    );


  try {

    return await RawImage.fromURL(
      url
    );

  }

  finally {

    setTimeout(
      () =>
        URL.revokeObjectURL(
          url
        ),
      1000
    );

  }

}

  progress.innerText =
    "Comparing with Destined Rivals.";


  try {

    const canvas =
      captureCard();


    const image =
      await canvasToRawImage(
        canvas
      );


    const liveVector =
      await getEmbedding(
        image
      );


    rankedMatches =
      references
        .map(
          reference => ({

            number:
              reference.number,

            score:
              cosineSimilarity(
                liveVector,
                reference.vector
              )

          })
        )
        .sort(
          (a, b) =>
            b.score -
            a.score
        )
        .slice(
          0,
          5
        );


    selectMatch(
      rankedMatches[0]
    );


    status.firstChild.textContent =
      "✓ Card identified";


    progress.innerText =
      "Choose the version below.";

  }

  catch (error) {

    console.error(
      error
    );


    status.firstChild.textContent =
      "Recognition error";


    progress.innerText =
      error.message;

  }


  scanButton.disabled =
    false;


  scanButton.innerText =
    "🔍 SCAN ANOTHER CARD";

}


/*
=================================================
SELECT MATCH
=================================================
*/


function selectMatch(
  match
) {

  const sheetCard =
    inventoryByNumber[
      Number(
        match.number
      )
    ];


  /*
  If Google Sheet data has not loaded,
  still allow identification.
  */


  currentCard =
    sheetCard || {

      row:
        START_ROW_FALLBACK(
          match.number
        ),

      number:
        String(
          match.number
        ).padStart(
          3,
          "0"
        ),

      name:
        "Destined Rivals Card",

      rarity:
        "",

      type:
        "",

      normal:
        0,

      reverse:
        0,

      holo:
        0,

      other:
        0

    };


  identifiedImage.src =
    `https://images.pokemontcg.io/${IMAGE_SET}/${match.number}.png`;


  identifiedName.innerText =
    currentCard.name;


  identifiedNumber.innerText =
    "#" +
    String(
      match.number
    ).padStart(
      3,
      "0"
    ) +
    "/" +
    DENOMINATOR;


  identifiedRarity.innerText =
    currentCard.rarity || "";


  identifiedType.innerText =
    currentCard.type || "";


  confidence.innerText =
    "Recognition similarity: " +
    (
      match.score *
      100
    ).toFixed(
      1
    ) +
    "%";


  updateCounts();


  /*
  Destined Rivals only shows Reverse Holo
  when that card actually has one.
  */


  if (
    currentCard.reverse === null
  ) {

    reverseButton.style.display =
      "none";

  }

  else {

    reverseButton.style.display =
      "flex";

  }


  identifiedCard.style.display =
    "block";


  correctionArea.style.display =
    "none";


  saveMessage.style.display =
    "none";


  identifiedCard.scrollIntoView({
    behavior:
      "smooth",

    block:
      "start"
  });

}


/*
Only used if Google Sheet card data has not
finished loading.

Row 13 = card 1.
*/

function START_ROW_FALLBACK(
  cardNumber
) {

  return 12 +
    Number(
      cardNumber
    );

}


/*
=================================================
COUNTS
=================================================
*/


function updateCounts() {

  normalCount.innerText =
    currentCard.normal || 0;


  reverseCount.innerText =
    currentCard.reverse === null
      ? "-"
      : currentCard.reverse || 0;


  holoCount.innerText =
    currentCard.holo || 0;


  otherCount.innerText =
    currentCard.other || 0;

}


/*
=================================================
WRITE TO GOOGLE SHEET
=================================================
*/


function addCard(
  variant
) {

  if (!currentCard) {
    return;
  }


  if (
    variant === "reverse" &&
    currentCard.reverse === null
  ) {

    return;

  }


  /*
  Optimistically update the number shown
  on screen immediately.
  */


  currentCard[variant] =
    (
      Number(
        currentCard[variant]
      ) || 0
    ) + 1;


  updateCounts();


  saveMessage.innerText =
    "✓ Added to Google Sheet";


  saveMessage.style.display =
    "block";


  /*
  Submit to Apps Script through hidden iframe.
  This avoids CORS problems between
  GitHub Pages and Apps Script.
  */


  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    SCRIPT_URL;


  form.target =
    "sheetUpdateFrame";


  form.style.display =
    "none";


  const fields = {

    action:
      "changeQuantity",

    row:
      currentCard.row,

    variant:
      variant,

    change:
      1

  };


  Object.entries(
    fields
  ).forEach(
    ([name, value]) => {

      const input =
        document.createElement(
          "input"
        );


      input.type =
        "hidden";


      input.name =
        name;


      input.value =
        value;


      form.appendChild(
        input
      );

    }
  );


  document.body.appendChild(
    form
  );


  form.submit();


  setTimeout(
    () =>
      form.remove(),
    1000
  );


  /*
  After adding the card, leave the result
  visible briefly and then return attention
  to the camera for fast bulk scanning.
  */


  setTimeout(
    () => {

      saveMessage.style.display =
        "none";


      identifiedCard.style.display =
        "none";


      correctionArea.style.display =
        "none";


      status.firstChild.textContent =
        "Ready for next card";


      progress.innerText =
        "Place the next card inside the white frame.";


      scanButton.innerText =
        "🔍 IDENTIFY CARD";


      window.scrollTo({
        top:
          0,

        behavior:
          "smooth"
      });

    },
    900
  );

}


/*
=================================================
WRONG CARD / OTHER MATCHES
=================================================
*/


function showCorrections() {

  correctionMatches.innerHTML =
    "";


  rankedMatches.forEach(
    match => {

      const card =
        inventoryByNumber[
          Number(
            match.number
          )
        ];


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "correctionCard";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        `https://images.pokemontcg.io/${IMAGE_SET}/${match.number}.png`;


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "correctionText";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "correctionName";


      name.innerText =
        card
          ? card.name
          : "Destined Rivals Card";


      const number =
        document.createElement(
          "div"
        );


      number.className =
        "correctionNumber";


      number.innerText =
        "#" +
        String(
          match.number
        ).padStart(
          3,
          "0"
        ) +
        "/" +
        DENOMINATOR +
        " • " +
        (
          match.score *
          100
        ).toFixed(
          1
        ) +
        "%";


      text.appendChild(
        name
      );


      text.appendChild(
        number
      );


      row.appendChild(
        image
      );


      row.appendChild(
        text
      );


      row.addEventListener(
        "click",
        () => {

          selectMatch(
            match
          );

        }
      );


      correctionMatches.appendChild(
        row
      );

    }
  );


  correctionArea.style.display =
    "block";

}


/*
=================================================
BUTTONS
=================================================
*/


startButton.addEventListener(
  "click",
  startCamera
);


scanButton.addEventListener(
  "click",
  identifyCard
);


normalButton.addEventListener(
  "click",
  () =>
    addCard(
      "normal"
    )
);


reverseButton.addEventListener(
  "click",
  () =>
    addCard(
      "reverse"
    )
);


holoButton.addEventListener(
  "click",
  () =>
    addCard(
      "holo"
    )
);


otherButton.addEventListener(
  "click",
  () =>
    addCard(
      "other"
    )
);


wrongButton.addEventListener(
  "click",
  showCorrections
);


/*
=================================================
CLEANUP
=================================================
*/


window.addEventListener(
  "pagehide",
  () => {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);


/*
=================================================
START
=================================================
*/


initialize();


</script>
