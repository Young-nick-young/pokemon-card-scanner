<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Pokémon Card Scanner</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;

  font-family: Arial, sans-serif;

  background: #f4f4f4;
  color: #222;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;

  margin: 6px 0 14px;

  font-size: 21px;
}

.section {
  padding: 13px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;
}

label {
  display: block;

  margin-bottom: 6px;

  font-size: 14px;
  font-weight: bold;
}

select {
  width: 100%;

  padding: 12px;

  border: 1px solid #ccc;
  border-radius: 9px;

  background: white;

  font-size: 16px;
}

button {
  width: 100%;

  padding: 14px;

  border: 0;
  border-radius: 10px;

  font-size: 16px;
  font-weight: bold;
}

#startButton {
  margin-top: 10px;

  background: #222;
  color: white;
}

#stopButton {
  display: none;

  margin-top: 8px;

  background: #777;
  color: white;
}


/* =========================================
   STATUS
========================================= */

#status {
  display: none;

  padding: 11px;
  margin-bottom: 10px;

  border-radius: 9px;

  text-align: center;
  font-size: 14px;
}

.working {
  display: block !important;
  background: #fff3cd;
}

.success {
  display: block !important;
  background: #d4edda;
}

.error {
  display: block !important;
  background: #f8d7da;
}


/* =========================================
   LIBRARY LOADING
========================================= */

#libraryBox {
  display: none;

  padding: 12px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;
}

#libraryText {
  margin-bottom: 7px;

  text-align: center;

  font-size: 13px;
}

#progressOuter {
  width: 100%;
  height: 13px;

  overflow: hidden;

  background: #ddd;

  border-radius: 10px;
}

#progressInner {
  width: 0%;
  height: 100%;

  background: #333;

  transition: width .15s;
}


/* =========================================
   CAMERA
========================================= */

#cameraBox {
  display: none;

  position: relative;

  width: 100%;

  overflow: hidden;

  background: #111;

  border-radius: 14px;

  margin-bottom: 10px;
}

#video {
  display: block;

  width: 100%;
  height: auto;
}


/*
   LOCKED WHITE FRAME

   73 × 98 proportions
*/

#cardGuide {
  position: absolute;

  width: 73%;

  aspect-ratio: 73 / 98;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border: 3px solid white;

  border-radius: 14px;

  pointer-events: none;
}


/*
   Inner green corners show approximately
   where the ACTUAL 63 × 88 card should sit.

   This is only a subtle guide.
*/

#actualCardGuide {
  position: absolute;

  left: 6.85%;
  right: 6.85%;

  top: 5.1%;
  bottom: 5.1%;

  border: 1px dashed rgba(80,255,120,.65);

  border-radius: 9px;

  pointer-events: none;
}

#cameraMessage {
  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  padding: 6px 10px;

  background: rgba(0,0,0,.72);
  color: white;

  border-radius: 20px;

  font-size: 11px;

  white-space: nowrap;

  pointer-events: none;
}


/* =========================================
   LIVE MATCH INFORMATION
========================================= */

#scanInfo {
  display: none;

  padding: 12px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;
}

#scanInfoTitle {
  text-align: center;

  font-weight: bold;
  font-size: 14px;
}

#liveBest {
  margin-top: 7px;

  text-align: center;

  font-size: 18px;
  font-weight: bold;
}

#liveScore {
  margin-top: 3px;

  text-align: center;

  color: #666;

  font-size: 12px;
}

#topMatches {
  margin-top: 10px;

  padding: 8px;

  background: #eee;

  border-radius: 8px;

  font-size: 12px;
  line-height: 1.6;
}


/* =========================================
   DETECTED CARD
========================================= */

#detectedCard {
  display: none;

  padding: 15px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;

  text-align: center;
}

#detectedLabel {
  margin-bottom: 8px;

  color: #777;

  font-size: 13px;
}

#detectedImage {
  width: 190px;
  max-width: 70%;

  border-radius: 7px;
}

#detectedNumber {
  margin-top: 8px;

  font-size: 25px;
  font-weight: bold;
}

#detectedSet {
  margin-top: 3px;

  color: #666;

  font-size: 14px;
}

#detectedConfidence {
  margin-top: 5px;

  color: #666;

  font-size: 12px;
}

#correctButton {
  margin-top: 13px;

  background: #4caf50;
  color: white;
}

#wrongButton {
  margin-top: 7px;

  background: #ddd;
  color: #222;
}

.smallText {
  margin-top: 7px;

  text-align: center;

  color: #777;

  font-size: 12px;
  line-height: 1.4;
}


/*
   Hidden canvases used by scanner
*/

.hiddenCanvas {
  display: none;
}

</style>

</head>


<body>

<div class="container">


<h1>Pokémon Card Scanner</h1>


<div class="section">

<label for="setSelector">
Set being scanned
</label>


<select id="setSelector">

<option value="destined-rivals">
Destined Rivals
</option>

</select>


<button
  id="startButton"
  onclick="startScanner()"
>
📷 START VISUAL SCANNER
</button>


<button
  id="stopButton"
  onclick="stopScanner()"
>
STOP CAMERA
</button>


<div class="smallText">

The scanner now compares the whole card with the selected set.

</div>

</div>



<div id="status"></div>



<div id="libraryBox">

<div id="libraryText">

Preparing card library...

</div>


<div id="progressOuter">

<div id="progressInner"></div>

</div>

</div>



<div id="cameraBox">


<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<div id="cardGuide">

<div id="actualCardGuide"></div>

</div>


<div id="cameraMessage">

Hold card flat and steady

</div>


</div>



<div id="scanInfo">


<div id="scanInfoTitle">

LIVE VISUAL MATCH

</div>


<div id="liveBest">

Waiting for card...

</div>


<div id="liveScore"></div>


<div id="topMatches"></div>


</div>



<div id="detectedCard">


<div id="detectedLabel">

VISUAL MATCH

</div>


<img id="detectedImage">


<div id="detectedNumber"></div>


<div id="detectedSet"></div>


<div id="detectedConfidence"></div>


<button
  id="correctButton"
  onclick="confirmCard()"
>
✓ CORRECT
</button>


<button
  id="wrongButton"
  onclick="rejectCard()"
>
✕ WRONG — TRY AGAIN
</button>


</div>



<canvas
  id="captureCanvas"
  class="hiddenCanvas"
></canvas>


<canvas
  id="fingerprintCanvas"
  class="hiddenCanvas"
></canvas>


</div>



<script>


/* =================================================
   SET INFORMATION
================================================= */

const SETS = {

  "destined-rivals": {

    name: "Destined Rivals",

    code: "DRI",

    denominator: 182,

    maxNumber: 244,

    imageSet: "sv10"

  }

};



/* =================================================
   VISUAL FINGERPRINT SIZE

   We deliberately keep this fairly small.

   The scanner does NOT compare millions of pixels.
   It compares the overall visual structure of cards.
================================================= */

const FP_WIDTH = 24;

const FP_HEIGHT = 34;



/* =================================================
   VARIABLES
================================================= */

let cameraStream = null;

let scannerRunning = false;

let scannerPaused = false;

let scanBusy = false;

let scanTimer = null;


let referenceLibrary = [];

let libraryReady = false;


let lastBestNumber = null;

let consecutiveMatches = 0;


let detectedNumber = null;



/* =================================================
   START
================================================= */

async function startScanner() {

  try {

    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    document.getElementById(
      "scanInfo"
    ).style.display =
      "block";


    document.getElementById(
      "startButton"
    ).style.display =
      "none";


    document.getElementById(
      "stopButton"
    ).style.display =
      "block";


    scannerRunning = true;

    scannerPaused = false;


    /*
       Build reference library once.
    */

    if (!libraryReady) {

      await buildReferenceLibrary();

    }


    if (!libraryReady) {

      setStatus(
        "Could not build the card reference library.",
        "error"
      );

      return;
    }


    setStatus(
      "Ready — hold a card in the frame.",
      "working"
    );


    scheduleScan(700);

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Camera error: " + error.message,
      "error"
    );

  }

}



/* =================================================
   BUILD REFERENCE LIBRARY
================================================= */

async function buildReferenceLibrary() {

  const setKey =
    document.getElementById(
      "setSelector"
    ).value;


  const set =
    SETS[setKey];


  referenceLibrary = [];


  document.getElementById(
    "libraryBox"
  ).style.display =
    "block";


  /*
     Process in small batches.

     This is kinder to the browser than requesting
     all 244 images simultaneously.
  */

  const batchSize = 8;


  for (
    let start = 1;
    start <= set.maxNumber;
    start += batchSize
  ) {

    const promises = [];


    for (
      let number = start;
      number < start + batchSize;
      number++
    ) {

      if (
        number > set.maxNumber
      ) {

        break;

      }


      promises.push(

        loadReferenceCard(
          set,
          number
        )

      );

    }


    const results =
      await Promise.all(
        promises
      );


    for (
      const result of results
    ) {

      if (result) {

        referenceLibrary.push(
          result
        );

      }

    }


    const finished =
      Math.min(
        start + batchSize - 1,
        set.maxNumber
      );


    const percent =
      Math.round(
        finished /
        set.maxNumber *
        100
      );


    document.getElementById(
      "progressInner"
    ).style.width =
      percent + "%";


    document.getElementById(
      "libraryText"
    ).innerText =

      "Preparing Destined Rivals: " +

      finished +

      " / " +

      set.maxNumber;

  }



  if (
    referenceLibrary.length <
    200
  ) {

    console.error(
      "Too many reference images failed."
    );


    libraryReady = false;

    return;

  }


  libraryReady = true;


  document.getElementById(
    "libraryText"
  ).innerText =

    "✓ " +

    referenceLibrary.length +

    " reference cards ready";


  setTimeout(

    function() {

      document.getElementById(
        "libraryBox"
      ).style.display =
        "none";

    },

    1200

  );

}



/* =================================================
   LOAD ONE REFERENCE CARD
================================================= */

function loadReferenceCard(
  set,
  number
) {

  return new Promise(

    function(resolve) {

      const image =
        new Image();


      image.crossOrigin =
        "anonymous";


      image.onload =
        function() {

          try {

            const descriptor =
              makeDescriptorFromImage(
                image
              );


            resolve({

              number:
                number,

              descriptor:
                descriptor

            });

          }

          catch (error) {

            console.error(
              "Reference processing failed:",
              number,
              error
            );


            resolve(null);

          }

        };


      image.onerror =
        function() {

          console.error(
            "Reference image failed:",
            number
          );


          resolve(null);

        };


      image.src =

        "https://images.pokemontcg.io/" +

        set.imageSet +

        "/" +

        number +

        ".png";

    }

  );

}



/* =================================================
   CREATE REFERENCE DESCRIPTOR
================================================= */

function makeDescriptorFromImage(image) {

  const canvas =
    document.getElementById(
      "fingerprintCanvas"
    );


  canvas.width =
    FP_WIDTH;


  canvas.height =
    FP_HEIGHT;


  const ctx =
    canvas.getContext(

      "2d",

      {
        willReadFrequently:
          true
      }

    );


  ctx.drawImage(

    image,

    0,
    0,

    FP_WIDTH,
    FP_HEIGHT

  );


  return createDescriptor(
    ctx,
    FP_WIDTH,
    FP_HEIGHT
  );

}



/* =================================================
   DESCRIPTOR

   Each tiny block stores:

   brightness
   red
   green
   blue

   Brightness is weighted more heavily later.
================================================= */

function createDescriptor(
  ctx,
  width,
  height
) {

  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    imageData.data;


  const descriptor =
    new Float32Array(
      width *
      height *
      4
    );


  let output =
    0;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const r =
      data[i] / 255;


    const g =
      data[i + 1] / 255;


    const b =
      data[i + 2] / 255;


    const brightness =

      r * 0.299 +

      g * 0.587 +

      b * 0.114;


    descriptor[output++] =
      brightness;


    descriptor[output++] =
      r;


    descriptor[output++] =
      g;


    descriptor[output++] =
      b;

  }


  return descriptor;

}



/* =================================================
   SCHEDULE SCAN
================================================= */

function scheduleScan(delay) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {

    return;

  }


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}



/* =================================================
   FIND ACTUAL CARD INSIDE WHITE FRAME

   White guide represents 73 × 98.

   Actual card represents 63 × 88.

   Therefore we remove approximately 5 mm from
   every side of the guide.
================================================= */

function getActualCardCrop(video) {

  const videoRect =
    video.getBoundingClientRect();


  const frameRect =
    document
      .getElementById("cardGuide")
      .getBoundingClientRect();


  /*
     Actual card position inside the
     73 × 98 guide.
  */

  const horizontalMargin =
    frameRect.width *
    (5 / 73);


  const verticalMargin =
    frameRect.height *
    (5 / 98);


  const cardLeft =

    frameRect.left +
    horizontalMargin;


  const cardTop =

    frameRect.top +
    verticalMargin;


  const cardWidth =

    frameRect.width -
    horizontalMargin * 2;


  const cardHeight =

    frameRect.height -
    verticalMargin * 2;



  /*
     Convert screen coordinates into
     camera pixels.
  */

  const scaleX =
    video.videoWidth /
    videoRect.width;


  const scaleY =
    video.videoHeight /
    videoRect.height;


  return {

    x:
      Math.round(
        (
          cardLeft -
          videoRect.left
        ) *
        scaleX
      ),

    y:
      Math.round(
        (
          cardTop -
          videoRect.top
        ) *
        scaleY
      ),

    width:
      Math.round(
        cardWidth *
        scaleX
      ),

    height:
      Math.round(
        cardHeight *
        scaleY
      )

  };

}



/* =================================================
   SCAN LIVE CARD
================================================= */

async function scanFrame() {

  if (
    !scannerRunning ||
    scannerPaused ||
    scanBusy ||
    !libraryReady
  ) {

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    scheduleScan(400);

    return;

  }


  scanBusy = true;


  try {

    const descriptor =
      createLiveDescriptor(
        video
      );


    const matches =
      compareAgainstLibrary(
        descriptor
      );


    if (
      matches.length === 0
    ) {

      scheduleScan(500);

      return;

    }


    displayLiveMatches(
      matches
    );


    const best =
      matches[0];


    /*
       We don't immediately accept one frame.

       The same card must win repeatedly.
    */

    if (
      best.number ===
      lastBestNumber
    ) {

      consecutiveMatches++;

    }

    else {

      lastBestNumber =
        best.number;


      consecutiveMatches =
        1;

    }



    /*
       Require three consecutive wins.
    */

    if (
      consecutiveMatches >= 3
    ) {

      showDetectedCard(
        best,
        matches
      );


      return;

    }

  }

  catch (error) {

    console.error(
      "Visual scan error:",
      error
    );

  }

  finally {

    scanBusy = false;

  }


  scheduleScan(500);

}



/* =================================================
   CREATE LIVE CARD DESCRIPTOR
================================================= */

function createLiveDescriptor(video) {

  const crop =
    getActualCardCrop(
      video
    );


  const canvas =
    document.getElementById(
      "captureCanvas"
    );


  canvas.width =
    FP_WIDTH;


  canvas.height =
    FP_HEIGHT;


  const ctx =
    canvas.getContext(

      "2d",

      {
        willReadFrequently:
          true
      }

    );


  ctx.drawImage(

    video,

    crop.x,
    crop.y,

    crop.width,
    crop.height,

    0,
    0,

    FP_WIDTH,
    FP_HEIGHT

  );


  return createDescriptor(
    ctx,
    FP_WIDTH,
    FP_HEIGHT
  );

}



/* =================================================
   COMPARE AGAINST ALL CARDS
================================================= */

function compareAgainstLibrary(
  liveDescriptor
) {

  const matches = [];


  for (
    const reference of
    referenceLibrary
  ) {

    const score =
      descriptorDistance(

        liveDescriptor,

        reference.descriptor

      );


    matches.push({

      number:
        reference.number,

      score:
        score

    });

  }


  matches.sort(

    function(a, b) {

      return (
        a.score -
        b.score
      );

    }

  );


  return matches.slice(
    0,
    3
  );

}



/* =================================================
   VISUAL DISTANCE

   Lower = more similar.

   Brightness/structure receives slightly more
   weight than colour.
================================================= */

function descriptorDistance(
  a,
  b
) {

  let total =
    0;


  let count =
    0;


  for (
    let i = 0;
    i < a.length;
    i += 4
  ) {

    const brightnessDifference =

      Math.abs(
        a[i] -
        b[i]
      );


    const redDifference =

      Math.abs(
        a[i + 1] -
        b[i + 1]
      );


    const greenDifference =

      Math.abs(
        a[i + 2] -
        b[i + 2]
      );


    const blueDifference =

      Math.abs(
        a[i + 3] -
        b[i + 3]
      );


    total +=

      brightnessDifference *
      1.6 +

      redDifference *
      0.55 +

      greenDifference *
      0.55 +

      blueDifference *
      0.55;


    count++;

  }


  return (
    total /
    count
  );

}



/* =================================================
   LIVE MATCH DISPLAY
================================================= */

function displayLiveMatches(
  matches
) {

  const set =
    SETS[
      document.getElementById(
        "setSelector"
      ).value
    ];


  const best =
    matches[0];


  document.getElementById(
    "liveBest"
  ).innerText =

    "Best: #" +

    String(
      best.number
    ).padStart(
      3,
      "0"
    );


  document.getElementById(
    "liveScore"
  ).innerText =

    "Visual distance: " +

    best.score.toFixed(4);



  let text =
    "Closest matches:\n";


  for (
    let i = 0;
    i < matches.length;
    i++
  ) {

    text +=

      (i + 1) +

      ". #" +

      String(
        matches[i].number
      ).padStart(
        3,
        "0"
      ) +

      "/" +

      set.denominator +

      " — " +

      matches[i].score.toFixed(4) +

      "\n";

  }


  document.getElementById(
    "topMatches"
  ).innerText =
    text;

}



/* =================================================
   SHOW DETECTED CARD
================================================= */

function showDetectedCard(
  best,
  matches
) {

  scannerPaused = true;


  detectedNumber =
    best.number;


  const set =
    SETS[
      document.getElementById(
        "setSelector"
      ).value
    ];


  const padded =
    String(
      best.number
    ).padStart(
      3,
      "0"
    );


  document.getElementById(
    "detectedNumber"
  ).innerText =

    "#" +
    padded +
    "/" +
    set.denominator;


  document.getElementById(
    "detectedSet"
  ).innerText =
    set.name;


  document.getElementById(
    "detectedConfidence"
  ).innerText =

    "Visual distance: " +

    best.score.toFixed(4);


  document.getElementById(
    "detectedImage"
  ).src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    best.number +

    ".png";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "block";


  setStatus(

    "Possible card match found.",

    "success"

  );


  document.getElementById(
    "detectedCard"
  ).scrollIntoView({

    behavior:
      "smooth",

    block:
      "center"

  });

}



/* =================================================
   CORRECT
================================================= */

function confirmCard() {

  setStatus(

    "✓ Match confirmed — hold up the next card.",

    "success"

  );


  prepareNextCard();

}



/* =================================================
   WRONG
================================================= */

function rejectCard() {

  setStatus(

    "Match rejected — scanning again...",

    "working"

  );


  prepareNextCard();

}



/* =================================================
   NEXT CARD
================================================= */

function prepareNextCard() {

  detectedNumber =
    null;


  lastBestNumber =
    null;


  consecutiveMatches =
    0;


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  scannerPaused =
    false;


  document.getElementById(
    "liveBest"
  ).innerText =

    "Waiting for card...";


  scheduleScan(
    500
  );

}



/* =================================================
   STOP
================================================= */

function stopScanner() {

  scannerRunning = false;

  scannerPaused = false;

  scanBusy = false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );


    scanTimer =
      null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );

  }


  cameraStream =
    null;


  document.getElementById(
    "video"
  ).srcObject =
    null;


  document.getElementById(
    "cameraBox"
  ).style.display =
    "none";


  document.getElementById(
    "scanInfo"
  ).style.display =
    "none";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "stopButton"
  ).style.display =
    "none";


  setStatus(

    "Camera stopped.",

    "working"

  );

}



/* =================================================
   STATUS
================================================= */

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    type;

}



/* =================================================
   CLEANUP
================================================= */

window.addEventListener(

  "pagehide",

  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );

    }

  }

);

</script>

</body>
</html>
