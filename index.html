<style>
* {

}

body {

  border: 3px solid white;

#scanInfo,
#detectedCard {

}

<body>

<div class="container">

<h1>Pokémon Card Scanner</h1>

<div class="section">

<label for="setSelector">Set being scanned</label>

<select id="setSelector">
  <option value="destined-rivals">Destined Rivals</option>
</select>

<button id="startButton" onclick="startScanner()">
📷 START SCANNER
</button>

<button id="stopButton" onclick="stopScanner()">
STOP CAMERA
</button>

<div class="smallText">
Put the card roughly inside the white frame.
<br>
You do not need to align it perfectly.
</div>

</div>

<div id="status"></div>

<div id="libraryBox">

<div id="libraryText">
Preparing reference cards...
</div>

<div id="progressOuter">
  <div id="progressInner"></div>
</div>

</div>

<div id="cameraBox">

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<canvas id="edgeOverlay"></canvas>

<div id="cardGuide"></div>

<div id="cameraMessage">
Hold one card roughly inside frame
</div>

</div>

<div id="cardPreviewSection">

<div id="cardPreviewTitle">
Card found by scanner:
</div>

<canvas id="warpedCanvas"></canvas>

<div id="edgeStatus">
Looking for card edges...
</div>

</div>

<div id="scanInfoTitle">
LIVE WHOLE-CARD MATCH
</div>

<div id="liveBest">
Waiting...
</div>

<div id="topMatches"></div>

</div>

<div style="font-size:13px;color:#777;margin-bottom:8px">
CARD MATCH
</div>

<img id="detectedImage">

<div id="detectedSet"></div>

<div id="detectedConfidence"></div>

<button id="correctButton" onclick="confirmCard()">
✓ CORRECT
</button>

<button id="wrongButton" onclick="rejectCard()">
✕ WRONG — TRY AGAIN
</button>

</div>

<canvas id="frameCanvas" class="hidden"></canvas>
<canvas id="descriptorCanvas" class="hidden"></canvas>

</div>

<script>

const SETS = {
  "destined-rivals": {
    name: "Destined Rivals",
    denominator: 182,
    maxNumber: 244,
    imageSet: "sv10"
  }
};

const DESCRIPTOR_WIDTH = 42;
const DESCRIPTOR_HEIGHT = 59;

let cameraStream = null;
let scannerRunning = false;
let scannerPaused = false;
let scanBusy = false;
let scanTimer = null;

let referenceLibrary = [];
let libraryReady = false;

let lastWinner = null;
let consecutiveWins = 0;

let detectedNumber = null;


/* ---------------------------------------------
   HELPERS
--------------------------------------------- */

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}


async function waitForOpenCv() {

  for (let i = 0; i < 150; i++) {

    if (
      typeof cv !== "undefined" &&
      cv &&
      cv.Mat
    ) {
      return true;
    }

    await sleep(100);
  }

  return false;
}


/* ---------------------------------------------
   START
--------------------------------------------- */

async function startScanner() {

  try {

    setStatus(
      "Loading card detection...",
      "working"
    );


    const cvReady =
      await waitForOpenCv();


    if (!cvReady) {

      setStatus(
        "OpenCV did not load. Refresh the page and try again.",
        "error"
      );

      return;
    }


    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    document.getElementById(
      "cardPreviewSection"
    ).style.display =
      "block";


    document.getElementById(
      "scanInfo"
    ).style.display =
      "block";


    document.getElementById(
      "startButton"
    ).style.display =
      "none";


    document.getElementById(
      "stopButton"
    ).style.display =
      "block";


    scannerRunning = true;
    scannerPaused = false;


    setupOverlay();


    if (!libraryReady) {

      await buildReferenceLibrary();

    }


    if (!libraryReady) {

      setStatus(
        "Reference library could not be prepared.",
        "error"
      );

      return;
    }


    setStatus(
      "Ready — hold a card roughly inside the frame.",
      "working"
    );


    scheduleScan(500);

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Scanner error: " +
      error.message,
      "error"
    );

  }

}


/* ---------------------------------------------
   OVERLAY
--------------------------------------------- */

function setupOverlay() {

  const video =
    document.getElementById("video");


  const overlay =
    document.getElementById(
      "edgeOverlay"
    );


  overlay.width =
    video.videoWidth;


  overlay.height =
    video.videoHeight;
}


/* ---------------------------------------------
   REFERENCE LIBRARY
--------------------------------------------- */

async function buildReferenceLibrary() {

  const set =
    SETS[
      document.getElementById(
        "setSelector"
      ).value
    ];


  referenceLibrary = [];


  document.getElementById(
    "libraryBox"
  ).style.display =
    "block";


  const batchSize =
    8;


  for (
    let start = 1;
    start <= set.maxNumber;
    start += batchSize
  ) {

    const requests = [];


    for (
      let number = start;
      number < start + batchSize &&
      number <= set.maxNumber;
      number++
    ) {

      requests.push(
        loadReferenceCard(
          set,
          number
        )
      );

    }


    const results =
      await Promise.all(
        requests
      );


    results.forEach(
      result => {

        if (result) {

          referenceLibrary.push(
            result
          );

        }

      }
    );


    const done =
      Math.min(
        start +
        batchSize -
        1,
        set.maxNumber
      );


    const percent =
      Math.round(
        done /
        set.maxNumber *
        100
      );


    document.getElementById(
      "progressInner"
    ).style.width =
      percent + "%";


    document.getElementById(
      "libraryText"
    ).innerText =
      "Preparing Destined Rivals: " +
      done +
      " / " +
      set.maxNumber;

  }


  libraryReady =
    referenceLibrary.length >
    200;


  if (libraryReady) {

    document.getElementById(
      "libraryText"
    ).innerText =
      "✓ " +
      referenceLibrary.length +
      " cards ready";


    setTimeout(
      () => {

        document.getElementById(
          "libraryBox"
        ).style.display =
          "none";

      },
      1000
    );

  }

}


/* ---------------------------------------------
   LOAD REFERENCE
--------------------------------------------- */

function loadReferenceCard(
  set,
  number
) {

  return new Promise(
    resolve => {

      const image =
        new Image();


      image.crossOrigin =
        "anonymous";


      image.onload =
        () => {

          try {

            resolve({

              number:
                number,

              descriptor:
                createImageDescriptor(
                  image
                )

            });

          }

          catch (error) {

            console.error(
              "Reference error:",
              number,
              error
            );


            resolve(null);

          }

        };


      image.onerror =
        () => {

          resolve(null);

        };


      image.src =
        "https://images.pokemontcg.io/" +
        set.imageSet +
        "/" +
        number +
        ".png";

    }
  );

}


/* ---------------------------------------------
   REFERENCE DESCRIPTOR
--------------------------------------------- */

function createImageDescriptor(
  image
) {

  const canvas =
    document.getElementById(
      "descriptorCanvas"
    );


  canvas.width =
    DESCRIPTOR_WIDTH;


  canvas.height =
    DESCRIPTOR_HEIGHT;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    image,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return descriptorFromCanvas(
    canvas
  );

}


/* ---------------------------------------------
   DESCRIPTOR
--------------------------------------------- */

function descriptorFromCanvas(
  canvas
) {

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  const pixels =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;


  let brightnessSum =
    0;


  let count =
    0;


  for (
    let i = 0;
    i < pixels.length;
    i += 4
  ) {

    brightnessSum +=

      (
        pixels[i] * 0.299 +

        pixels[i + 1] * 0.587 +

        pixels[i + 2] * 0.114

      ) / 255;


    count++;

  }


  const meanBrightness =
    brightnessSum /
    count;


  const descriptor =
    new Float32Array(
      count * 4
    );


  let output =
    0;


  for (
    let i = 0;
    i < pixels.length;
    i += 4
  ) {

    const r =
      pixels[i] / 255;


    const g =
      pixels[i + 1] / 255;


    const b =
      pixels[i + 2] / 255;


    const luminance =

      r * 0.299 +

      g * 0.587 +

      b * 0.114;


    descriptor[output++] =
      luminance -
      meanBrightness;


    descriptor[output++] =
      r;


    descriptor[output++] =
      g;


    descriptor[output++] =
      b;

  }


  return descriptor;

}


/* ---------------------------------------------
   SCAN LOOP
--------------------------------------------- */

function scheduleScan(
  delay
) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {
    return;
  }


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}


/* ---------------------------------------------
   WHITE GUIDE POSITION
--------------------------------------------- */

function getGuideCrop() {

  const video =
    document.getElementById(
      "video"
    );


  const videoRect =
    video.getBoundingClientRect();


  const guideRect =
    document.getElementById(
      "cardGuide"
    ).getBoundingClientRect();


  const scaleX =
    video.videoWidth /
    videoRect.width;


  const scaleY =
    video.videoHeight /
    videoRect.height;


  let x =

    (
      guideRect.left -
      videoRect.left
    ) *
    scaleX;


  let y =

    (
      guideRect.top -
      videoRect.top
    ) *
    scaleY;


  let width =
    guideRect.width *
    scaleX;


  let height =
    guideRect.height *
    scaleY;


  const extraX =
    width * 0.05;


  const extraY =
    height * 0.04;


  x -= extraX;
  y -= extraY;

  width +=
    extraX * 2;

  height +=
    extraY * 2;


  x =
    Math.max(
      0,
      x
    );


  y =
    Math.max(
      0,
      y
    );


  width =
    Math.min(
      video.videoWidth -
      x,
      width
    );


  height =
    Math.min(
      video.videoHeight -
      y,
      height
    );


  return {

    x:
      Math.round(x),

    y:
      Math.round(y),

    width:
      Math.round(width),

    height:
      Math.round(height)

  };

}


/* ---------------------------------------------
   SCAN FRAME
--------------------------------------------- */

async function scanFrame() {

  if (
    scanBusy ||
    scannerPaused ||
    !scannerRunning ||
    !libraryReady
  ) {
    return;
  }


  scanBusy =
    true;


  try {

    const result =
      detectAndWarpCard();


    if (!result) {

      clearEdgeOverlay();


      document.getElementById(
        "edgeStatus"
      ).innerText =
        "Looking for four card edges...";


      document.getElementById(
        "liveBest"
      ).innerText =
        "Waiting for card...";


      lastWinner =
        null;


      consecutiveWins =
        0;


      return;

    }


    drawDetectedEdges(
      result.displayPoints
    );


    document.getElementById(
      "edgeStatus"
    ).innerText =
      "✓ Card edges found";


    const liveDescriptor =
      createLiveDescriptor();


    const matches =
      compareAgainstLibrary(
        liveDescriptor
      );


    displayMatches(
      matches
    );


    const best =
      matches[0];


    if (
      best.number ===
      lastWinner
    ) {

      consecutiveWins++;

    }

    else {

      lastWinner =
        best.number;


      consecutiveWins =
        1;

    }


    if (
      consecutiveWins >= 4
    ) {

      showDetectedCard(
        best
      );

      return;

    }

  }

  catch (error) {

    console.error(
      "Scan frame failed:",
      error
    );

  }

  finally {

    scanBusy =
      false;


    if (
      scannerRunning &&
      !scannerPaused
    ) {

      scheduleScan(
        400
      );

    }

  }

}


/* ---------------------------------------------
   CARD EDGE DETECTION + PERSPECTIVE WARP
--------------------------------------------- */

function detectAndWarpCard() {

  const video =
    document.getElementById(
      "video"
    );


  const crop =
    getGuideCrop();


  const frameCanvas =
    document.getElementById(
      "frameCanvas"
    );


  frameCanvas.width =
    crop.width;


  frameCanvas.height =
    crop.height;


  const frameContext =
    frameCanvas.getContext(
      "2d"
    );


  frameContext.drawImage(

    video,

    crop.x,
    crop.y,

    crop.width,
    crop.height,

    0,
    0,

    crop.width,
    crop.height

  );


  let src =
    cv.imread(
      frameCanvas
    );


  let gray =
    new cv.Mat();


  let blurred =
    new cv.Mat();


  let edges =
    new cv.Mat();


  let contours =
    new cv.MatVector();


  let hierarchy =
    new cv.Mat();


  let kernel =
    null;


  try {

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    cv.GaussianBlur(
      gray,
      blurred,
      new cv.Size(5, 5),
      0
    );


    cv.Canny(
      blurred,
      edges,
      45,
      130
    );


    kernel =
      cv.Mat.ones(
        3,
        3,
        cv.CV_8U
      );


    cv.dilate(
      edges,
      edges,
      kernel
    );


    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );


    const frameArea =
      crop.width *
      crop.height;


    let bestPoints =
      null;


    let bestArea =
      0;


    for (
      let i = 0;
      i < contours.size();
      i++
    ) {

      const contour =
        contours.get(i);


      const area =
        Math.abs(
          cv.contourArea(
            contour
          )
        );


      if (
        area <
        frameArea * 0.30 ||

        area >
        frameArea * 0.93
      ) {

        contour.delete();

        continue;

      }


      const perimeter =
        cv.arcLength(
          contour,
          true
        );


      const approx =
        new cv.Mat();


      cv.approxPolyDP(
        contour,
        approx,
        0.025 *
        perimeter,
        true
      );


      if (
        approx.rows === 4 &&
        cv.isContourConvex(
          approx
        )
      ) {

        const points =
          matToPoints(
            approx
          );


        const ordered =
          orderCorners(
            points
          );


        const width =

          (
            distance(
              ordered[0],
              ordered[1]
            ) +

            distance(
              ordered[3],
              ordered[2]
            )

          ) / 2;


        const height =

          (
            distance(
              ordered[0],
              ordered[3]
            ) +

            distance(
              ordered[1],
              ordered[2]
            )

          ) / 2;


        const ratio =

          Math.min(
            width,
            height
          ) /

          Math.max(
            width,
            height
          );


        if (
          ratio > 0.58 &&
          ratio < 0.83 &&
          area > bestArea
        ) {

          bestArea =
            area;


          bestPoints =
            ordered;

        }

      }


      approx.delete();
      contour.delete();

    }


    if (!bestPoints) {

      return null;

    }


    let ordered =
      bestPoints;


    const detectedWidth =

      (
        distance(
          ordered[0],
          ordered[1]
        ) +

        distance(
          ordered[3],
          ordered[2]
        )

      ) / 2;


    const detectedHeight =

      (
        distance(
          ordered[0],
          ordered[3]
        ) +

        distance(
          ordered[1],
          ordered[2]
        )

      ) / 2;


    if (
      detectedWidth >
      detectedHeight
    ) {

      ordered = [

        ordered[1],
        ordered[2],
        ordered[3],
        ordered[0]

      ];

    }


    const OUTPUT_WIDTH =
      315;


    const OUTPUT_HEIGHT =
      440;


    const sourcePoints =
      cv.matFromArray(

        4,
        1,
        cv.CV_32FC2,

        [

          ordered[0].x,
          ordered[0].y,

          ordered[1].x,
          ordered[1].y,

          ordered[2].x,
          ordered[2].y,

          ordered[3].x,
          ordered[3].y

        ]

      );


    const destinationPoints =
      cv.matFromArray(

        4,
        1,
        cv.CV_32FC2,

        [

          0,
          0,

          OUTPUT_WIDTH - 1,
          0,

          OUTPUT_WIDTH - 1,
          OUTPUT_HEIGHT - 1,

          0,
          OUTPUT_HEIGHT - 1

        ]

      );


    const transform =
      cv.getPerspectiveTransform(
        sourcePoints,
        destinationPoints
      );


    const warped =
      new cv.Mat();


    cv.warpPerspective(

      src,
      warped,
      transform,

      new cv.Size(
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
      ),

      cv.INTER_LINEAR,
      cv.BORDER_CONSTANT,
      new cv.Scalar()

    );


    cv.imshow(
      "warpedCanvas",
      warped
    );


    const displayPoints =
      ordered.map(
        point => ({

          x:
            point.x +
            crop.x,

          y:
            point.y +
            crop.y

        })
      );


    sourcePoints.delete();
    destinationPoints.delete();
    transform.delete();
    warped.delete();


    return {

      displayPoints:
        displayPoints

    };

  }

  finally {

    if (kernel) {
      kernel.delete();
    }

    contours.delete();
    hierarchy.delete();
    edges.delete();
    blurred.delete();
    gray.delete();
    src.delete();

  }

}


/* ---------------------------------------------
   POINT HELPERS
--------------------------------------------- */

function matToPoints(
  mat
) {

  const points =
    [];


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    points.push({

      x:
        mat.data32S[
          i * 2
        ],

      y:
        mat.data32S[
          i * 2 + 1
        ]

    });

  }


  return points;

}


function orderCorners(
  points
) {

  const sums =
    points.map(
      point =>
        point.x +
        point.y
    );


  const differences =
    points.map(
      point =>
        point.y -
        point.x
    );


  const topLeft =
    points[
      sums.indexOf(
        Math.min(
          ...sums
        )
      )
    ];


  const bottomRight =
    points[
      sums.indexOf(
        Math.max(
          ...sums
        )
      )
    ];


  const topRight =
    points[
      differences.indexOf(
        Math.min(
          ...differences
        )
      )
    ];


  const bottomLeft =
    points[
      differences.indexOf(
        Math.max(
          ...differences
        )
      )
    ];


  return [

    topLeft,
    topRight,
    bottomRight,
    bottomLeft

  ];

}


function distance(
  a,
  b
) {

  return Math.hypot(

    a.x -
    b.x,

    a.y -
    b.y

  );

}


/* ---------------------------------------------
   GREEN EDGE OVERLAY
--------------------------------------------- */

function drawDetectedEdges(
  points
) {

  const overlay =
    document.getElementById(
      "edgeOverlay"
    );


  const ctx =
    overlay.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    overlay.width,
    overlay.height
  );


  ctx.strokeStyle =
    "#00ff66";


  ctx.lineWidth =
    8;


  ctx.beginPath();


  ctx.moveTo(
    points[0].x,
    points[0].y
  );


  for (
    let i = 1;
    i < points.length;
    i++
  ) {

    ctx.lineTo(
      points[i].x,
      points[i].y
    );

  }


  ctx.closePath();
  ctx.stroke();

}


function clearEdgeOverlay() {

  const overlay =
    document.getElementById(
      "edgeOverlay"
    );


  const ctx =
    overlay.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    overlay.width,
    overlay.height
  );

}


/* ---------------------------------------------
   LIVE DESCRIPTOR
--------------------------------------------- */

function createLiveDescriptor() {

  const warped =
    document.getElementById(
      "warpedCanvas"
    );


  const canvas =
    document.getElementById(
      "descriptorCanvas"
    );


  canvas.width =
    DESCRIPTOR_WIDTH;


  canvas.height =
    DESCRIPTOR_HEIGHT;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(

    warped,

    0,
    0,

    canvas.width,
    canvas.height

  );


  return descriptorFromCanvas(
    canvas
  );

}


/* ---------------------------------------------
   MATCHING
--------------------------------------------- */

function compareAgainstLibrary(
  liveDescriptor
) {

  const matches =
    referenceLibrary.map(
      reference => ({

        number:
          reference.number,

        score:
          descriptorDistance(

            liveDescriptor,

            reference.descriptor

          )

      })
    );


  matches.sort(
    (a, b) =>
      a.score -
      b.score
  );


  return matches.slice(
    0,
    5
  );

}


function descriptorDistance(
  a,
  b
) {

  let total =
    0;


  let count =
    0;


  for (
    let i = 0;
    i < a.length;
    i += 4
  ) {

    total +=

      Math.abs(
        a[i] -
        b[i]
      ) *
      1.8 +

      Math.abs(
        a[i + 1] -
        b[i + 1]
      ) *
      0.45 +

      Math.abs(
        a[i + 2] -
        b[i + 2]
      ) *
      0.45 +

      Math.abs(
        a[i + 3] -
        b[i + 3]
      ) *
      0.45;


    count++;

  }


  return total /
    count;

}


/* ---------------------------------------------
   DISPLAY MATCHES
--------------------------------------------- */

function displayMatches(
  matches
) {

  const set =
    SETS[
      document.getElementById(
        "setSelector"
      ).value
    ];


  const best =
    matches[0];


  document.getElementById(
    "liveBest"
  ).innerText =

    "Best: #" +

    String(
      best.number
    ).padStart(
      3,
      "0"
    );


  document.getElementById(
    "liveScore"
  ).innerText =

    "Visual distance: " +

    best.score.toFixed(
      4
    );


  document.getElementById(
    "topMatches"
  ).innerText =

    "Closest matches:\n" +

    matches.map(

      (
        match,
        index
      ) =>

        (
          index +
          1
        ) +

        ". #" +

        String(
          match.number
        ).padStart(
          3,
          "0"
        ) +

        "/" +

        set.denominator +

        " — " +

        match.score.toFixed(
          4
        )

    ).join(
      "\n"
    );

}


/* ---------------------------------------------
   FINAL MATCH
--------------------------------------------- */

function showDetectedCard(
  match
) {

  scannerPaused =
    true;


  detectedNumber =
    match.number;


  const set =
    SETS[
      document.getElementById(
        "setSelector"
      ).value
    ];


  const padded =
    String(
      match.number
    ).padStart(
      3,
      "0"
    );


  document.getElementById(
    "detectedNumber"
  ).innerText =

    "#" +
    padded +
    "/" +
    set.denominator;


  document.getElementById(
    "detectedSet"
  ).innerText =
    set.name;


  document.getElementById(
    "detectedConfidence"
  ).innerText =

    "Visual distance: " +

    match.score.toFixed(
      4
    );


  document.getElementById(
    "detectedImage"
  ).src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    match.number +

    ".png";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "block";


  setStatus(
    "Possible card match found.",
    "success"
  );

}


/* ---------------------------------------------
   NEXT CARD
--------------------------------------------- */

function confirmCard() {

  setStatus(
    "✓ Correct — hold up the next card.",
    "success"
  );


  prepareNextCard();

}


function rejectCard() {

  setStatus(
    "Trying again...",
    "working"
  );


  prepareNextCard();

}


function prepareNextCard() {

  detectedNumber =
    null;


  lastWinner =
    null;


  consecutiveWins =
    0;


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  scannerPaused =
    false;


  scheduleScan(
    500
  );

}


/* ---------------------------------------------
   STOP
--------------------------------------------- */

function stopScanner() {

  scannerRunning =
    false;


  scannerPaused =
    false;


  scanBusy =
    false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );


    scanTimer =
      null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  cameraStream =
    null;


  document.getElementById(
    "video"
  ).srcObject =
    null;


  clearEdgeOverlay();


  document.getElementById(
    "cameraBox"
  ).style.display =
    "none";


  document.getElementById(
    "cardPreviewSection"
  ).style.display =
    "none";


  document.getElementById(
    "scanInfo"
  ).style.display =
    "none";


  document.getElementById(
    "detectedCard"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "stopButton"
  ).style.display =
    "none";


  setStatus(
    "Camera stopped.",
    "working"
  );

}


/* ---------------------------------------------
   STATUS
--------------------------------------------- */

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    type;

}


window.addEventListener(
  "pagehide",
  () => {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);

</script>
