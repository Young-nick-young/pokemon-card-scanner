<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pokémon Inventory Scanner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:8px;
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  color:#222;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:19px;
  margin:4px 0 8px;
}

.box{
  background:white;
  border-radius:13px;
  padding:10px;
  margin-bottom:8px;
}

#topStatus{
  text-align:center;
  font-size:13px;
  font-weight:bold;
}

#progress{
  margin-top:3px;
  font-size:11px;
  font-weight:normal;
  color:#666;
}

#sheetStatus{
  margin-top:4px;
  text-align:center;
  font-size:10px;
  color:#777;
}

button{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:0;
  border-radius:9px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{opacity:.45}

#startButton{
  background:#222;
  color:white;
}

#scanButton{
  display:none;
  background:#1976d2;
  color:white;
  font-size:17px;
}

#cameraBox{
  display:none;
  position:relative;
  width:100%;
  overflow:hidden;
  background:#111;
  border-radius:13px;
  margin-bottom:8px;
}

#video{
  display:block;
  width:100%;
  height:auto;
}

/* LOCKED 73 × 98 GUIDE */
#cardGuide{
  position:absolute;
  width:73%;
  aspect-ratio:73 / 98;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px solid white;
  border-radius:14px;
  pointer-events:none;
}

#guideText{
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.72);
  color:white;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
  white-space:nowrap;
}

#cropCanvas{display:none}

#resultBox{
  display:none;
  background:white;
  border-radius:13px;
  padding:10px;
  margin-bottom:8px;
}

.resultTop{
  display:flex;
  align-items:center;
  gap:10px;
}

#selectedImage{
  width:75px;
  border-radius:6px;
}

.cardDetails{
  flex:1;
  min-width:0;
}

#selectedName{
  font-size:18px;
  font-weight:bold;
}

#selectedNumber{
  margin-top:2px;
  font-size:14px;
  font-weight:bold;
}

#selectedRarity,
#selectedType{
  margin-top:2px;
  font-size:11px;
  color:#666;
}

#recognitionInfo{
  margin-top:4px;
  font-size:10px;
  color:#34753e;
  font-weight:bold;
}

.variantGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px;
}

.variantGrid button{
  margin:0;
  min-height:50px;
  color:white;
  font-size:13px;
}

#normalButton{background:#1976d2}
#reverseButton{background:#7b1fa2}
#holoButton{background:#00897b}
#otherButton{background:#555}

.variantCount{
  display:block;
  margin-top:3px;
  font-size:11px;
  font-weight:normal;
  opacity:.9;
}

#wrongButton{
  background:#eee;
  color:#333;
  margin-top:7px;
  padding:9px;
  font-size:12px;
}

#savedMessage{
  display:none;
  background:#dff3e3;
  color:#176b2c;
  border-radius:8px;
  padding:8px;
  margin-top:7px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

#candidateBox{
  display:none;
}

.sectionTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:4px;
}

.helpText{
  font-size:11px;
  color:#666;
  margin-bottom:7px;
}

.candidate{
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px;
  margin-top:6px;
  border:2px solid #ddd;
  border-radius:9px;
  background:#fafafa;
  cursor:pointer;
}

.candidate:first-child{
  border-color:#8ab4f8;
  background:#eef5ff;
}

.candidate img{
  width:55px;
  border-radius:5px;
}

.candidateInfo{flex:1}

.candidateName{
  font-size:14px;
  font-weight:bold;
}

.candidateNumber{
  margin-top:2px;
  font-size:12px;
}

.candidateScore{
  margin-top:2px;
  font-size:10px;
  color:#777;
}

.choose{
  font-size:20px;
}

#manualArea{
  margin-top:10px;
  padding-top:9px;
  border-top:1px solid #ddd;
}

.manualRow{
  display:flex;
  gap:6px;
}

#manualNumber{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:16px;
}

#manualButton{
  width:auto;
  margin:0;
  background:#444;
  color:white;
  padding:10px 15px;
}

#manualError{
  display:none;
  color:#b00020;
  font-size:11px;
  margin-top:5px;
}

#sessionBox{
  text-align:center;
  font-size:11px;
  color:#555;
}

#sessionCount{
  font-size:18px;
  font-weight:bold;
  color:#222;
}
</style>
</head>

<body>

<div class="container">

<h1>Pokémon Inventory Scanner</h1>

<div class="box">

  <div id="topStatus">
    Preparing scanner...
    <div id="progress">
      Connecting to recognizer.
    </div>
  </div>

  <button id="startButton" disabled>
    PLEASE WAIT...
  </button>

  <button id="scanButton">
    🔍 SCAN CARD
  </button>

  <div id="sheetStatus">
    Connecting to Google Sheet...
  </div>

</div>

<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="cardGuide"></div>

  <div id="guideText">
    Place card inside white frame
  </div>

</div>

<canvas id="cropCanvas"></canvas>

<div id="resultBox">

  <div class="resultTop">

    <img id="selectedImage">

    <div class="cardDetails">

      <div id="selectedName"></div>
      <div id="selectedNumber"></div>
      <div id="selectedRarity"></div>
      <div id="selectedType"></div>
      <div id="recognitionInfo"></div>

    </div>

  </div>

  <div class="variantGrid">

    <button id="normalButton">
      + NORMAL
      <span id="normalCount" class="variantCount">
        Current: 0
      </span>
    </button>

    <button id="reverseButton">
      + REVERSE HOLO
      <span id="reverseCount" class="variantCount">
        Current: 0
      </span>
    </button>

    <button id="holoButton">
      + HOLO
      <span id="holoCount" class="variantCount">
        Current: 0
      </span>
    </button>

    <button id="otherButton">
      + OTHER
      <span id="otherCount" class="variantCount">
        Current: 0
      </span>
    </button>

  </div>

  <div id="savedMessage">
    ✓ Added to Google Sheet
  </div>

  <button id="wrongButton">
    WRONG CARD / OTHER MATCHES
  </button>

</div>

<div id="candidateBox" class="box">

  <div class="sectionTitle">
    Choose the correct card
  </div>

  <div class="helpText">
    Tap a match below or enter the card number.
  </div>

  <div id="candidateList"></div>

  <div id="manualArea">

    <div class="manualRow">

      <input
        id="manualNumber"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="Card #">

      <button id="manualButton">
        FIND
      </button>

    </div>

    <div id="manualError">
      Card number not found.
    </div>

  </div>

</div>

<div id="sessionBox" class="box">
  Cards added this session:
  <div id="sessionCount">0</div>
</div>

</div>

<iframe
  name="sheetUpdateFrame"
  id="sheetUpdateFrame"
  style="display:none">
</iframe>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const SCRIPT_URL =
"https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbwDF5oxhER534DF16jG94SHwJ9jS2ySAWJXIKgUsOpXjsdy26JKiu1FOIAsQnOqk_6f/exec";

const RECOGNIZER_URL =
"https://pokemon-card-recognizer.onrender.com";

const MAX_CARD = 244;
const IMAGE_SET = "sv10";
const DENOMINATOR = 182;

const UPLOAD_WIDTH = 360;
const UPLOAD_HEIGHT = 483;


/* =====================================================
   STATE
===================================================== */

let inventoryCards = [];
let inventoryByNumber = {};

let stream = null;

let rankedMatches = [];

let currentCard = null;
let currentRecognition = null;

let sessionAdded = 0;

let scanning = false;


/* =====================================================
   ELEMENTS
===================================================== */

const topStatus =
document.getElementById("topStatus");

const progress =
document.getElementById("progress");

const sheetStatus =
document.getElementById("sheetStatus");

const startButton =
document.getElementById("startButton");

const scanButton =
document.getElementById("scanButton");

const cameraBox =
document.getElementById("cameraBox");

const video =
document.getElementById("video");

const cardGuide =
document.getElementById("cardGuide");

const cropCanvas =
document.getElementById("cropCanvas");

const resultBox =
document.getElementById("resultBox");

const selectedImage =
document.getElementById("selectedImage");

const selectedName =
document.getElementById("selectedName");

const selectedNumber =
document.getElementById("selectedNumber");

const selectedRarity =
document.getElementById("selectedRarity");

const selectedType =
document.getElementById("selectedType");

const recognitionInfo =
document.getElementById("recognitionInfo");

const normalButton =
document.getElementById("normalButton");

const reverseButton =
document.getElementById("reverseButton");

const holoButton =
document.getElementById("holoButton");

const otherButton =
document.getElementById("otherButton");

const normalCount =
document.getElementById("normalCount");

const reverseCount =
document.getElementById("reverseCount");

const holoCount =
document.getElementById("holoCount");

const otherCount =
document.getElementById("otherCount");

const savedMessage =
document.getElementById("savedMessage");

const wrongButton =
document.getElementById("wrongButton");

const candidateBox =
document.getElementById("candidateBox");

const candidateList =
document.getElementById("candidateList");

const manualNumber =
document.getElementById("manualNumber");

const manualButton =
document.getElementById("manualButton");

const manualError =
document.getElementById("manualError");

const sessionCount =
document.getElementById("sessionCount");


/* =====================================================
   GOOGLE SHEET
===================================================== */

window.receiveCards = function(cards){

  inventoryCards = cards || [];
  inventoryByNumber = {};

  inventoryCards.forEach(card => {

    inventoryByNumber[
      Number(card.number)
    ] = card;

  });

  sheetStatus.innerText =
    `✓ Google Sheet connected • ${inventoryCards.length} cards`;
};


function loadInventory(){

  const script =
    document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?api=cards" +
    "&callback=receiveCards" +
    "&t=" +
    Date.now();

  script.onerror = function(){

    sheetStatus.innerText =
      "⚠ Google Sheet connection failed.";

  };

  document.body.appendChild(script);
}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

  loadInventory();

  setStatus(
    "Connecting to recognizer...",
    "Checking the Destined Rivals library."
  );

  try{

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        70000
      );

    const response =
      await fetch(
        RECOGNIZER_URL + "/",
        {
          cache:"no-store",
          signal:controller.signal
        }
      );

    clearTimeout(timeout);

    if(!response.ok){
      throw new Error(
        "Recognition server unavailable."
      );
    }

    let data =
      await response.json();

    if(!data.library_ready){

      setStatus(
        "Recognizer warming up...",
        "Preparing the card library."
      );

      for(let i=0;i<45;i++){

        await sleep(2000);

        const check =
          await fetch(
            RECOGNIZER_URL + "/",
            {cache:"no-store"}
          );

        data =
          await check.json();

        if(data.library_ready){
          break;
        }
      }
    }

    if(!data.library_ready){

      throw new Error(
        "Card library did not finish loading."
      );
    }

    setStatus(
      "✓ Scanner ready",
      "Press START CAMERA."
    );

    startButton.disabled = false;

    startButton.innerText =
      "📷 START CAMERA";

  }catch(error){

    console.error(error);

    setStatus(
      "Recognizer unavailable",
      "Render may be waking up. Refresh in about one minute."
    );
  }
}


function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );
}


function setStatus(
  title,
  message
){

  topStatus.childNodes[0].nodeValue =
    title;

  progress.innerText =
    message;
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }
        },

        audio:false
      });

    video.srcObject =
      stream;

    await video.play();

    cameraBox.style.display =
      "block";

    startButton.style.display =
      "none";

    scanButton.style.display =
      "block";

    setStatus(
      "Camera ready",
      "Place a card inside the white frame."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Camera could not start",
      error.message
    );
  }
}


/* =====================================================
   CAPTURE WHITE GUIDE
===================================================== */

function captureGuide(){

  const videoRect =
    video.getBoundingClientRect();

  const guideRect =
    cardGuide.getBoundingClientRect();

  const scaleX =
    video.videoWidth /
    videoRect.width;

  const scaleY =
    video.videoHeight /
    videoRect.height;

  let sourceX =
    (
      guideRect.left -
      videoRect.left
    ) * scaleX;

  let sourceY =
    (
      guideRect.top -
      videoRect.top
    ) * scaleY;

  let sourceWidth =
    guideRect.width *
    scaleX;

  let sourceHeight =
    guideRect.height *
    scaleY;

  sourceX =
    Math.max(
      0,
      sourceX
    );

  sourceY =
    Math.max(
      0,
      sourceY
    );

  sourceWidth =
    Math.min(
      sourceWidth,
      video.videoWidth-sourceX
    );

  sourceHeight =
    Math.min(
      sourceHeight,
      video.videoHeight-sourceY
    );

  cropCanvas.width =
    UPLOAD_WIDTH;

  cropCanvas.height =
    UPLOAD_HEIGHT;

  const ctx =
    cropCanvas.getContext(
      "2d",
      {alpha:false}
    );

  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";

  ctx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceWidth,
    sourceHeight,

    0,
    0,
    UPLOAD_WIDTH,
    UPLOAD_HEIGHT
  );

  return cropCanvas;
}


/* =====================================================
   JPEG
===================================================== */

function canvasToBlob(canvas){

  return new Promise(
    (resolve,reject) => {

      canvas.toBlob(
        blob => {

          if(blob){

            resolve(blob);

          }else{

            reject(
              new Error(
                "Could not capture card."
              )
            );
          }

        },

        "image/jpeg",
        0.82
      );
    }
  );
}


/* =====================================================
   SERVER RECOGNITION
===================================================== */

async function recognizeCard(blob){

  const formData =
    new FormData();

  formData.append(
    "file",
    blob,
    "card.jpg"
  );

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      90000
    );

  try{

    const response =
      await fetch(
        RECOGNIZER_URL +
        "/recognize",
        {
          method:"POST",
          body:formData,
          signal:controller.signal
        }
      );

    if(!response.ok){

      let message =
        "Recognition server error.";

      try{

        const errorData =
          await response.json();

        message =
          errorData.detail ||
          message;

      }catch(error){}

      throw new Error(
        message
      );
    }

    return await response.json();

  }catch(error){

    if(error.name === "AbortError"){

      throw new Error(
        "Recognition timed out. Scan again."
      );
    }

    throw error;

  }finally{

    clearTimeout(timeout);
  }
}


/* =====================================================
   SCAN
===================================================== */

async function scanCard(){

  if(scanning){
    return;
  }

  scanning = true;

  currentCard = null;
  currentRecognition = null;
  rankedMatches = [];

  resultBox.style.display =
    "none";

  candidateBox.style.display =
    "none";

  savedMessage.style.display =
    "none";

  scanButton.disabled =
    true;

  scanButton.innerText =
    "ANALYZING...";

  setStatus(
    "Recognizing card...",
    "Comparing card against Destined Rivals."
  );

  const slowMessage =
    setTimeout(
      () => {

        progress.innerText =
          "Still working — recognizer may be waking up.";

      },
      8000
    );

  try{

    const canvas =
      captureGuide();

    const blob =
      await canvasToBlob(
        canvas
      );

    const result =
      await recognizeCard(
        blob
      );

    clearTimeout(
      slowMessage
    );

    if(
      result.status !==
      "matched" ||
      !result.best_match
    ){

      throw new Error(
        "No reliable card match found."
      );
    }

    currentRecognition =
      result;

    rankedMatches =
      (result.top_matches || [])
      .map(
        match => ({

          number:
            Number(
              match.number
            ),

          good_matches:
            Number(
              match.good_matches || 0
            ),

          inliers:
            Number(
              match.inliers || 0
            ),

          inlier_ratio:
            Number(
              match.inlier_ratio || 0
            ),

          score:
            Number(
              match.score || 0
            )
        })
      );

    const bestNumber =
      Number(
        result.best_match.number
      );

    if(
      result.confident === true &&
      inventoryByNumber[
        bestNumber
      ]
    ){

      showCard(
        bestNumber,
        result.best_match
      );

      setStatus(
        "✓ Card recognized",
        "Tap the version below."
      );

    }else{

      showCandidates();

      setStatus(
        "Check the match",
        "Tap the correct card."
      );
    }

  }catch(error){

    clearTimeout(
      slowMessage
    );

    console.error(error);

    setStatus(
      "Scan failed",
      error.message
    );

  }finally{

    scanning = false;

    scanButton.disabled =
      false;

    scanButton.innerText =
      "🔍 SCAN CARD";
  }
}


/* =====================================================
   SHOW RECOGNIZED CARD
===================================================== */

function showCard(
  number,
  recognitionMatch=null
){

  const card =
    inventoryByNumber[
      Number(number)
    ];

  if(!card){

    setStatus(
      "Card unavailable",
      "Card was not found in Google Sheet."
    );

    return;
  }

  currentCard =
    card;

  selectedImage.src =
    `https://images.pokemontcg.io/${IMAGE_SET}/${Number(card.number)}.png`;

  selectedName.innerText =
    card.name;

  selectedNumber.innerText =
    "#" +
    String(card.number)
    .padStart(3,"0") +
    "/" +
    DENOMINATOR;

  selectedRarity.innerText =
    card.rarity || "";

  selectedType.innerText =
    card.type || "";

  if(recognitionMatch){

    const inliers =
      Number(
        recognitionMatch.inliers ||
        0
      );

    const ratio =
      Math.round(
        Number(
          recognitionMatch.inlier_ratio ||
          0
        ) * 100
      );

    recognitionInfo.innerText =
      `${inliers} verified matches` +
      (
        ratio
        ? ` • ${ratio}% agreement`
        : ""
      );

    recognitionInfo.style.display =
      "block";

  }else{

    recognitionInfo.style.display =
      "none";
  }

  updateCounts();

  if(card.reverse === null){

    reverseButton.style.display =
      "none";

  }else{

    reverseButton.style.display =
      "block";
  }

  resultBox.style.display =
    "block";

  candidateBox.style.display =
    "none";
}


/* =====================================================
   COUNTS
===================================================== */

function updateCounts(){

  if(!currentCard){
    return;
  }

  normalCount.innerText =
    "Current: " +
    (
      Number(
        currentCard.normal
      ) || 0
    );

  reverseCount.innerText =
    currentCard.reverse === null
    ? "Not available"
    : "Current: " +
      (
        Number(
          currentCard.reverse
        ) || 0
      );

  holoCount.innerText =
    "Current: " +
    (
      Number(
        currentCard.holo
      ) || 0
    );

  otherCount.innerText =
    "Current: " +
    (
      Number(
        currentCard.other
      ) || 0
    );
}


/* =====================================================
   ADD CARD
===================================================== */

function addCard(variant){

  if(!currentCard){
    return;
  }

  if(
    variant === "reverse" &&
    currentCard.reverse === null
  ){
    return;
  }

  disableVariantButtons(
    true
  );

  currentCard[variant] =
    (
      Number(
        currentCard[variant]
      ) || 0
    ) + 1;

  updateCounts();

  sessionAdded++;

  sessionCount.innerText =
    sessionAdded;

  const form =
    document.createElement(
      "form"
    );

  form.method =
    "POST";

  form.action =
    SCRIPT_URL;

  form.target =
    "sheetUpdateFrame";

  form.style.display =
    "none";

  const fields = {

    action:
      "changeQuantity",

    row:
      currentCard.row,

    variant:
      variant,

    change:
      1
  };

  Object.entries(
    fields
  ).forEach(
    ([name,value]) => {

      const input =
        document.createElement(
          "input"
        );

      input.type =
        "hidden";

      input.name =
        name;

      input.value =
        value;

      form.appendChild(
        input
      );
    }
  );

  document.body.appendChild(
    form
  );

  form.submit();

  setTimeout(
    () => form.remove(),
    1000
  );

  savedMessage.innerText =
    "✓ Added to Google Sheet";

  savedMessage.style.display =
    "block";

  setStatus(
    "✓ Card added",
    "Replace the card with the next one."
  );

  /*
    Very short confirmation.
    Then immediately return to scanning.
  */

  setTimeout(
    prepareNextCard,
    650
  );
}


/* =====================================================
   PREPARE NEXT CARD
===================================================== */

function prepareNextCard(){

  currentCard = null;
  currentRecognition = null;
  rankedMatches = [];

  resultBox.style.display =
    "none";

  candidateBox.style.display =
    "none";

  savedMessage.style.display =
    "none";

  manualNumber.value =
    "";

  manualError.style.display =
    "none";

  disableVariantButtons(
    false
  );

  scanButton.innerText =
    "🔍 SCAN CARD";

  setStatus(
    "Ready for next card",
    "Replace the card, then tap SCAN CARD."
  );

  /*
    Keep the page positioned around
    the camera/scanner rather than
    jumping down the page.
  */

  cameraBox.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
}


function disableVariantButtons(
  disabled
){

  normalButton.disabled =
    disabled;

  reverseButton.disabled =
    disabled;

  holoButton.disabled =
    disabled;

  otherButton.disabled =
    disabled;
}


/* =====================================================
   CANDIDATES
===================================================== */

function showCandidates(){

  candidateList.innerHTML =
    "";

  rankedMatches
  .slice(0,5)
  .forEach(
    match => {

      const card =
        inventoryByNumber[
          match.number
        ];

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "candidate";

      const image =
        document.createElement(
          "img"
        );

      image.src =
        `https://images.pokemontcg.io/${IMAGE_SET}/${match.number}.png`;

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "candidateInfo";

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "candidateName";

      name.innerText =
        card
        ? card.name
        : "Destined Rivals Card";

      const number =
        document.createElement(
          "div"
        );

      number.className =
        "candidateNumber";

      number.innerText =
        "#" +
        String(
          match.number
        ).padStart(
          3,
          "0"
        ) +
        "/" +
        DENOMINATOR;

      const score =
        document.createElement(
          "div"
        );

      score.className =
        "candidateScore";

      const ratio =
        Math.round(
          match.inlier_ratio *
          100
        );

      score.innerText =
        `${match.inliers} verified matches` +
        (
          ratio
          ? ` • ${ratio}%`
          : ""
        );

      const choose =
        document.createElement(
          "div"
        );

      choose.className =
        "choose";

      choose.innerText =
        "›";

      info.appendChild(
        name
      );

      info.appendChild(
        number
      );

      info.appendChild(
        score
      );

      row.appendChild(
        image
      );

      row.appendChild(
        info
      );

      row.appendChild(
        choose
      );

      row.addEventListener(
        "click",
        () => {

          showCard(
            match.number,
            match
          );

          setStatus(
            "Card selected",
            "Tap the version below."
          );
        }
      );

      candidateList.appendChild(
        row
      );
    }
  );

  candidateBox.style.display =
    "block";
}


/* =====================================================
   MANUAL CARD
===================================================== */

function findManualCard(){

  manualError.style.display =
    "none";

  const number =
    Number(
      manualNumber.value
    );

  if(
    !number ||
    number < 1 ||
    number > MAX_CARD
  ){

    manualError.innerText =
      "Enter a card number from 1 to 244.";

    manualError.style.display =
      "block";

    return;
  }

  if(
    !inventoryByNumber[
      number
    ]
  ){

    manualError.innerText =
      "Card not found in Google Sheet.";

    manualError.style.display =
      "block";

    return;
  }

  showCard(
    number,
    null
  );

  setStatus(
    "Card selected manually",
    "Tap the version below."
  );
}


/* =====================================================
   EVENTS
===================================================== */

startButton.addEventListener(
  "click",
  startCamera
);

scanButton.addEventListener(
  "click",
  scanCard
);

normalButton.addEventListener(
  "click",
  () => addCard("normal")
);

reverseButton.addEventListener(
  "click",
  () => addCard("reverse")
);

holoButton.addEventListener(
  "click",
  () => addCard("holo")
);

otherButton.addEventListener(
  "click",
  () => addCard("other")
);

wrongButton.addEventListener(
  "click",
  () => {

    resultBox.style.display =
      "none";

    if(
      rankedMatches.length
    ){

      showCandidates();

      setStatus(
        "Choose the correct card",
        "Tap a candidate below."
      );

    }else{

      candidateBox.style.display =
        "block";

      setStatus(
        "Enter card number",
        "Use the manual card number box."
      );
    }
  }
);

manualButton.addEventListener(
  "click",
  findManualCard
);

manualNumber.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      findManualCard();
    }
  }
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "pagehide",
  () => {

    if(stream){

      stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
    }
  }
);


/* =====================================================
   START
===================================================== */

initialize();

</script>

</body>
</html>
