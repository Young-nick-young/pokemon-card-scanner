<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>TCG Inventory Scanner</title>


  <!-- PWA -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <meta
    name="theme-color"
    content="#222222"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="TCG Scanner"
  >


  <!-- Styles -->
  <link
    rel="stylesheet"
    href="./css/styles.css"
  >

</head>


<body>


<!-- =====================================================
     ON-SCREEN CONFIRMATION TOAST
===================================================== -->

<div
  id="addToast"
  role="status"
  aria-live="polite"
>
  ✓ Added
</div>



<div class="app">


  <h1>
    Pokémon Inventory Scanner
  </h1>


  <div class="panel">


    <!-- =================================================
         SET SELECTOR
    ================================================== -->

    <div id="setSelectorArea">

      <label
        for="setSelector"
        id="setSelectorLabel"
      >
        SET
      </label>


      <select id="setSelector">

        <option value="destined-rivals">
          Destined Rivals
        </option>

        <option value="ascended-heroes">
          Ascended Heroes
        </option>

      </select>

    </div>



    <!-- =================================================
         SCANNER STATUS
    ================================================== -->

    <div id="status">
      Starting scanner...
    </div>



    <!-- =================================================
         CAMERA
    ================================================== -->

    <div id="cameraWrap">


      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>


      <!--
        IMPORTANT:
        Position and dimensions of this guide
        are controlled by styles.css.
      -->

      <div id="cardGuide"></div>


    </div>



    <!-- =================================================
         SCAN BUTTON
    ================================================== -->

    <button
      id="scanButton"
      disabled
    >
      PLEASE WAIT...
    </button>



    <!-- =================================================
         CARD RESULT
    ================================================== -->

    <div id="resultPanel">


      <!-- IDENTIFIED CARD -->

      <div id="identifiedRow">


        <img
          id="cardImage"
          alt=""
        >


        <div id="cardInfo">


          <div id="cardName">
            Card
          </div>


          <div id="cardNumber"></div>


          <div id="cardDetails"></div>


        </div>


      </div>



      <!-- =================================================
           VARIANT
      ================================================== -->

      <div id="variantTitle">
        TAP VARIANT
      </div>


      <div class="variantGrid">


        <button
          class="variantButton"
          data-variant="Normal"
        >
          Normal
        </button>


        <button
          class="variantButton"
          data-variant="Reverse Holo"
        >
          Reverse Holo
        </button>


        <button
          class="variantButton"
          data-variant="Holo"
        >
          Holo
        </button>


        <button
          class="variantButton"
          data-variant="Other"
        >
          Other
        </button>


      </div>



      <!-- =================================================
           QUANTITY
      ================================================== -->

      <div id="quantityArea">


        <div id="quantityTitle">
          QUANTITY
        </div>


        <div id="quantityMainRow">


          <button
            id="quantityMinus"
            type="button"
            aria-label="Decrease quantity"
          >
            −
          </button>


          <input
            id="quantityInput"
            type="number"
            inputmode="numeric"
            min="1"
            max="999"
            value="1"
          >


          <button
            id="quantityPlus"
            type="button"
            aria-label="Increase quantity"
          >
            +
          </button>


        </div>



        <div id="quantityQuickRow">


          <button
            class="quantityQuickButton"
            data-add="1"
            type="button"
          >
            +1
          </button>


          <button
            class="quantityQuickButton"
            data-add="5"
            type="button"
          >
            +5
          </button>


          <button
            class="quantityQuickButton"
            data-add="10"
            type="button"
          >
            +10
          </button>


        </div>



        <button
          id="confirmAddButton"
          type="button"
          disabled
        >
          ADD 1
        </button>


      </div>



      <!-- =================================================
           WRONG CARD / OTHER MATCHES
      ================================================== -->

      <button id="wrongButton">
        Wrong card / other matches
      </button>


      <div id="candidatePanel"></div>



      <!-- =================================================
           MANUAL CARD NUMBER
      ================================================== -->

      <div id="manualArea">


        <div id="manualRow">


          <input
            id="manualNumber"
            type="number"
            min="1"
            max="295"
            inputmode="numeric"
            placeholder="Card number"
          >


          <button id="manualButton">
            Find
          </button>


        </div>


      </div>



      <!--
        Existing message retained so current
        JavaScript does not lose this element.

        The new visible confirmation will use
        #addToast.
      -->

      <div id="addMessage">
        ✓ Added
      </div>


    </div>



    <!-- =================================================
         GOOGLE SHEET STATUS
    ================================================== -->

    <div id="sheetStatus">
      Connecting to Google Sheet...
    </div>


  </div>



  <!-- ===================================================
       SESSION
  ==================================================== -->

  <div class="panel sessionPanel">


    <div class="sessionLabel">
      Cards added this session
    </div>


    <div id="sessionCount">
      0
    </div>


    <button
      id="undoButton"
      disabled
    >
      ↶ UNDO LAST ADD
    </button>


  </div>


</div>



<!-- =====================================================
     CAPTURE CANVAS
===================================================== -->

<canvas id="captureCanvas"></canvas>



<!-- =====================================================
     SCANNER JAVASCRIPT
===================================================== -->

<script src="./js/config.js"></script>

<script src="./js/sets/destined-rivals.js"></script>
<script src="./js/sets/ascended-heroes.js"></script>

<script src="./js/camera.js"></script>
<script src="./js/recognizer.js"></script>
<script src="./js/inventory.js"></script>
<script src="./js/app.js"></script>


</body>

</html>
