<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Pokémon Card Inventory Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 21px;
  margin: 6px 0 14px;
}

.section {
  background: white;
  padding: 13px;
  border-radius: 14px;
  margin-bottom: 10px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 6px;
}

select {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

#startButton {
  margin-top: 10px;
  background: #222;
  color: white;
}

#stopButton {
  display: none;
  margin-top: 8px;
  background: #777;
  color: white;
}

#cameraBox {
  display: none;
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #111;
  border-radius: 14px;
  margin-bottom: 10px;
}

#video {
  display: block;
  width: 100%;
  height: auto;
}

/*
  The white box is INTENTIONALLY larger
  than the card.

  You do NOT need to line the card up
  perfectly with the border.
*/
#cardGuide {
  position: absolute;

  left: 7%;
  top: 3%;

  width: 86%;
  height: 94%;

  border: 3px solid white;
  border-radius: 16px;

  pointer-events: none;
}

/*
  This is only a rough visual guide.

  The real OCR crop has additional
  tolerance around this area.
*/
#numberGuide {
  position: absolute;

  left: 11%;
  top: 78%;

  width: 43%;
  height: 13%;

  border: 3px dashed #ffd600;
  border-radius: 8px;

  pointer-events: none;
}

#cameraMessage {
  position: absolute;

  left: 50%;
  top: 7px;

  transform: translateX(-50%);

  padding: 6px 10px;

  background: rgba(0,0,0,.7);
  color: white;

  border-radius: 20px;

  font-size: 11px;
  white-space: nowrap;

  pointer-events: none;
}

#status {
  display: none;

  padding: 11px;
  margin-bottom: 10px;

  border-radius: 9px;

  text-align: center;
  font-size: 14px;
}

.working {
  display: block !important;
  background: #fff3cd;
}

.success {
  display: block !important;
  background: #d4edda;
}

.error {
  display: block !important;
  background: #f8d7da;
}

#ocrPreviewSection {
  display: none;

  padding: 10px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;
}

#ocrPreviewLabel {
  margin-bottom: 6px;

  text-align: center;

  color: #666;

  font-size: 12px;
}

#ocrCanvas {
  display: block;

  width: 100%;
  max-height: 130px;

  object-fit: contain;

  background: white;

  border: 2px solid #333;
  border-radius: 8px;
}

#modeLabel {
  margin-top: 5px;

  text-align: center;

  color: #777;

  font-size: 11px;
}

#detectedCard {
  display: none;

  padding: 15px;
  margin-bottom: 10px;

  background: white;

  border-radius: 14px;

  text-align: center;
}

#detectedImage {
  width: 190px;
  max-width: 70%;

  border-radius: 7px;
}

#detectedNumber {
  margin-top: 8px;

  font-size: 25px;
  font-weight: bold;
}

#detectedSet {
  margin-top: 3px;

  color: #666;

  font-size: 14px;
}

#correctButton {
  margin-top: 13px;

  background: #4caf50;
  color: white;
}

#wrongButton {
  margin-top: 7px;

  background: #ddd;
  color: #222;
}

#debugBox {
  margin-top: 9px;

  padding: 9px;

  background: #eee;

  border-radius: 8px;

  font-size: 11px;
  text-align: left;

  word-break: break-word;
}

.smallText {
  margin-top: 7px;

  text-align: center;

  color: #777;

  font-size: 12px;
  line-height: 1.4;
}
</style>
</head>


<body>

<div class="container">

<h1>Pokémon Card Inventory</h1>


<div class="section">

<label for="setSelector">
Set being scanned
</label>

<select id="setSelector">

<option value="destined-rivals">
Destined Rivals
</option>

</select>


<button
id="startButton"
onclick="startScanner()"
>
📷 START SCANNER
</button>


<button
id="stopButton"
onclick="stopScanner()"
>
STOP CAMERA
</button>


<div class="smallText">

Keep the card roughly inside the white area.

<br>

Perfect alignment is not necessary.

</div>

</div>


<div id="status"></div>


<div id="cameraBox">

<video
id="video"
autoplay
playsinline
muted
></video>

<div id="cardGuide"></div>

<div id="numberGuide"></div>

<div id="cameraMessage">
Hold card roughly inside frame
</div>

</div>


<div id="ocrPreviewSection">

<div id="ocrPreviewLabel">
Scanner is reading this area:
</div>

<canvas id="ocrCanvas"></canvas>

<div id="modeLabel"></div>

</div>


<div id="detectedCard">

<div
style="
font-size:13px;
color:#777;
margin-bottom:8px;
"
>
CARD DETECTED
</div>


<img id="detectedImage">


<div id="detectedNumber"></div>

<div id="detectedSet"></div>


<button
id="correctButton"
onclick="confirmCard()"
>
✓ CORRECT
</button>


<button
id="wrongButton"
onclick="rejectCard()"
>
✕ WRONG — TRY AGAIN
</button>


<div id="debugBox"></div>

</div>

</div>



<script>

/*
=====================================================
SET CONFIGURATION

We will add your other sets here later.
=====================================================
*/

const SETS = {

  "destined-rivals": {

    name: "Destined Rivals",

    code: "DRI",

    denominator: 182,

    maxNumber: 244,

    imageSet: "sv10"

  }

};



/*
=====================================================
VARIABLES
=====================================================
*/

let cameraStream = null;

let scannerRunning = false;

let scannerPaused = false;

let scanBusy = false;

let scanTimer = null;

let ocrWorker = null;

let scanPass = 0;

let detectedNumber = null;



/*
=====================================================
START CAMERA
=====================================================
*/

async function startScanner() {

  if (scannerRunning) {

    scannerPaused = false;

    scheduleScan(400);

    return;

  }


  try {

    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    await video.play();


    document
      .getElementById("cameraBox")
      .style.display =
      "block";


    document
      .getElementById("ocrPreviewSection")
      .style.display =
      "block";


    document
      .getElementById("startButton")
      .style.display =
      "none";


    document
      .getElementById("stopButton")
      .style.display =
      "block";


    scannerRunning = true;

    scannerPaused = false;


    setStatus(
      "Loading scanner...",
      "working"
    );


    await createOcrWorker();


    setStatus(
      "Ready — hold a card in the frame.",
      "working"
    );


    scheduleScan(500);

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Camera error: " + error.message,
      "error"
    );

  }

}



/*
=====================================================
OCR WORKER
=====================================================
*/

async function createOcrWorker() {

  if (ocrWorker) {
    return;
  }


  ocrWorker =
    await Tesseract.createWorker(
      "eng"
    );


  await ocrWorker.setParameters({

    tessedit_char_whitelist:
      "0123456789/| ",

    tessedit_pageseg_mode:
      "7",

    preserve_interword_spaces:
      "1"

  });

}



/*
=====================================================
SCHEDULE NEXT FRAME
=====================================================
*/

function scheduleScan(delay) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {
    return;
  }


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}



/*
=====================================================
SCAN FRAME
=====================================================
*/

async function scanFrame() {

  if (
    !scannerRunning ||
    scannerPaused ||
    scanBusy
  ) {
    return;
  }


  const video =
    document.getElementById("video");


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    scheduleScan(400);

    return;

  }


  scanBusy = true;


  try {

    const canvas =
      document.getElementById(
        "ocrCanvas"
      );


    const ctx =
      canvas.getContext(

        "2d",

        {
          willReadFrequently: true
        }

      );


    /*
    =================================================
    OCR TARGETS

    These are intentionally slightly different.

    The scanner automatically tries them one after
    another so you do not have to perfectly position
    every card.
    =================================================
    */

    const passes = [

      /*
        PASS 1

        Tight crop around expected number.
      */

      {
        name: "Number focus",

        x: 0.10,
        y: 0.795,

        w: 0.45,
        h: 0.105,

        mode: "contrast"
      },


      /*
        PASS 2

        Slightly wider / taller.
      */

      {
        name: "Number focus — wide",

        x: 0.08,
        y: 0.765,

        w: 0.50,
        h: 0.145,

        mode: "gray"
      },


      /*
        PASS 3

        Original colour is useful on cards
        where grayscale loses the text.
      */

      {
        name: "Number focus — colour",

        x: 0.08,
        y: 0.765,

        w: 0.50,
        h: 0.145,

        mode: "colour"
      },


      /*
        PASS 4

        Wider emergency search.
      */

      {
        name: "Wide fallback",

        x: 0.07,
        y: 0.73,

        w: 0.58,
        h: 0.19,

        mode: "contrast"
      }

    ];


    const pass =

      passes[
        scanPass %
        passes.length
      ];


    scanPass++;


    document
      .getElementById("modeLabel")
      .innerText =
      pass.name;



    /*
    =================================================
    VIDEO CROP
    =================================================
    */

    const sourceX =

      Math.floor(

        video.videoWidth *
        pass.x

      );


    const sourceY =

      Math.floor(

        video.videoHeight *
        pass.y

      );


    const sourceWidth =

      Math.floor(

        video.videoWidth *
        pass.w

      );


    const sourceHeight =

      Math.floor(

        video.videoHeight *
        pass.h

      );



    /*
      Enlarge the tiny number substantially.
    */

    const targetWidth =
      1900;


    const scale =

      targetWidth /
      sourceWidth;


    const targetHeight =

      Math.max(

        1,

        Math.round(

          sourceHeight *
          scale

        )

      );


    canvas.width =
      targetWidth;


    canvas.height =
      targetHeight;



    ctx.drawImage(

      video,

      sourceX,
      sourceY,

      sourceWidth,
      sourceHeight,

      0,
      0,

      canvas.width,
      canvas.height

    );



    /*
    =================================================
    IMAGE ENHANCEMENT
    =================================================
    */

    if (
      pass.mode !== "colour"
    ) {

      const imageData =

        ctx.getImageData(

          0,
          0,

          canvas.width,
          canvas.height

        );


      const pixels =
        imageData.data;


      for (

        let i = 0;

        i < pixels.length;

        i += 4

      ) {

        const gray =

          pixels[i] * 0.299 +

          pixels[i + 1] * 0.587 +

          pixels[i + 2] * 0.114;


        let value =
          gray;



        /*
          Contrast mode keeps shades,
          unlike our earlier threshold version.
        */

        if (
          pass.mode === "contrast"
        ) {

          value =

            (
              gray - 128
            )

            * 1.7

            + 128;


          value =

            Math.max(

              0,

              Math.min(

                255,

                value

              )

            );

        }



        pixels[i] =
          value;


        pixels[i + 1] =
          value;


        pixels[i + 2] =
          value;

      }


      ctx.putImageData(

        imageData,

        0,
        0

      );

    }



    setStatus(

      "Looking for collector number...",

      "working"

    );



    /*
    =================================================
    OCR
    =================================================
    */

    const result =

      await ocrWorker.recognize(
        canvas
      );


    let text =

      (
        result.data.text ||
        ""
      )

      .replace(
        /\n/g,
        " "
      )

      .replace(
        /[Oo]/g,
        "0"
      )

      .replace(
        /[Il]/g,
        "1"
      )

      .replace(
        /\s+/g,
        " "
      )

      .trim();


    console.log(

      pass.name,

      "OCR:",

      text

    );



    const number =

      extractCollectorNumber(
        text
      );



    if (
      number !== null
    ) {

      showDetectedCard(

        number,

        text,

        pass.name

      );


      return;

    }

  }

  catch (error) {

    console.error(

      "Scanner error:",

      error

    );

  }

  finally {

    scanBusy =
      false;

  }


  scheduleScan(
    300
  );

}



/*
=====================================================
EXTRACT COLLECTOR NUMBER
=====================================================
*/

function extractCollectorNumber(text) {

  const setKey =

    document
      .getElementById(
        "setSelector"
      )
      .value;


  const set =
    SETS[
      setKey
    ];


  const denominator =
    set.denominator;



  /*
    Normal:

    034/182
  */

  let pattern =

    new RegExp(

      "(\\d{1,3})\\s*[\\/|]\\s*" +

      denominator +

      "\\b"

    );


  let match =

    text.match(
      pattern
    );



  /*
    OCR loses slash:

    034 182
  */

  if (!match) {

    pattern =

      new RegExp(

        "\\b(\\d{1,3})\\s+" +

        denominator +

        "\\b"

      );


    match =

      text.match(
        pattern
      );

  }



  /*
    OCR joins everything:

    034182
  */

  if (!match) {

    pattern =

      new RegExp(

        "\\b(\\d{1,3})" +

        denominator +

        "\\b"

      );


    match =

      text.match(
        pattern
      );

  }



  /*
    Occasionally OCR recognises the slash
    but spaces digits slightly.
  */

  if (!match) {

    const cleaned =

      text.replace(
        /\s/g,
        ""
      );


    pattern =

      new RegExp(

        "(\\d{1,3})[\\/|]" +

        denominator

      );


    match =

      cleaned.match(
        pattern
      );

  }



  if (!match) {

    return null;

  }



  const number =

    parseInt(
      match[1],
      10
    );


  if (
    number < 1 ||
    number > set.maxNumber
  ) {

    return null;

  }


  return number;

}



/*
=====================================================
SHOW DETECTED CARD
=====================================================
*/

function showDetectedCard(
  number,
  ocrText,
  mode
) {

  scannerPaused =
    true;


  detectedNumber =
    number;


  const setKey =

    document
      .getElementById(
        "setSelector"
      )
      .value;


  const set =
    SETS[
      setKey
    ];


  const paddedNumber =

    String(
      number
    )

    .padStart(
      3,
      "0"
    );



  document
    .getElementById(
      "detectedNumber"
    )
    .innerText =

    "#" +

    paddedNumber +

    "/" +

    set.denominator;



  document
    .getElementById(
      "detectedSet"
    )
    .innerText =

    set.name;



  document
    .getElementById(
      "detectedImage"
    )
    .src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    number +

    ".png";



  document
    .getElementById(
      "debugBox"
    )
    .innerText =

    "Recognition mode: " +

    mode +

    "\nOCR read: " +

    ocrText;



  document
    .getElementById(
      "detectedCard"
    )
    .style.display =

    "block";



  setStatus(

    "✓ Card detected!",

    "success"

  );



  document
    .getElementById(
      "detectedCard"
    )
    .scrollIntoView({

      behavior:
        "smooth",

      block:
        "center"

    });

}



/*
=====================================================
CORRECT
=====================================================
*/

function confirmCard() {

  const setKey =

    document
      .getElementById(
        "setSelector"
      )
      .value;


  const set =
    SETS[
      setKey
    ];


  const padded =

    String(
      detectedNumber
    )

    .padStart(
      3,
      "0"
    );


  setStatus(

    "✓ " +

    set.name +

    " #" +

    padded +

    " recognised. Hold up the next card.",

    "success"

  );


  prepareNextCard();

}



/*
=====================================================
WRONG
=====================================================
*/

function rejectCard() {

  setStatus(

    "Trying again...",

    "working"

  );


  prepareNextCard();

}



/*
=====================================================
NEXT CARD
=====================================================
*/

function prepareNextCard() {

  detectedNumber =
    null;


  document
    .getElementById(
      "detectedCard"
    )
    .style.display =

    "none";


  scannerPaused =
    false;


  scanPass =
    0;


  scheduleScan(
    450
  );

}



/*
=====================================================
STOP CAMERA
=====================================================
*/

function stopScanner() {

  scannerRunning =
    false;


  scannerPaused =
    false;


  scanBusy =
    false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

    scanTimer =
      null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );


    cameraStream =
      null;

  }


  document
    .getElementById(
      "video"
    )
    .srcObject =

    null;


  document
    .getElementById(
      "cameraBox"
    )
    .style.display =

    "none";


  document
    .getElementById(
      "ocrPreviewSection"
    )
    .style.display =

    "none";


  document
    .getElementById(
      "detectedCard"
    )
    .style.display =

    "none";


  document
    .getElementById(
      "startButton"
    )
    .style.display =

    "block";


  document
    .getElementById(
      "stopButton"
    )
    .style.display =

    "none";


  setStatus(

    "Camera stopped.",

    "working"

  );

}



/*
=====================================================
STATUS
=====================================================
*/

function setStatus(
  message,
  type
) {

  const status =

    document
      .getElementById(
        "status"
      );


  status.innerText =
    message;


  status.className =
    type;

}



/*
=====================================================
CLEAN UP
=====================================================
*/

window.addEventListener(

  "pagehide",

  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );

    }

  }

);

</script>

</body>
</html>
