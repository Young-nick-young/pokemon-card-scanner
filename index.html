<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Pokémon Card Inventory Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 6px 0 16px;
    }

    .section {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #222;
      color: white;
      margin-top: 12px;
    }

    #stopButton {
      display: none;
      background: #777;
      color: white;
      margin-top: 8px;
    }

    #cameraBox {
      display: none;
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #111;
      border-radius: 14px;
      margin-bottom: 10px;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      background: #111;
    }

    #cardGuide {
      position: absolute;

      left: 11%;
      top: 5%;

      width: 78%;
      height: 90%;

      border: 3px solid white;
      border-radius: 14px;

      pointer-events: none;
    }

    #numberGuide {
      position: absolute;

      left: 13%;
      top: 78%;

      width: 48%;
      height: 15%;

      border: 3px dashed #ffd600;
      border-radius: 8px;

      pointer-events: none;
    }

    #cameraMessage {
      position: absolute;

      left: 50%;
      top: 6px;

      transform: translateX(-50%);

      background: rgba(0,0,0,.65);
      color: white;

      padding: 6px 10px;

      border-radius: 20px;

      font-size: 11px;

      white-space: nowrap;

      pointer-events: none;
    }

    #status {
      display: none;

      padding: 12px;

      border-radius: 9px;

      text-align: center;

      margin-bottom: 12px;

      font-size: 14px;
    }

    .working {
      display: block !important;
      background: #fff3cd;
    }

    .success {
      display: block !important;
      background: #d4edda;
    }

    .error {
      display: block !important;
      background: #f8d7da;
    }

    #ocrPreviewSection {
      display: none;
      background: white;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
    }

    #ocrPreviewLabel {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 6px;
    }

    #ocrCanvas {
      display: block;
      width: 100%;
      max-height: 140px;
      object-fit: contain;
      background: white;
      border: 2px solid #333;
      border-radius: 8px;
    }

    #detectedCard {
      display: none;

      background: white;

      border-radius: 14px;

      padding: 16px;

      text-align: center;

      margin-bottom: 12px;
    }

    #detectedImage {
      width: 190px;
      max-width: 70%;
      border-radius: 7px;
    }

    #detectedNumber {
      font-size: 25px;
      font-weight: bold;
      margin-top: 10px;
    }

    #detectedSet {
      font-size: 15px;
      color: #666;
      margin-top: 3px;
    }

    #correctButton {
      margin-top: 14px;
      background: #4caf50;
      color: white;
    }

    #wrongButton {
      margin-top: 8px;
      background: #ddd;
      color: #222;
    }

    #debugBox {
      display: block;

      background: #eee;

      padding: 10px;

      border-radius: 8px;

      margin-top: 10px;

      font-size: 11px;

      word-break: break-word;

      text-align: left;
    }

    .smallText {
      text-align: center;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
      margin-top: 8px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Pokémon Card Inventory</h1>


  <div class="section">

    <label for="setSelector">
      Set being scanned
    </label>

    <select id="setSelector">
      <option value="destined-rivals">
        Destined Rivals
      </option>
    </select>


    <button
      id="startButton"
      onclick="startScanner()"
    >
      📷 START SCANNER
    </button>


    <button
      id="stopButton"
      onclick="stopScanner()"
    >
      STOP CAMERA
    </button>


    <div class="smallText">
      Hold one card inside the white frame.
      <br>
      Keep the collector number inside the yellow dashed box.
    </div>

  </div>


  <div id="status"></div>


  <div id="cameraBox">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div id="cardGuide"></div>

    <div id="numberGuide"></div>

    <div id="cameraMessage">
      Keep whole card inside frame
    </div>

  </div>


  <div id="ocrPreviewSection">

    <div id="ocrPreviewLabel">
      Scanner is trying to read this:
    </div>

    <canvas id="ocrCanvas"></canvas>

  </div>


  <div id="detectedCard">

    <div
      style="
        font-size:13px;
        color:#777;
        margin-bottom:8px;
      "
    >
      CARD DETECTED
    </div>


    <img id="detectedImage">


    <div id="detectedNumber"></div>


    <div id="detectedSet"></div>


    <button
      id="correctButton"
      onclick="confirmCard()"
    >
      ✓ CORRECT
    </button>


    <button
      id="wrongButton"
      onclick="rejectCard()"
    >
      ✕ WRONG CARD — KEEP SCANNING
    </button>


    <div id="debugBox"></div>

  </div>


</div>



<script>

/*
===========================================================
SET DATABASE
===========================================================
*/

const SETS = {

  "destined-rivals": {

    name:
      "Destined Rivals",

    code:
      "DRI",

    denominator:
      182,

    maxNumber:
      244,

    imageSet:
      "sv10"

  }

};



/*
===========================================================
SCANNER VARIABLES
===========================================================
*/

let cameraStream =
  null;

let scannerRunning =
  false;

let scannerPaused =
  false;

let scanBusy =
  false;

let scanTimer =
  null;

let ocrWorker =
  null;

let scanStyle =
  0;

let detectedNumber =
  null;



/*
===========================================================
START CAMERA
===========================================================
*/

async function startScanner() {

  if (scannerRunning) {

    scannerPaused =
      false;

    setStatus(
      "Scanner ready — hold a card inside the frame.",
      "working"
    );

    scheduleScan(
      500
    );

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      "Your browser does not support live camera scanning.",
      "error"
    );

    return;
  }


  try {

    setStatus(
      "Starting camera...",
      "working"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1080
          },

          height: {
            ideal: 1920
          }

        },

        audio:
          false

      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      cameraStream;


    await video.play();


    document
      .getElementById(
        "cameraBox"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "ocrPreviewSection"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "startButton"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "stopButton"
      )
      .style.display =
      "block";


    scannerRunning =
      true;


    scannerPaused =
      false;


    setStatus(
      "Loading card reader...",
      "working"
    );


    await createOcrWorker();


    setStatus(
      "Scanner ready — hold a card inside the frame.",
      "working"
    );


    scheduleScan(
      700
    );


  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      "Camera error: " +
      error.message,
      "error"
    );

  }

}



/*
===========================================================
OCR WORKER
===========================================================
*/

async function createOcrWorker() {

  if (ocrWorker) {
    return;
  }


  ocrWorker =
    await Tesseract.createWorker(
      "eng"
    );


  await ocrWorker.setParameters({

    tessedit_char_whitelist:
      "0123456789/| ",

    preserve_interword_spaces:
      "1"

  });

}



/*
===========================================================
SCHEDULE SCAN
===========================================================
*/

function scheduleScan(delay) {

  if (
    !scannerRunning ||
    scannerPaused
  ) {
    return;
  }


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}



/*
===========================================================
SCAN LIVE VIDEO
===========================================================
*/

async function scanFrame() {

  if (
    !scannerRunning ||
    scannerPaused ||
    scanBusy
  ) {
    return;
  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    scheduleScan(
      500
    );

    return;
  }


  scanBusy =
    true;


  try {

    const canvas =
      document.getElementById(
        "ocrCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    /*
      Three slightly different
      bottom-left crops.
    */

    const attempts = [

      {
        x: 0.13,
        y: 0.77,
        w: 0.48,
        h: 0.16,
        threshold: 150
      },

      {
        x: 0.12,
        y: 0.74,
        w: 0.52,
        h: 0.19,
        threshold: 175
      },

      {
        x: 0.11,
        y: 0.79,
        w: 0.55,
        h: 0.14,
        threshold: 200
      }

    ];


    const pass =
      attempts[
        scanStyle %
        attempts.length
      ];


    scanStyle++;


    const sourceX =
      Math.floor(
        video.videoWidth *
        pass.x
      );


    const sourceY =
      Math.floor(
        video.videoHeight *
        pass.y
      );


    const sourceWidth =
      Math.floor(
        video.videoWidth *
        pass.w
      );


    const sourceHeight =
      Math.floor(
        video.videoHeight *
        pass.h
      );


    /*
      Enlarge the tiny collector number.
    */

    const targetWidth =
      1600;


    const scale =
      targetWidth /
      sourceWidth;


    const targetHeight =
      Math.max(
        1,
        Math.floor(
          sourceHeight *
          scale
        )
      );


    canvas.width =
      targetWidth;


    canvas.height =
      targetHeight;


    ctx.drawImage(

      video,

      sourceX,
      sourceY,
      sourceWidth,
      sourceHeight,

      0,
      0,
      canvas.width,
      canvas.height

    );


    /*
      Convert image to high contrast.
    */

    const imageData =
      ctx.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    const pixels =
      imageData.data;


    for (
      let i = 0;
      i < pixels.length;
      i += 4
    ) {

      const gray =

        pixels[i] * 0.299 +

        pixels[i + 1] * 0.587 +

        pixels[i + 2] * 0.114;


      const value =

        gray >
        pass.threshold

          ? 255
          : 0;


      pixels[i] =
        value;


      pixels[i + 1] =
        value;


      pixels[i + 2] =
        value;

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


    setStatus(
      "Reading collector number...",
      "working"
    );


    const result =

      await ocrWorker.recognize(
        canvas
      );


    let text =

      (
        result.data.text ||
        ""
      )

      .replace(
        /\n/g,
        " "
      )

      .replace(
        /[Oo]/g,
        "0"
      )

      .replace(
        /[Il]/g,
        "1"
      )

      .trim();


    console.log(
      "OCR READ:",
      text
    );


    const number =
      extractCollectorNumber(
        text
      );


    if (
      number !== null
    ) {

      showDetectedCard(
        number,
        text
      );

      return;
    }


  }

  catch (error) {

    console.error(
      "Scanner error:",
      error
    );

  }

  finally {

    scanBusy =
      false;

  }


  scheduleScan(
    450
  );

}



/*
===========================================================
READ COLLECTOR NUMBER
===========================================================
*/

function extractCollectorNumber(text) {

  const setKey =

    document
      .getElementById(
        "setSelector"
      )
      .value;


  const set =
    SETS[
      setKey
    ];


  const denominator =
    set.denominator;


  const pattern1 =

    new RegExp(

      "(\\d{1,3})\\s*[\\/|]\\s*" +

      denominator +

      "\\b"

    );


  let match =
    text.match(
      pattern1
    );


  if (!match) {

    const pattern2 =

      new RegExp(

        "\\b(\\d{1,3})\\s+" +

        denominator +

        "\\b"

      );


    match =
      text.match(
        pattern2
      );

  }


  if (!match) {

    return null;

  }


  const number =
    parseInt(
      match[1],
      10
    );


  if (
    number < 1 ||
    number > set.maxNumber
  ) {

    return null;

  }


  return number;

}



/*
===========================================================
SHOW DETECTED CARD
===========================================================
*/

function showDetectedCard(
  number,
  ocrText
) {

  scannerPaused =
    true;


  detectedNumber =
    number;


  const setKey =

    document
      .getElementById(
        "setSelector"
      )
      .value;


  const set =
    SETS[
      setKey
    ];


  const paddedNumber =

    String(
      number
    )
    .padStart(
      3,
      "0"
    );


  document
    .getElementById(
      "detectedNumber"
    )
    .innerText =

    "#" +
    paddedNumber +
    "/" +
    set.denominator;


  document
    .getElementById(
      "detectedSet"
    )
    .innerText =
    set.name;


  document
    .getElementById(
      "detectedImage"
    )
    .src =

    "https://images.pokemontcg.io/" +

    set.imageSet +

    "/" +

    number +

    ".png";


  document
    .getElementById(
      "detectedCard"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "debugBox"
    )
    .innerText =

    "OCR read: " +
    ocrText;


  setStatus(
    "Card detected — check that it is correct.",
    "success"
  );


  document
    .getElementById(
      "detectedCard"
    )
    .scrollIntoView({

      behavior:
        "smooth",

      block:
        "center"

    });

}



/*
===========================================================
CONFIRM CARD
===========================================================
*/

function confirmCard() {

  const setKey =

    document
      .getElementById(
        "setSelector"
      )
      .value;


  const set =
    SETS[
      setKey
    ];


  const paddedNumber =

    String(
      detectedNumber
    )
    .padStart(
      3,
      "0"
    );


  setStatus(

    "✓ Correct: " +
    set.name +
    " #" +
    paddedNumber +
    ". Hold up the next card.",

    "success"

  );


  prepareNextCard();

}



/*
===========================================================
WRONG CARD
===========================================================
*/

function rejectCard() {

  setStatus(
    "Trying that card again.",
    "working"
  );


  prepareNextCard();

}



/*
===========================================================
NEXT CARD
===========================================================
*/

function prepareNextCard() {

  detectedNumber =
    null;


  document
    .getElementById(
      "detectedCard"
    )
    .style.display =
    "none";


  scannerPaused =
    false;


  scheduleScan(
    700
  );

}



/*
===========================================================
STOP SCANNER
===========================================================
*/

function stopScanner() {

  scannerRunning =
    false;


  scannerPaused =
    false;


  scanBusy =
    false;


  if (scanTimer) {

    clearTimeout(
      scanTimer
    );

    scanTimer =
      null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    cameraStream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  video.srcObject =
    null;


  document
    .getElementById(
      "cameraBox"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "ocrPreviewSection"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "startButton"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "stopButton"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "detectedCard"
    )
    .style.display =
    "none";


  setStatus(
    "Camera stopped.",
    "working"
  );

}



/*
===========================================================
STATUS MESSAGE
===========================================================
*/

function setStatus(
  message,
  type
) {

  const status =

    document
      .getElementById(
        "status"
      );


  status.innerText =
    message;


  status.className =
    type;

}



/*
===========================================================
CLEAN UP CAMERA
===========================================================
*/

window.addEventListener(

  "pagehide",

  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }

);

</script>

</body>

</html>
